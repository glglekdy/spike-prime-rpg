<script>
/* ==== src/core/font.js ==== */
/* ============================================================
 *  SPIKE.Font — 도트 한글 텍스트
 *
 *  폰트 파일을 임베드하지 않고 "진짜 도트"를 얻는 방법:
 *    1) 시스템 폰트로 오프스크린 캔버스에 1배 크기로 그린다
 *    2) 알파값을 이진화(threshold)해서 안티에일리어싱 회색을 날린다
 *    3) 남은 픽셀을 지정 색으로 칠하고, 1px 검정 그림자를 깐다
 *    4) 결과 캔버스를 문자열 단위로 캐시
 *  이 캔버스가 다시 화면 전체 정수배(×3) 확대를 타면서
 *  1픽셀이 3×3 블록이 되어 쯔꾸르 감성이 나온다.
 * ============================================================ */
(function (S) {
  'use strict';

  /* ------------------------------------------------------------
   *  크기 사다리
   *
   *  Mona 는 비트맵 폰트라 **설계 크기와 그 정수배에서만** 선명하다.
   *  11px·13px 로 그리면 브라우저가 외곽선을 보간해 뭉개진다 (실측 확인).
   *  그래서 코드가 요청한 크기를 가장 가까운 "선명한 크기"로 스냅한다.
   *
   *    9~11  → Mona10 @10      12~17 → Mona12 @12
   *    18~25 → Mona10 @20      26~33 → Mona12 @24
   *    34~45 → Mona10 @40      46~   → Mona12 @48
   *
   *  ui.ko.json 의 font.ladder 로 통째로 갈아끼울 수 있다.
   * ---------------------------------------------------------- */
  var LADDER = [
    { max: 11,   family: 'Mona10', px: 10 },
    { max: 17,   family: 'Mona12', px: 12 },
    { max: 25,   family: 'Mona10', px: 20 },
    { max: 33,   family: 'Mona12', px: 24 },
    { max: 45,   family: 'Mona10', px: 40 },
    { max: 9999, family: 'Mona12', px: 48 }
  ];
  var FALLBACK = "Dotum,'돋움',monospace";

  var Font = S.Font = {
    ladder: LADDER,
    fallback: FALLBACK,
    threshold: 96,      // binarize 가 켜졌을 때만 쓰인다
    binarize: false,    // 진짜 픽셀 폰트라 이진화하면 오히려 획이 깨진다 (실측)
                        //   ui.ko.json 의 font.{ladder,fallback,threshold,binarize} 로 바꾼다
    cache: new Map(),
    _measureCtx: null,

    /* ------------------------------------------------------------
     *  웹폰트 선로딩
     *
     *  canvas 의 ctx.font 는 웹폰트 로드를 유발하지 않는다. 그래서 아무 처리 없이
     *  게임을 띄우면 첫 화면이 fallback(돋움)으로 그려지고, 그 결과가 글자 캐시에
     *  영구히 박힌다. 실제로 배포본에서 타이틀이 깨진 채 굳는 것을 확인했다.
     *
     *  그래서 사다리에 등장하는 폰트를 명시적으로 로드하고, 끝나면 캐시를 비운다.
     *  폰트가 없거나 느려도 부스가 멈추면 안 되므로 3초 뒤에는 그냥 진행한다.
     * ---------------------------------------------------------- */
    preload: function () {
      var self = this;
      if (typeof document === 'undefined' || !document.fonts || !document.fonts.load) {
        return Promise.resolve();
      }
      var want = {};
      this.ladder.forEach(function (L) { want[L.family] = L.px; });

      var jobs = Object.keys(want).map(function (fam) {
        return document.fonts.load(want[fam] + 'px "' + fam + '"')
          .catch(function () { /* 폰트가 없으면 fallback 으로 간다 */ });
      });

      var loaded = Promise.all(jobs)
        .then(function () { return document.fonts.ready; })
        .then(function () { self.cache.clear(); });

      var timeout = new Promise(function (res) { setTimeout(res, 3000); });
      return Promise.race([loaded, timeout]).then(function () { self.cache.clear(); });
    },

    /* 요청 크기 → { css, px } */
    snap: function (size) {
      var L = this.ladder;
      for (var i = 0; i < L.length; i++) {
        if (size <= L[i].max) {
          return { css: "'" + L[i].family + "'," + this.fallback, px: L[i].px };
        }
      }
      var last = L[L.length - 1];
      return { css: "'" + last.family + "'," + this.fallback, px: last.px };
    },

    /* 문자열 픽셀 폭 (그림자 1px 포함). 스냅된 실제 크기로 잰다 */
    measure: function (text, size) {
      if (!this._measureCtx) {
        var c = document.createElement('canvas');
        this._measureCtx = c.getContext('2d');
      }
      var f = this.snap(size);
      var ctx = this._measureCtx;
      ctx.font = f.px + 'px ' + f.css;
      return Math.ceil(ctx.measureText(text).width) + 1;
    },

    lineHeight: function (size) { return size + 4; },

    /* 캐시된 도트 텍스트 캔버스 얻기 */
    get: function (text, size, color, shadow) {
      var key = size + '|' + color + '|' + (shadow ? 1 : 0) + '|' + text;
      var hit = this.cache.get(key);
      if (hit) return hit;
      var made = this._render(text, size, color, shadow);
      // 캐시가 너무 커지면 앞쪽부터 버린다 (순환형이라 문자열 종류는 유한)
      if (this.cache.size > 1200) {
        var firstKey = this.cache.keys().next().value;
        this.cache.delete(firstKey);
      }
      this.cache.set(key, made);
      return made;
    },

    _render: function (text, size, color, shadow) {
      var pad = 2;
      var f = this.snap(size);
      var w = this.measure(text, size) + pad * 2;
      var h = f.px + pad * 2 + 4;

      // --- 1) 흰색으로 글자만 그린다 ---
      var src = document.createElement('canvas');
      src.width = w; src.height = h;
      var sctx = src.getContext('2d', { willReadFrequently: true });
      sctx.font = f.px + 'px ' + f.css;
      sctx.textBaseline = 'top';
      sctx.fillStyle = '#ffffff';
      sctx.fillText(text, pad, pad);

      // --- 2) 알파 이진화 (픽셀 폰트를 쓸 때는 건너뛴다) ---
      if (this.binarize !== false) {
        var img = sctx.getImageData(0, 0, w, h);
        var d = img.data, th = this.threshold;
        for (var i = 0; i < d.length; i += 4) {
          d[i + 3] = d[i + 3] >= th ? 255 : 0;
        }
        sctx.putImageData(img, 0, 0);
      }

      // --- 3) 그림자 + 색 입히기 ---
      var out = document.createElement('canvas');
      out.width = w + 1; out.height = h + 1;
      var octx = out.getContext('2d');
      octx.imageSmoothingEnabled = false;

      if (shadow !== false) {
        octx.drawImage(src, 1, 1);
        octx.globalCompositeOperation = 'source-in';
        octx.fillStyle = '#000000';
        octx.fillRect(0, 0, out.width, out.height);
        octx.globalCompositeOperation = 'source-over';
      }

      // 본문은 별도 캔버스에서 색칠한 뒤 합성 (그림자를 덮어쓰지 않도록)
      var body = document.createElement('canvas');
      body.width = w; body.height = h;
      var bctx = body.getContext('2d');
      bctx.imageSmoothingEnabled = false;
      bctx.drawImage(src, 0, 0);
      bctx.globalCompositeOperation = 'source-in';
      bctx.fillStyle = color || '#ffffff';
      bctx.fillRect(0, 0, w, h);

      octx.drawImage(body, 0, 0);

      out._ox = pad;              // 실제 글자 시작 오프셋
      out._oy = pad;
      out._tw = w - pad * 2;      // 정렬 계산용 순수 글자 폭
      return out;
    },

    /* 줄바꿈: 우선 공백에서 끊고, 한 덩어리가 너무 길면 글자 단위로 끊는다 */
    wrap: function (text, size, maxWidth) {
      var lines = [];
      var paragraphs = String(text).split('\n');
      for (var p = 0; p < paragraphs.length; p++) {
        var words = paragraphs[p].split(' ');
        var line = '';
        for (var i = 0; i < words.length; i++) {
          var test = line ? line + ' ' + words[i] : words[i];
          if (this.measure(test, size) <= maxWidth) { line = test; continue; }
          if (line) { lines.push(line); line = ''; }
          // 단어 자체가 넘치면 글자 단위 분할
          var chunk = words[i];
          while (this.measure(chunk, size) > maxWidth) {
            var cut = chunk.length;
            while (cut > 1 && this.measure(chunk.slice(0, cut), size) > maxWidth) cut--;
            lines.push(chunk.slice(0, cut));
            chunk = chunk.slice(cut);
          }
          line = chunk;
        }
        lines.push(line);
      }
      return lines;
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/text.js ==== */
/* ============================================================
 *  SPIKE.Text — 외부 JSON 텍스트 리소스 + 언어 전환
 *
 *  게임에 나오는 모든 글자를 코드에서 분리해 JSON 으로 관리한다.
 *    content/ui.<lang>.json        UI (버튼·라벨·가이드 문구·폰트 설정)
 *    content/dialogue.<lang>.json  대사 (NPC·장인·전투·엔딩)
 *    content/parts.<lang>.json     부품 도감
 *    content/quiz.<lang>.json      퀴즈 문제·해설
 *
 *  키는 영어 점 표기법.  S.T('common.next')   S.D('village.gran.intro')
 *
 *  불러오는 경로 3가지 — 앞에서부터 우선한다
 *    1) <script type="application/json" id="spike-<kind>-<lang>"> 인라인  (배포본)
 *    2) fetch(data-src)                                                  (개발 서버)
 *    3) 없으면 코드의 fallback                                            (안전망)
 *
 *  언어 전환: 타이틀 화면의 버튼 또는 S.Text.setLang('en').
 *  부스에서 강사가 한 번 정하면 학생이 바뀌어도 유지된다 (State.reset 과 무관).
 *
 *  재빌드 없이 문구 고치기: JSON 을 화면에 드래그&드롭 하거나 F4.
 *  (file:// 에서도 된다 — FileReader 는 CORS 를 타지 않는다)
 * ============================================================ */
(function (S) {
  'use strict';

  var KINDS = ['ui', 'dialogue', 'parts', 'quiz'];

  var Text = S.Text = {
    KINDS: KINDS,

    lang: 'ko',
    langs: ['ko'],          // 실제로 불러온 언어들 (토글 순서)
    store: {},              // store[lang][kind] = 객체
    missing: {},            // 참조됐지만 없는 키 (스모크 테스트가 검사한다)
    onChange: null,         // 언어·내용이 바뀔 때 (도감/퀴즈 재구성용)

    /* ---------------- 조회 ---------------- */

    ns: function (kind) {
      var l = this.store[this.lang];
      return (l && l[kind]) || {};
    },

    _dig: function (root, key) {
      var parts = String(key).split('.');
      var cur = root;
      for (var i = 0; i < parts.length; i++) {
        if (cur == null || typeof cur !== 'object') return undefined;
        cur = cur[parts[i]];
      }
      return cur;
    },

    get: function (kind, key, fallback) {
      var v = this._dig(this.ns(kind), key);
      if (v === undefined || v === null) {
        this.missing[kind + ':' + key] = true;
        return fallback !== undefined ? fallback : '[' + key + ']';
      }
      return v;
    },

    t: function (key, fb) { return this.get('ui', key, fb); },
    d: function (key, fb) { return this.get('dialogue', key, fb); },

    /* 반드시 배열로 */
    list: function (kind, key) {
      var v = this.get(kind, key, null);
      if (v == null) return [];
      return Array.isArray(v) ? v : [v];
    },

    /* {name} 치환 */
    fmt: function (str, vars) {
      if (!vars) return str;
      return String(str).replace(/\{(\w+)\}/g, function (m, k) {
        return vars[k] !== undefined ? vars[k] : m;
      });
    },

    /* ---------------- 적용 ---------------- */

    apply: function (kind, obj, lang) {
      if (!obj || typeof obj !== 'object') return false;
      lang = lang || (obj.meta && obj.meta.lang) || this.lang;
      if (!this.store[lang]) this.store[lang] = {};
      this.store[lang][kind] = obj;
      if (this.langs.indexOf(lang) < 0) this.langs.push(lang);
      if (kind === 'ui' && lang === this.lang) this._applyFont(obj.font);
      return true;
    },

    /* ui.json 의 font 설정을 반영 (폰트 교체용 훅) */
    _applyFont: function (f) {
      if (!f || !S.Font) return;
      if (Array.isArray(f.ladder) && f.ladder.length) S.Font.ladder = f.ladder;
      if (f.fallback) S.Font.fallback = f.fallback;
      if (typeof f.threshold === 'number') S.Font.threshold = f.threshold;
      if (typeof f.binarize === 'boolean') S.Font.binarize = f.binarize;
      S.Font.cache.clear();
    },

    /* ---------------- 언어 ---------------- */

    has: function (lang) { return !!this.store[lang]; },

    setLang: function (lang) {
      if (!this.has(lang) || lang === this.lang) return false;
      this.lang = lang;
      this._applyFont(this.ns('ui').font);
      S.Font.cache.clear();
      this._refresh();
      return true;
    },

    /* 다음 언어로 (타이틀 버튼) */
    cycleLang: function () {
      if (this.langs.length < 2) return false;
      var i = this.langs.indexOf(this.lang);
      return this.setLang(this.langs[(i + 1) % this.langs.length]);
    },

    /* 현재 언어의 표시 이름 */
    langName: function (lang) {
      var l = this.store[lang || this.lang];
      return (l && l.ui && l.ui.meta && l.ui.meta.short) || (lang || this.lang).toUpperCase();
    },

    /* 도감·퀴즈처럼 JSON 에서 만들어지는 자료구조를 다시 세운다 */
    _refresh: function () {
      if (S.rebuildParts) S.rebuildParts();
      if (S.rebuildQuiz) S.rebuildQuiz();
      if (this.onChange) this.onChange(this.lang);
    },

    /* ---------------- 부팅 로드 ---------------- */

    _loadEl: function (el) {
      var self = this;
      var kind = el.getAttribute('data-kind');
      var lang = el.getAttribute('data-lang');

      var inline = (el.textContent || '').trim();
      if (inline) {
        try { return Promise.resolve(self.apply(kind, JSON.parse(inline), lang)); }
        catch (e) {
          console.error('[Text] 인라인 JSON 파싱 실패:', el.id, e);
          return Promise.resolve(false);
        }
      }

      var src = el.getAttribute('data-src');
      if (!src || typeof fetch !== 'function') return Promise.resolve(false);

      return fetch(src)
        .then(function (r) { return r.ok ? r.json() : null; })
        .then(function (j) { return j ? self.apply(kind, j, lang) : false; })
        .catch(function () {
          console.warn('[Text] ' + src + ' 을 읽지 못했습니다. 내장 기본값을 씁니다.');
          return false;
        });
    },

    boot: function () {
      var self = this;
      var els = [];
      if (typeof document !== 'undefined' && document.querySelectorAll) {
        els = [].slice.call(document.querySelectorAll('script[data-kind]'));
      }
      return Promise.all(els.map(function (el) { return self._loadEl(el); }))
        .then(function () {
          // 기본 언어가 안 실려 있으면 실린 것 중 첫 번째로
          if (!self.has(self.lang) && self.langs.length) self.lang = self.langs[0];
          self.langs.sort();                       // ko, en 순서 고정
          self._applyFont(self.ns('ui').font);
          // JSON 이 실리기 전(스크립트 로드 시점)의 조회는 당연히 빗나간다.
          // 여기서 지워야 missing 이 '플레이 중 진짜 빠진 키'만 담는다.
          self.missing = {};
          self._refresh();
          self._installDropLoader();
          return self;
        });
    },

    loaded: function (kind, lang) {
      var l = this.store[lang || this.lang];
      return !!(l && l[kind]);
    },

    /* ---------------- 런타임 교체 (재빌드 없이) ---------------- */

    /* 파일 이름에서 종류와 언어를 짐작한다: ui.en.json → ui / en */
    guess: function (filename) {
      var m = String(filename).match(/([a-z]+)\.([a-z]{2})\.json$/i);
      if (m && KINDS.indexOf(m[1].toLowerCase()) >= 0) {
        return { kind: m[1].toLowerCase(), lang: m[2].toLowerCase() };
      }
      for (var i = 0; i < KINDS.length; i++) {
        if (new RegExp(KINDS[i], 'i').test(filename)) return { kind: KINDS[i], lang: null };
      }
      return { kind: 'ui', lang: null };
    },

    loadFile: function (file) {
      var self = this;
      return new Promise(function (resolve) {
        var fr = new FileReader();
        fr.onload = function () {
          try {
            var obj = JSON.parse(fr.result);
            var g = self.guess(file.name);
            var kind = (obj.meta && obj.meta.kind) || g.kind;
            var lang = (obj.meta && obj.meta.lang) || g.lang || self.lang;
            self.apply(kind, obj, lang);
            if (lang === self.lang) { S.Font.cache.clear(); self._refresh(); }
            self.toast = kind + ' (' + lang + ') 교체: ' + file.name;
            self.toastT = 2.5;
            resolve(kind);
          } catch (e) {
            self.toast = 'JSON 오류: ' + e.message;
            self.toastT = 4;
            resolve(null);
          }
        };
        fr.onerror = function () { resolve(null); };
        fr.readAsText(file, 'utf-8');
      });
    },

    toast: '', toastT: 0,

    tick: function (dt) { if (this.toastT > 0) this.toastT -= dt; },

    draw: function (r) {
      if (this.toastT <= 0 || !this.toast) return;
      var w = Math.min(S.W - 16, r.textWidth(this.toast, 11) + 20);
      r.window((S.W - w) / 2, 6, w, 24, { alpha: 0.95 });
      r.text(this.toast, S.W / 2, 13, { size: 11, color: S.C.textHi, align: 'center' });
    },

    _installDropLoader: function () {
      var self = this;
      if (this._dropReady || typeof window === 'undefined') return;
      this._dropReady = true;

      window.addEventListener('dragover', function (e) { e.preventDefault(); });
      window.addEventListener('drop', function (e) {
        e.preventDefault();
        var fs = e.dataTransfer && e.dataTransfer.files;
        if (!fs) return;
        for (var i = 0; i < fs.length; i++) {
          if (/\.json$/i.test(fs[i].name)) self.loadFile(fs[i]);
        }
      });
    },

    /* F4 — 파일 선택 */
    pickFile: function () {
      var self = this;
      var inp = document.createElement('input');
      inp.type = 'file';
      inp.accept = '.json,application/json';
      inp.multiple = true;
      inp.onchange = function () {
        for (var i = 0; i < inp.files.length; i++) self.loadFile(inp.files[i]);
      };
      inp.click();
    }
  };

  /* 짧은 별칭 — 코드에서 이걸 쓴다 */
  S.T = function (key, fallback) { return Text.t(key, fallback); };
  S.D = function (key, fallback) { return Text.d(key, fallback); };
  S.TL = function (key) { return Text.list('ui', key); };
  S.DL = function (key) { return Text.list('dialogue', key); };
})(SPIKE);

</script>
<script>
/* ==== src/core/renderer.js ==== */
/* ============================================================
 *  SPIKE.Renderer — 384x288 논리 캔버스 + 정수배 업스케일
 * ============================================================ */
(function (S) {
  'use strict';

  function Renderer(canvas) {
    this.canvas = canvas;
    canvas.width = S.W;
    canvas.height = S.H;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.scale = 1;
    this.fit();
    window.addEventListener('resize', this.fit.bind(this));
  }

  /* 창 크기에 맞는 최대 정수 배율 */
  Renderer.prototype.fit = function () {
    var pad = 16;
    var sx = Math.floor((window.innerWidth - pad) / S.W);
    var sy = Math.floor((window.innerHeight - pad) / S.H);
    var s = Math.max(1, Math.min(sx, sy));
    this.scale = s;
    this.canvas.style.width = (S.W * s) + 'px';
    this.canvas.style.height = (S.H * s) + 'px';
  };

  /* 화면(클라이언트) 좌표 → 논리 좌표 */
  Renderer.prototype.toLogical = function (clientX, clientY) {
    var r = this.canvas.getBoundingClientRect();
    return {
      x: Math.floor((clientX - r.left) / this.scale),
      y: Math.floor((clientY - r.top) / this.scale)
    };
  };

  /* ---------- 기본 도형 ---------- */

  Renderer.prototype.clear = function (color) {
    var c = this.ctx;
    c.fillStyle = color || '#000';
    c.fillRect(0, 0, S.W, S.H);
  };

  Renderer.prototype.rect = function (x, y, w, h, color) {
    var c = this.ctx;
    c.fillStyle = color;
    c.fillRect(x | 0, y | 0, w | 0, h | 0);
  };

  Renderer.prototype.frame = function (x, y, w, h, color, thick) {
    var t = thick || 1;
    this.rect(x, y, w, t, color);
    this.rect(x, y + h - t, w, t, color);
    this.rect(x, y, t, h, color);
    this.rect(x + w - t, y, t, h, color);
  };

  Renderer.prototype.vgradient = function (x, y, w, h, top, bottom) {
    var c = this.ctx;
    var g = c.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, top);
    g.addColorStop(1, bottom);
    c.fillStyle = g;
    c.fillRect(x | 0, y | 0, w | 0, h | 0);
  };

  /* ---------- 쯔꾸르풍 윈도우 ----------
   * 파란 세로 그라데이션 + 흰 바깥선 + 연파랑 안쪽선 + 모서리 깎임
   */
  Renderer.prototype.window = function (x, y, w, h, opt) {
    opt = opt || {};
    var C = S.C;
    x |= 0; y |= 0; w |= 0; h |= 0;

    // 반투명 본체
    this.ctx.globalAlpha = opt.alpha == null ? 0.92 : opt.alpha;
    this.vgradient(x + 2, y + 2, w - 4, h - 4, opt.top || C.winTop, opt.bottom || C.winBot);
    this.ctx.globalAlpha = 1;

    // 바깥 흰 테두리 (모서리 1px 비움)
    var e = opt.edge || C.winEdge;
    this.rect(x + 1, y, w - 2, 1, e);
    this.rect(x + 1, y + h - 1, w - 2, 1, e);
    this.rect(x, y + 1, 1, h - 2, e);
    this.rect(x + w - 1, y + 1, 1, h - 2, e);

    // 안쪽 연파랑 선
    var e2 = opt.edge2 || C.winEdge2;
    this.frame(x + 2, y + 2, w - 4, h - 4, e2, 1);
  };

  /* ---------- 텍스트 ---------- */

  Renderer.prototype.text = function (str, x, y, opt) {
    opt = opt || {};
    var size = opt.size || 12;
    var color = opt.color || S.C.text;
    var cv = S.Font.get(String(str), size, color, opt.shadow !== false);
    var dx = x | 0, dy = y | 0;
    if (opt.align === 'center') dx -= Math.floor(cv._tw / 2);
    else if (opt.align === 'right') dx -= cv._tw;
    this.ctx.drawImage(cv, dx - cv._ox, dy - cv._oy);
    return cv._tw;
  };

  Renderer.prototype.textWidth = function (str, size) {
    return S.Font.measure(String(str), size || 12);
  };

  /* ---------- 스프라이트 (문자열 픽셀맵) ---------- */

  Renderer.prototype.sprite = function (name, x, y, opt) {
    var sp = S.Sprites.get(name);
    if (!sp) return;
    opt = opt || {};
    var sc = opt.scale || 1;
    this.ctx.save();
    if (opt.flipX) {
      this.ctx.translate((x | 0) + sp.width * sc, y | 0);
      this.ctx.scale(-sc, sc);
      this.ctx.drawImage(sp, 0, 0);
    } else {
      this.ctx.drawImage(sp, x | 0, y | 0, sp.width * sc, sp.height * sc);
    }
    this.ctx.restore();
  };

  /* ---------- 연출 ---------- */

  Renderer.prototype.fade = function (alpha, color) {
    if (alpha <= 0) return;
    this.ctx.globalAlpha = Math.min(1, alpha);
    this.rect(0, 0, S.W, S.H, color || '#000');
    this.ctx.globalAlpha = 1;
  };

  S.Renderer = Renderer;
})(SPIKE);

</script>
<script>
/* ==== src/core/input.js ==== */
/* ============================================================
 *  SPIKE.Input — 키보드 + 마우스 (논리 좌표)
 * ============================================================ */
(function (S) {
  'use strict';

  var MAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'ok', Enter: 'ok', Space: 'ok', NumpadEnter: 'ok',
    KeyX: 'cancel', Escape: 'cancel', Backspace: 'cancel',
    ShiftLeft: 'dash', ShiftRight: 'dash'
  };

  var Input = S.Input = {
    down: {},        // 눌린 상태
    pressed: {},     // 이번 프레임에 새로 눌림
    released: {},
    mouse: { x: 0, y: 0, down: false, pressed: false, released: false },
    lastActivity: 0,
    renderer: null,

    init: function (renderer) {
      this.renderer = renderer;
      this.lastActivity = performance.now();
      var self = this;

      window.addEventListener('keydown', function (e) {
        // 브라우저 기본 스크롤/검색 차단
        if (MAP[e.code] || /^F\d+$/.test(e.code)) e.preventDefault();
        self.lastActivity = performance.now();

        // 강사 단축키는 씬보다 먼저 가로챈다
        if (S.Hotkeys && S.Hotkeys.handle(e)) return;

        var a = MAP[e.code];
        if (a && !self.down[a]) self.pressed[a] = true;
        if (a) self.down[a] = true;
        self.rawKey = e.code;
        if (S.Game && S.Game.scene && S.Game.scene.onKey) S.Game.scene.onKey(e);
      });

      window.addEventListener('keyup', function (e) {
        var a = MAP[e.code];
        if (a) { self.down[a] = false; self.released[a] = true; }
      });

      var cv = renderer.canvas;
      cv.addEventListener('mousemove', function (e) {
        var p = renderer.toLogical(e.clientX, e.clientY);
        self.mouse.x = p.x; self.mouse.y = p.y;
        self.lastActivity = performance.now();
      });
      cv.addEventListener('mousedown', function (e) {
        var p = renderer.toLogical(e.clientX, e.clientY);
        self.mouse.x = p.x; self.mouse.y = p.y;
        self.mouse.down = true; self.mouse.pressed = true;
        self.lastActivity = performance.now();
        e.preventDefault();
      });
      window.addEventListener('mouseup', function () {
        self.mouse.down = false; self.mouse.released = true;
        self.lastActivity = performance.now();
      });
      window.addEventListener('blur', function () {
        self.down = {};
        self.mouse.down = false;
      });
    },

    /* 매 프레임 끝에서 호출 */
    endFrame: function () {
      this.pressed = {};
      this.released = {};
      this.mouse.pressed = false;
      this.mouse.released = false;
    },

    idleSeconds: function () {
      return (performance.now() - this.lastActivity) / 1000;
    },

    poke: function () { this.lastActivity = performance.now(); },

    /* 마우스가 사각형 안에 있는가 */
    hover: function (x, y, w, h) {
      var m = this.mouse;
      return m.x >= x && m.x < x + w && m.y >= y && m.y < y + h;
    },
    clicked: function (x, y, w, h) {
      return this.mouse.pressed && this.hover(x, y, w, h);
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/audio.js ==== */
/* ============================================================
 *  SPIKE.Audio — WebAudio 8bit 합성 (외부 파일 0)
 *  BGM: 간단한 스텝 시퀀서 (리드 + 베이스)
 *  SE : 원샷 톤 / 노이즈
 * ============================================================ */
(function (S) {
  'use strict';

  var NOTE = { 'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11 };

  function freq(name) {
    if (!name || name === '-') return 0;
    var m = /^([A-G]#?)(\d)$/.exec(name);
    if (!m) return 0;
    var n = NOTE[m[1]] + (parseInt(m[2], 10) + 1) * 12;
    return 440 * Math.pow(2, (n - 69) / 12);
  }

  var Audio = S.Audio = {
    ctx: null,
    master: null,
    muted: false,
    _bgm: null,
    _timer: null,
    _step: 0,

    init: function () {
      if (this.ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    },

    /* 브라우저 자동재생 정책: 첫 사용자 입력에서 호출 */
    resume: function () {
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    toggleMute: function () {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.35;
      return this.muted;
    },

    /* ---------- 단발음 ---------- */
    tone: function (f, dur, type, vol, slideTo) {
      if (!this.ctx || this.muted || !f) return;
      var t = this.ctx.currentTime;
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol == null ? 0.25 : vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    },

    noise: function (dur, vol, hp) {
      if (!this.ctx || this.muted) return;
      var t = this.ctx.currentTime;
      var len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = this.ctx.createBufferSource();
      src.buffer = buf;
      var g = this.ctx.createGain();
      g.gain.value = vol == null ? 0.2 : vol;
      var f = this.ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = hp || 800;
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t);
    },

    /* ---------- 효과음 프리셋 ---------- */
    se: function (name) {
      switch (name) {
        case 'cursor':  this.tone(880, 0.05, 'square', 0.14); break;
        case 'ok':      this.tone(660, 0.06, 'square', 0.18);
                        setTimeout(function(){ Audio.tone(990, 0.09, 'square', 0.18); }, 55); break;
        case 'cancel':  this.tone(330, 0.09, 'square', 0.16); break;
        case 'text':    this.tone(1400, 0.015, 'square', 0.045); break;
        case 'correct': [784, 988, 1319].forEach(function (f, i) {
                          setTimeout(function () { Audio.tone(f, 0.12, 'square', 0.2); }, i * 70);
                        }); break;
        case 'wrong':   this.tone(200, 0.28, 'sawtooth', 0.18, 90); break;
        case 'hit':     this.noise(0.14, 0.26, 500); this.tone(160, 0.12, 'square', 0.18, 70); break;
        case 'damage':  this.tone(140, 0.2, 'sawtooth', 0.2, 60); break;
        case 'step':    this.tone(1046, 0.1, 'triangle', 0.13); break;
        case 'item':    [1046, 1318, 1568, 2093].forEach(function (f, i) {
                          setTimeout(function () { Audio.tone(f, 0.1, 'triangle', 0.18); }, i * 60);
                        }); break;
        case 'snap':    this.tone(1200, 0.04, 'square', 0.16);
                        setTimeout(function(){ Audio.tone(1600, 0.05, 'square', 0.14); }, 40); break;
        case 'page':    this.noise(0.05, 0.10, 2200);
                        this.tone(760, 0.035, 'triangle', 0.10); break;
        case 'fanfare': [523,659,784,1046,784,1046,1318].forEach(function (f, i) {
                          setTimeout(function () { Audio.tone(f, 0.22, 'square', 0.2); }, i * 130);
                        }); break;
      }
    },

    /* ---------- BGM ---------- */
    playBGM: function (track) {
      if (!this.ctx) this.init();
      if (this._bgm === track) return;
      this.stopBGM();
      var t = S.BGM && S.BGM[track];
      if (!t) return;
      this._bgm = track;
      this._step = 0;
      var self = this;
      this._timer = setInterval(function () { self._tick(t); }, t.tempo);
    },

    stopBGM: function () {
      if (this._timer) clearInterval(this._timer);
      this._timer = null;
      this._bgm = null;
    },

    _tick: function (t) {
      if (this.muted || !this.ctx) { this._step++; return; }
      var i = this._step % t.lead.length;
      var lead = t.lead[i];
      if (lead && lead !== '-') this.tone(freq(lead), t.tempo / 1000 * 0.85, 'square', 0.085);
      if (t.bass) {
        var b = t.bass[this._step % t.bass.length];
        if (b && b !== '-') this.tone(freq(b), t.tempo / 1000 * 1.6, 'triangle', 0.11);
      }
      if (t.drum) {
        var d = t.drum[this._step % t.drum.length];
        if (d === 'x') this.noise(0.05, 0.07, 3000);
        else if (d === 'o') this.tone(90, 0.1, 'sine', 0.16, 45);
      }
      this._step++;
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/sprites.js ==== */
/* ============================================================
 *  SPIKE.Sprites — 문자열 픽셀맵 → 캔버스 스프라이트
 *
 *  define(id, palette, rows)
 *    palette: { '문자': '#rrggbb' | null }  ('.'은 항상 투명)
 *    rows   : 문자열 배열. 길이가 어긋나면 자동으로 맞춘다.
 * ============================================================ */
(function (S) {
  'use strict';

  var Sprites = S.Sprites = {
    defs: {},
    cache: {},

    init: function () { /* 지연 생성이므로 할 일 없음 */ },

    define: function (id, pal, rows) {
      this.defs[id] = { pal: pal, rows: rows };
      delete this.cache[id];
      return this;
    },

    has: function (id) { return !!(this.cache[id] || this.defs[id]); },

    get: function (id) {
      if (this.cache[id]) return this.cache[id];
      var d = this.defs[id];
      if (!d) return null;
      var cv = this._build(d.pal, d.rows);
      this.cache[id] = cv;
      return cv;
    },

    _build: function (pal, rows) {
      var h = rows.length;
      var w = 0, i;
      for (i = 0; i < h; i++) if (rows[i].length > w) w = rows[i].length;

      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      for (var y = 0; y < h; y++) {
        var row = rows[y];
        for (var x = 0; x < row.length; x++) {
          var ch = row[x];
          if (ch === '.' || ch === ' ') continue;
          var col = pal[ch];
          if (!col) continue;
          ctx.fillStyle = col;
          ctx.fillRect(x, y, 1, 1);
        }
      }
      return cv;
    },

    /* 행 일부를 좌우로 민 복사본 (걷기 프레임 생성용) */
    shiftRows: function (rows, from, to, dx) {
      var out = rows.slice();
      for (var y = from; y <= to && y < rows.length; y++) {
        var r = rows[y];
        if (dx > 0) out[y] = '.'.repeat(dx) + r.slice(0, r.length - dx);
        else if (dx < 0) out[y] = r.slice(-dx) + '.'.repeat(-dx);
      }
      return out;
    }
  };

  /* ========================================================
   *  캐릭터 템플릿 (16 x 24)
   *  토큰: k외곽 h머리 H머리하이라이트 s피부 S피부그늘 e눈 m입
   *        c옷 C옷그늘 o포인트 b신발
   * ======================================================== */

  var BODY_DOWN = [
    '................',
    '.....kkkkkk.....',
    '....khhhhhhk....',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...kssssssssk...',
    '...kssssssssk...',
    '...ksesssseskk..',
    '...kssssssssk...',
    '...ksssmmsssk...',
    '...kssssssssk...',
    '....kssssssk....',
    '.....kkkkkk.....',
    '..kkcccccccckk..',
    '..kcoccccccock..',
    '..kcoccccccock..',
    '..ksccccccccsk..',
    '..kscCCCCCCcsk..',
    '...kCCCCCCCCk...',
    '...kCCC..CCCk...',
    '...kbbk..kbbk...',
    '...kbbk..kbbk...',
    '...kbbk..kbbk...',
    '...kkkk..kkkk...'
  ];

  var BODY_UP = [
    '................',
    '.....kkkkkk.....',
    '....khhhhhhk....',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '....khhhhhhk....',
    '.....kkkkkk.....',
    '..kkcccccccckk..',
    '..kcccccccccck..',
    '..kcccccccccck..',
    '..ksccccccccsk..',
    '..kscCCCCCCcsk..',
    '...kCCCCCCCCk...',
    '...kCCC..CCCk...',
    '...kbbk..kbbk...',
    '...kbbk..kbbk...',
    '...kbbk..kbbk...',
    '...kkkk..kkkk...'
  ];

  var BODY_SIDE = [
    '................',
    '....kkkkkk......',
    '...khhhhhhk.....',
    '..khhhhhhhhk....',
    '..khhhhhhhhk....',
    '..khhhsssssk....',
    '..khsssssssk....',
    '..khssesssk.....',
    '..khsssssssk....',
    '..khsssmsssk....',
    '..khsssssssk....',
    '...khsssssk.....',
    '....kkkkkk......',
    '...kkcccckk.....',
    '..kcocccccck....',
    '..kcocccccsk....',
    '..kccccccck.....',
    '..kcCCCCCck.....',
    '...kCCCCCk......',
    '...kCCCCCk......',
    '...kbbkbbk......',
    '...kbbkbbk......',
    '...kbbkbbk......',
    '...kkkkkkk......'
  ];

  /* 머리 위 액세서리 (고글/모자 등). 본체 위에 덧그린다. */
  var ACC = {
    goggles_down: [
      '', '', '', '',
      '...kGGGGGGGGk...',
      '...kGggkkggGk...',
      '', '', '', '', '', '', ''
    ],
    goggles_side: [
      '', '', '', '',
      '..kGGGGGGGGk....',
      '..kGgggkkGk.....',
      '', '', '', '', '', '', ''
    ],
    hat_down: [
      '',
      '....kkkkkkkk....',
      '...kHHHHHHHHk...',
      '..kkkkkkkkkkkk..',
      '', '', '', '', '', '', '', '', ''
    ]
  };

  function merge(base, overlay) {
    if (!overlay) return base;
    var out = base.slice();
    for (var y = 0; y < overlay.length && y < out.length; y++) {
      var o = overlay[y];
      if (!o) continue;
      var b = out[y].split('');
      for (var x = 0; x < o.length && x < b.length; x++) {
        if (o[x] !== '.' && o[x] !== ' ') b[x] = o[x];
      }
      out[y] = b.join('');
    }
    return out;
  }

  /* 캐릭터 1명분(4방향 × 3프레임) 등록 */
  Sprites.defineChar = function (id, pal, accDown, accSide) {
    var LEG_TOP = 19, LEG_BOT = 23;
    var sets = {
      down: merge(BODY_DOWN, accDown ? ACC[accDown] : null),
      up:   BODY_UP,
      side: merge(BODY_SIDE, accSide ? ACC[accSide] : null)
    };
    for (var dir in sets) {
      var rows = sets[dir];
      this.define(id + '_' + dir + '_0', pal, rows);
      this.define(id + '_' + dir + '_1', pal, this.shiftRows(rows, LEG_TOP, LEG_BOT, 1));
      this.define(id + '_' + dir + '_2', pal, this.shiftRows(rows, LEG_TOP, LEG_BOT, -1));
    }
    return this;
  };

  /* 방향+프레임 → 스프라이트 id (좌향은 우향을 뒤집어 쓴다) */
  Sprites.charSprite = function (id, dir, frame) {
    var d = (dir === 'left' || dir === 'right') ? 'side' : dir;
    return { id: id + '_' + d + '_' + frame, flip: dir === 'left' };
  };

  /* ========================================================
   *  등장인물 팔레트
   * ======================================================== */
  var K = '#1a1a24';

  // 주인공 — 견습 메카닉 (파란 작업복 + 고글)
  Sprites.defineChar('hero', {
    k: K, h: '#7a4a28', H: '#9a6238', s: '#f2c79a', S: '#d6a274',
    e: '#20202c', m: '#b8705a',
    c: '#3f7cc4', C: '#2c5a92', o: '#ff9f43', b: '#4a3524',
    g: '#8fe3ff', G: '#c8ccd6'
  }, 'goggles_down', 'goggles_side');

  // 도감 할머니 — 부품 학자
  Sprites.defineChar('gran', {
    k: K, h: '#e8e8f0', H: '#ffffff', s: '#f0c79c', S: '#d4a478',
    e: '#20202c', m: '#b8705a',
    c: '#8e63c4', C: '#6a4795', o: '#ffd966', b: '#4a3a4a'
  });

  // 대장장이 — 테크닉 부품 장인
  Sprites.defineChar('smith', {
    k: K, h: '#3a2a1a', H: '#55402a', s: '#e0a878', S: '#c08a5c',
    e: '#20202c', m: '#a05a48',
    c: '#b03f3f', C: '#822c2c', o: '#7a5a3a', b: '#3a2a1a'
  });

  // 문지기 — 마을 입구 퀴즈
  Sprites.defineChar('guard', {
    k: K, h: '#4a4a58', H: '#6a6a78', s: '#eebf92', S: '#cc9f72',
    e: '#20202c', m: '#a05a48',
    c: '#8c98ac', C: '#67728a', o: '#ffd966', b: '#3a3a48'
  });

  // 로봇 장인 — 조립 공방 안내
  Sprites.defineChar('maker', {
    k: K, h: '#2a2a34', H: '#44444f', s: '#f0c79c', S: '#d4a478',
    e: '#20202c', m: '#b8705a',
    c: '#ff8c3a', C: '#cc6a22', o: '#3f7cc4', b: '#3a3a44',
    g: '#8fe3ff', G: '#c8ccd6'
  }, 'goggles_down', 'goggles_side');
})(SPIKE);

<script>
/* ==== src/core/tiles.js ==== */
/* ============================================================
 *  SPIKE 타일 & 오브젝트 아트
 *  - defineNoise : 잔디/바닥 같은 질감 타일을 시드 난수로 생성
 *  - defineDraw  : 큰 오브젝트를 그리기 함수로 정의 후 1회 캐시
 * ============================================================ */
(function (S) {
  'use strict';
  var Sp = S.Sprites;

  /* 결정적 난수 (같은 시드 → 항상 같은 무늬) */
  function prng(seed) {
    var s = seed | 0;
    return function () { s = (s * 1664525 + 1013904223) | 0; return ((s >>> 8) & 0xffff) / 0x10000; };
  }

  Sp.defineDraw = function (id, w, h, fn) {
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    fn(ctx, w, h);
    this.cache[id] = cv;
    return this;
  };

  Sp.defineNoise = function (id, base, spots, density, seed, size) {
    var n = size || 16;
    return this.defineDraw(id, n, n, function (ctx) {
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, n, n);
      var r = prng(seed || 7);
      var count = Math.floor(n * n * (density || 0.12));
      for (var i = 0; i < count; i++) {
        var x = Math.floor(r() * n), y = Math.floor(r() * n);
        ctx.fillStyle = spots[Math.floor(r() * spots.length)];
        ctx.fillRect(x, y, 1, 1);
      }
    });
  };

  /* ---------------- 바닥 타일 ---------------- */
  Sp.defineNoise('t_grass',  '#4a8b3a', ['#5c9e45', '#3d7530', '#6aad50'], 0.16, 11);

  Sp.defineNoise('t_path',   '#c2a06a', ['#d4b47e', '#ab8a58', '#b89a62'], 0.20, 37);
  Sp.defineNoise('t_dark',   '#3a3a48', ['#45455a', '#2e2e3a', '#4e4e64'], 0.16, 91);
  Sp.defineNoise('t_carpet', '#a03c4a', ['#b84a58', '#84303c'], 0.12, 103);

  /* 나무 바닥 — 판자 이음선 포함 */
  Sp.defineDraw('t_wood', 16, 16, function (ctx) {

    ctx.fillRect(0, 12, 16, 1);

  /* 돌바닥 이음선 */
  Sp.defineDraw('t_stone', 16, 16, function (ctx) {

    var r = prng(71);

    ctx.fillRect(7, 0, 1, 7);
    ctx.fillRect(11, 8, 1, 8);
  });

  /* ---------------- 벽 ---------------- */
  Sp.defineDraw('t_wall', 16, 16, function (ctx) {
    ctx.fillStyle = '#6a6272'; ctx.fillRect(0, 0, 16, 16);
    ctx.fillStyle = '#7d7486'; ctx.fillRect(0, 0, 16, 2);
    ctx.fillStyle = '#4d4655';
    ctx.fillRect(0, 7, 16, 1); ctx.fillRect(0, 15, 16, 1);
    ctx.fillRect(5, 0, 1, 7); ctx.fillRect(11, 8, 1, 7);
    ctx.fillStyle = '#585064'; ctx.fillRect(1, 9, 3, 2);
  });

  Sp.defineDraw('t_walltop', 16, 16, function (ctx) {
    ctx.fillStyle = '#8d8498'; ctx.fillRect(0, 0, 16, 16);
    ctx.fillStyle = '#a49bb0'; ctx.fillRect(0, 0, 16, 4);
    ctx.fillStyle = '#5d5568'; ctx.fillRect(0, 14, 16, 2);
  });

  /* ---------------- 오브젝트 ---------------- */

  // 나무 (16 x 28)
  Sp.defineDraw('o_tree', 16, 28, function (ctx) {
    ctx.fillStyle = '#5a3f26'; ctx.fillRect(6, 18, 4, 10);

  });

  // 덤불 (16 x 12)
  Sp.defineDraw('o_bush', 16, 12, function (ctx) {
    ctx.fillStyle = '#31702a'; ctx.fillRect(1, 4, 14, 8);
    ctx.fillStyle = '#3f8a36'; ctx.fillRect(2, 2, 12, 7);

  // 표지판 (16 x 20)
  Sp.defineDraw('o_sign', 16, 20, function (ctx) {

    ctx.fillRect(3, 6, 10, 1); ctx.fillRect(3, 9, 7, 1);
  });

  // 울타리 (16 x 16)
  Sp.defineDraw('o_fence', 16, 16, function (ctx) {
    ctx.fillStyle = '#8a6a44';
    ctx.fillRect(2, 4, 3, 12); ctx.fillRect(11, 4, 3, 12);
    ctx.fillRect(0, 6, 16, 2); ctx.fillRect(0, 11, 16, 2);
    ctx.fillStyle = '#6b4f30';
    ctx.fillRect(2, 4, 3, 1); ctx.fillRect(11, 4, 3, 1); ctx.fillRect(0, 12, 16, 1);
  });

  // 작업대 (32 x 24) — 조립 공방
  Sp.defineDraw('o_workbench', 32, 24, function (ctx) {

<script>

<script>
/* ==== src/core/state.js ==== */
/* ============================================================
 *  SPIKE.State — 1회 플레이 진행 상태
 *  순환형이므로 저장하지 않는다. reset()이 곧 "다음 학생".
 * ============================================================ */
(function (S) {
  'use strict';

  var State = S.State = {
    started: 0,        // performance.now()
    running: false,
    paused: false,
    pausedAt: 0,
    pausedTotal: 0,

    chapter: 1,        // 1=마을 2=공방 3=해체의방
    dex: {},           // 도감 등록된 부품 id
    flags: {},         // 진행 플래그
    quizOk: 0,
    quizNg: 0,
    hp: 5,
    maxHp: 5,
    missionStep: 0,    // MAP2 실습 스텝 인덱스
    missionChecks: {}, // 체크리스트 상태
    codeSolved: false,
    bossStep: 0,

    reset: function () {
      this.started = performance.now();
      this.running = true;
      this.paused = false;
      this.pausedAt = 0;
      this.pausedTotal = 0;
      this.chapter = 1;
      this.dex = {};
      this.flags = {};
      this.quizOk = 0;
      this.quizNg = 0;
      this.hp = 5;
      this.maxHp = 5;
      this.missionStep = 0;
      this.missionChecks = {};
      this.codeSolved = false;
      this.bossStep = 0;
      if (S.resetMaps) S.resetMaps();      // NPC 위치 등 맵 변형 원상복구
      if (S.Mission) S.Mission.reset();
    },

    /* 경과 초 (일시정지 제외) */
    elapsed: function () {
      if (!this.running) return 0;
      var now = this.paused ? this.pausedAt : performance.now();
      return (now - this.started - this.pausedTotal) / 1000;
    },

    remaining: function () {
      return Math.max(0, S.TOTAL_SECONDS - this.elapsed());
    },

    /* mm:ss */
    clock: function () {
      var r = Math.ceil(this.remaining());
      var m = Math.floor(r / 60), s = r % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    },

    togglePause: function () {
      if (this.paused) {
        this.pausedTotal += performance.now() - this.pausedAt;
        this.paused = false;
      } else {
        this.pausedAt = performance.now();
        this.paused = true;
      }
      return this.paused;
    },

    learn: function (partId) {
      if (!this.dex[partId]) {
        this.dex[partId] = true;
        return true;   // 새로 등록됨
      }
      return false;
    },

    dexCount: function () { return Object.keys(this.dex).length; },

    /* 최종 랭크 */
    rank: function () {
      var total = this.quizOk + this.quizNg;
      var acc = total ? this.quizOk / total : 0;
      var t = this.elapsed();
      var onTime = t <= S.TOTAL_SECONDS;
      if (acc >= 0.9 && onTime) return 'S';
      if (acc >= 0.75) return 'A';
      if (acc >= 0.5) return 'B';
      return 'C';
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/hotkeys.js ==== */
/* ============================================================
 *  SPIKE.Hotkeys — 강사 운영용 단축키 (순환형 부스 필수)
 *    Ctrl+R  다음 학생 (완전 초기화)
 *    F1      조작법
 *    F2      챕터 점프
 *    F3      타이머 일시정지
 *    M       음소거
 * ============================================================ */
(function (S) {
  'use strict';

  var Hotkeys = S.Hotkeys = {
    helpOpen: false,
    jumpOpen: false,
    toast: '',
    toastT: 0,

    say: function (msg) { this.toast = msg; this.toastT = 1.8; },

    handle: function (e) {
      // 챕터 점프 창이 열려 있으면 숫자 입력을 먹는다
      if (this.jumpOpen) {
        if (e.code === 'Digit1' || e.code === 'Numpad1') { this.jumpOpen = false; this._jump(1); return true; }
        if (e.code === 'Digit2' || e.code === 'Numpad2') { this.jumpOpen = false; this._jump(2); return true; }
        if (e.code === 'Digit3' || e.code === 'Numpad3') { this.jumpOpen = false; this._jump(3); return true; }
        if (e.code === 'Escape' || e.code === 'F2') { this.jumpOpen = false; return true; }
        return true;
      }

      if (e.ctrlKey && e.code === 'KeyR') {
        e.preventDefault();
        S.Audio.stopBGM();
        S.Game.transition('attract');
        this.say(S.T('hotkeys.toastReset', ''));
        return true;
      }
      if (e.code === 'F1') { e.preventDefault(); this.helpOpen = !this.helpOpen; return true; }
      if (e.code === 'F2') { e.preventDefault(); this.jumpOpen = true; return true; }
      if (e.code === 'F3') {
        e.preventDefault();
        var p = S.State.togglePause();
        this.say(S.T(p ? 'hotkeys.toastPause' : 'hotkeys.toastResume', ''));
        return true;
      }
      if (e.code === 'F4') {
        e.preventDefault();
        if (S.Text) { S.Text.pickFile(); this.say(S.T('hotkeys.toastText', '')); }
        return true;
      }
      if (e.code === 'KeyM') {
        var m = S.Audio.toggleMute();
        this.say(S.T(m ? 'hotkeys.toastMuteOn' : 'hotkeys.toastMuteOff', ''));
        return true;
      }
      if (this.helpOpen) { this.helpOpen = false; return true; }
      return false;
    },

    _jump: function (ch) {
      S.State.chapter = ch;
      if (!S.State.running) S.State.reset();
      if (ch === 1) S.Game.transition('field', { map: 'village' });
      else if (ch === 2) S.Game.transition('field', { map: 'workshop' });
      else S.Game.transition('field', { map: 'hubroom' });
      this.say(S.Text.fmt(S.T('hotkeys.toastJump', ''), { n: ch }));
    },

    draw: function (r) {
      var C = S.C;

      if (this.toastT > 0) {
        this.toastT -= 1 / 60;
        var w = r.textWidth(this.toast, 10) + 16;
        r.window(S.W - w - 6, 6, w, 20, { alpha: 0.9 });
        r.text(this.toast, S.W - w + 2, 11, { size: 10, color: C.textHi });
      }

      if (this.jumpOpen) {
        r.fade(0.55);
        var bw = 200, bh = 96, bx = (S.W - bw) / 2, by = (S.H - bh) / 2;
        r.window(bx, by, bw, bh);
        r.text(S.T('hotkeys.jumpTitle', ''), bx + bw / 2, by + 10, { size: 12, color: C.textHi, align: 'center' });
        r.text(S.T('hotkeys.jump1', ''), bx + 22, by + 32, { size: 12 });
        r.text(S.T('hotkeys.jump2', ''), bx + 22, by + 50, { size: 12 });
        r.text(S.T('hotkeys.jump3', ''), bx + 22, by + 68, { size: 12 });
        return;
      }

      if (this.helpOpen) {
        r.fade(0.6);
        var w2 = 300, h2 = 222, x2 = (S.W - w2) / 2, y2 = (S.H - h2) / 2;
        r.window(x2, y2, w2, h2);
        r.text(S.T('hotkeys.title', ''), x2 + w2 / 2, y2 + 10, { size: 14, color: C.textHi, align: 'center' });
        var rows = S.T('hotkeys.rows', []);
        for (var i = 0; i < rows.length; i++) {
          var yy = y2 + 34 + i * 16;
          r.text(rows[i][0], x2 + 20, yy, { size: 11, color: C.textHi });
          r.text(rows[i][1], x2 + 150, yy, { size: 11, color: C.text });
        }
        r.text(S.T('hotkeys.closeHint', ''), x2 + w2 / 2, y2 + h2 - 16,
          { size: 10, color: C.textDim, align: 'center' });
      }
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/idle.js ==== */
/* ============================================================
 *  SPIKE.Idle — 무인 자동 복귀 (반복 순환형 부스 필수)
 *  90초 무입력 → 10초 카운트다운 → 완전 초기화
 * ============================================================ */
(function (S) {
  'use strict';

  var LIMIT = 90;    // 무입력 허용 초
  var WARN = 10;     // 경고 카운트다운 초

  S.Idle = {
    enabled: true,

    tick: function (dt, r) {
      if (!this.enabled) return;
      if (S.Game.sceneName === 'attract') return;

      var idle = S.Input.idleSeconds();
      if (idle < LIMIT) return;

      var left = Math.ceil(LIMIT + WARN - idle);
      if (left <= 0) {
        S.Audio.stopBGM();
        S.Input.poke();
        S.Game.transition('attract');
        return;
      }

      // 경고 오버레이
      r.fade(0.6);
      var bw = 260, bh = 78, bx = (S.W - bw) / 2, by = (S.H - bh) / 2;
      r.window(bx, by, bw, bh);
      r.text(S.T('idle.title', ''), bx + bw / 2, by + 12,
        { size: 13, color: S.C.textHi, align: 'center' });
      r.text(left + '초 후 처음 화면으로 돌아갑니다', bx + bw / 2, by + 34,
        { size: 10, color: S.C.text, align: 'center' });
      r.text(S.T('idle.hint', ''), bx + bw / 2, by + 54,
        { size: 10, color: S.C.textDim, align: 'center' });
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/engine.js ==== */
/* ============================================================
 *  SPIKE.Game — 게임 루프 + 씬 매니저
 *  씬 인터페이스: { enter(p), exit(), update(dt), draw(r), onKey(e) }
 * ============================================================ */
(function (S) {
  'use strict';

  var Game = S.Game = {
    renderer: null,
    scenes: {},
    scene: null,
    sceneName: '',
    stack: [],          // push/pop 용 (메뉴, 도감 등 오버레이 씬)
    _last: 0,
    _fade: 0,           // 0 = 없음, 양수 = 페이드 진행
    _fadeDir: 0,        // -1 어두워짐, +1 밝아짐
    _pending: null,
    shake: 0,

    register: function (name, scene) { this.scenes[name] = scene; return this; },

    /* 즉시 전환 */
    change: function (name, params) {
      if (this.scene && this.scene.exit) this.scene.exit();
      this.stack.length = 0;
      this.scene = this.scenes[name];
      this.sceneName = name;
      if (!this.scene) { console.error('없는 씬:', name); return; }
      if (this.scene.enter) this.scene.enter(params || {});
    },

    /* 페이드 아웃 → 전환 → 페이드 인 */
    transition: function (name, params) {
      if (this._pending) return;
      this._pending = { name: name, params: params };
      this._fade = 0;
      this._fadeDir = -1;
    },

    /* 오버레이 씬 (필드 위에 메뉴 등) */
    push: function (name, params) {
      var sc = this.scenes[name];
      if (!sc) return;
      this.stack.push(sc);
      if (sc.enter) sc.enter(params || {});
    },
    pop: function () {
      var sc = this.stack.pop();
      if (sc && sc.exit) sc.exit();
    },
    top: function () {
      return this.stack.length ? this.stack[this.stack.length - 1] : this.scene;
    },

    start: function (canvas, firstScene) {
      this.renderer = new S.Renderer(canvas);
      S.Input.init(this.renderer);
      S.Sprites.init();
      this.change(firstScene);
      this._last = performance.now();
      var self = this;
      requestAnimationFrame(function step(t) { self._loop(t); requestAnimationFrame(step); });
    },

    _loop: function (t) {
      var dt = Math.min(0.05, (t - this._last) / 1000);
      this._last = t;

      // --- 페이드 처리 ---
      if (this._fadeDir < 0) {
        this._fade += dt * 4;
        if (this._fade >= 1) {
          this._fade = 1;
          var p = this._pending;
          this._pending = null;
          this._fadeDir = 1;
          if (p) this.change(p.name, p.params);
        }
      } else if (this._fadeDir > 0) {
        this._fade -= dt * 3;
        if (this._fade <= 0) { this._fade = 0; this._fadeDir = 0; }
      }

      // --- 갱신 ---
      var active = this.top();
      if (active && active.update && this._fadeDir >= 0) active.update(dt);

      // 오버레이가 떠 있어도 바닥 씬의 애니메이션은 돌린다
      if (this.stack.length && this.scene && this.scene.updateBackground) {
        this.scene.updateBackground(dt);
      }

      // --- 그리기 ---
      var r = this.renderer;
      r.ctx.save();
      if (this.shake > 0) {
        this.shake -= dt * 40;
        var s = Math.max(0, this.shake);
        r.ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
      }
      if (this.scene && this.scene.draw) this.scene.draw(r);
      for (var i = 0; i < this.stack.length; i++) {
        if (this.stack[i].draw) this.stack[i].draw(r);
      }
      r.ctx.restore();

      if (this._fade > 0) r.fade(this._fade);

      if (S.Idle) S.Idle.tick(dt, r);
      if (S.Hotkeys) S.Hotkeys.draw(r);
      if (S.Text) { S.Text.tick(dt); S.Text.draw(r); }   // JSON 교체 알림

      S.Input.endFrame();
    },

    quake: function (power) { this.shake = power || 8; }
  };
})(SPIKE);

</script>

<script>
/* ==== src/data/parts.js ==== */
/* ============================================================
 *  SPIKE.PARTS — 부품 도감 (게임 내장 매뉴얼)
 *
 *  ⚠ 글자는 여기 없다. content/parts.<언어>.json 의 items.<id> 에 있다.
 *    이 파일은 순서·아이콘·분류만 갖는다.
 *
 *  언어를 바꾸면 S.rebuildParts() 가 배열 내용을 갈아끼운다.
 *  배열 자체는 그대로 두고 안을 비웠다 채운다 — 다른 코드가
 *  S.PARTS 를 붙들고 있어도 끊기지 않게.
 * ============================================================ */
(function (S) {
  'use strict';

  /* 도감에 나오는 순서 그대로 */
  var ORDER = [
    { id: 'hub',       icon: 'p_hub',       group: 'core' },
    { id: 'motorL',    icon: 'p_motor_l',   group: 'core' },
    { id: 'motorM',    icon: 'p_motor_m',   group: 'core' },
    { id: 'color',     icon: 'p_color',     group: 'core' },
    { id: 'dist',      icon: 'p_dist',      group: 'core' },
    { id: 'force',     icon: 'p_force',     group: 'core' },
    { id: 'cable',     icon: 'p_cable',     group: 'tech' },
    { id: 'beam',      icon: 'p_beam',      group: 'tech' },
    { id: 'pinBlack',  icon: 'p_pin_black', group: 'tech' },
    { id: 'pinGray',   icon: 'p_pin_gray',  group: 'tech' },
    { id: 'connector', icon: 'p_connector', group: 'tech' },
    { id: 'axle',      icon: 'p_axle',      group: 'tech' },
    { id: 'bush',      icon: 'p_bush',      group: 'tech' },
    { id: 'separator', icon: 'p_separator', group: 'tech' },
    { id: 'flag',      icon: 'p_flag',      group: 'tech' }
  ];

  S.PART_ORDER = ORDER;
  S.PARTS = [];

  S.rebuildParts = function () {
    S.PARTS.length = 0;
    for (var i = 0; i < ORDER.length; i++) {
      var o = ORDER[i];
      var txt = S.Text ? S.Text.get('parts', 'items.' + o.id, null) : null;
      txt = txt || {};
      S.PARTS.push({
        id: o.id, icon: o.icon, group: o.group,
        title: txt.title || o.id,
        real:  txt.real  || '',
        one:   txt.one   || '',
        lines: Array.isArray(txt.lines) ? txt.lines : [],
        tip:   txt.tip   || ''
      });
    }
    return S.PARTS;
  };

  S.partById = function (id) {
    for (var i = 0; i < S.PARTS.length; i++) if (S.PARTS[i].id === id) return S.PARTS[i];
    return null;
  };

  S.rebuildParts();   // JSON 이 아직 없으면 빈 껍데기 — boot 후 다시 불린다
})(SPIKE);

</script>
<script>
/* ==== src/data/quiz.js ==== */
/* ============================================================
 *  SPIKE.QUIZ — 퀴즈 배틀 문제 풀
 *
 *  ⚠ 문제·보기·해설은 여기 없다. content/quiz.<언어>.json 에 있다.
 *    이 파일은 세트 구성과 문제별 아이콘만 갖는다.
 *
 *  JSON 의 choices 는 **첫 번째가 정답**이다.
 *  게임이 출제할 때 S.shuffleQuiz 로 보기를 섞으므로 순서는 티나지 않는다.
 *  이렇게 하면 번역할 때 정답 번호를 따로 맞출 일이 없다.
 * ============================================================ */
(function (S) {
  'use strict';

  /* 세트별 아이콘 (문제 순서대로) */
  var ICONS = {
    gate:    ['p_hub', 'p_pin_black', 'p_dist'],
    mission: ['p_cable', 'p_hub'],
    boss:    ['p_cable', 'p_cable', 'p_separator', 'p_beam']
  };

  S.QUIZ = {};

  S.rebuildQuiz = function () {
    for (var k in S.QUIZ) delete S.QUIZ[k];
    Object.keys(ICONS).forEach(function (set) {
      var rows = S.Text ? S.Text.get('quiz', 'sets.' + set, null) : null;
      S.QUIZ[set] = (Array.isArray(rows) ? rows : []).map(function (row, i) {
        return {
          q: row.q || '',
          icon: ICONS[set][i] || ICONS[set][0],
          choices: Array.isArray(row.choices) ? row.choices.slice() : [],
          ans: 0,                       // JSON 은 정답을 맨 앞에 둔다
          why: row.why || '',
          act: row.act
        };
      });
    });
    return S.QUIZ;
  };

  /* 보기 섞기 (정답 공유 방지). 정답 인덱스를 다시 계산해 돌려준다. */
  S.shuffleQuiz = function (q) {
    var pairs = q.choices.map(function (c, i) { return { c: c, ok: i === q.ans }; });
    for (var i = pairs.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pairs[i]; pairs[i] = pairs[j]; pairs[j] = t;
    }
    var ans = 0;
    for (var k = 0; k < pairs.length; k++) if (pairs[k].ok) ans = k;
    return {
      q: q.q, icon: q.icon, why: q.why, act: q.act,
      choices: pairs.map(function (p) { return p.c; }),
      ans: ans
    };
  };

  S.rebuildQuiz();
})(SPIKE);

</script>

    for (var id in S.MAPS) {
      var m = S.MAPS[id], s = SNAP[id];

        if (!sn) continue;
        n.tx = sn.tx; n.ty = sn.ty; n.dir = sn.dir; n.hidden = sn.hidden;
      }
      for (var j = 0; j < (m.objects || []).length; j++) {
        if (s.objects[j]) m.objects[j].hidden = s.objects[j].hidden;
      }
    }
  };

  S.npc = function (mapId, npcId) {
    var list = (S.MAPS[mapId] || {}).npcs || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === npcId) return list[i];

<script>
/* ==== src/data/dialogue.js ==== */
/* ============================================================
 *  SPIKE.Dialogue — NPC/오브젝트 대화 + 퀘스트 목표 문구
 *
 *  ⚠ 대사 문장은 여기 없다.  content/dialogue.ko.json 에 있다.
 *    이 파일은 "언제 무엇을 말하는가"(분기)만 담당한다.
 *    퀘스트 문구 같은 화면 텍스트는 content/ui.ko.json 의 quest.* 를 쓴다.
 * ============================================================ */
(function (S) {
  'use strict';

  var F = function () { return S.State.flags; };
  function N(id) { return S.D('names.' + id, id); }

  /* ---------------- 퀘스트 목표 ---------------- */
  S.Quest = {
    current: function () {
      var f = F();
      if (S.State.chapter >= 3) {
        return f.bossDone ? S.T('quest.bossDone', '') : S.T('quest.bossReady', '');
      }
      if (S.State.chapter === 2) {
        return S.Mission ? S.Mission.goal() : S.T('quest.maker', '');
      }
      if (!f.talked_gran) return S.T('quest.gran', '');
      if (!f.talked_smith) return S.T('quest.smith', '');
      if (!f.gatePassed) return S.T('quest.guard', '');
      return S.T('quest.toWorkshop', '');
    }
  };

  /* 배열 대사를 {name, text} 목록으로 */
  function lines(who, key) {
    return S.DL(key).map(function (t) { return { name: N(who), text: t }; });
  }

  /* ---------------- 대화 테이블 ---------------- */
  var TALK = {

    /* ===== 허브 마을 ===== */
    'village:gran': function (fd) {
      var f = F();
      if (f.talked_gran) {
        fd.say({ name: N('gran'), text: S.D('village.gran.repeat', '') });
        return;
      }
      fd.say(lines('gran', 'village.gran.intro'), function () {
        S.Game.push('cards', {
          title: S.D('village.gran.cardsTitle', ''),
          ids: ['hub', 'motorL', 'motorM', 'color', 'dist', 'force'],
          onDone: function () {
            f.talked_gran = true;
            fd.say(lines('gran', 'village.gran.afterCards'));
          }
        });
      });
    },

    'village:smith': function (fd) {
      var f = F();
      if (f.talked_smith) {
        fd.say({ name: N('smith'), text: S.D('village.smith.repeat', '') });
        return;
      }
      fd.say(lines('smith', 'village.smith.intro'), function () {
        S.Game.push('cards', {
          title: S.D('village.smith.cardsTitle', ''),
          ids: ['pinBlack', 'pinGray', 'beam'],
          onDone: function () {
            // 나머지 구조 부품도 "들은 이야기"로 도감에 등록
            ['connector', 'axle', 'bush', 'cable', 'separator', 'flag'].forEach(function (id) {
              S.State.learn(id);
            });
            f.talked_smith = true;
            fd.say(lines('smith', 'village.smith.afterCards'));
          }
        });
      });
    },

    'village:guard': function (fd) {
      var f = F();
      if (f.gatePassed) {
        fd.say({ name: N('guard'), text: S.D('village.guard.passed', '') });
        return;
      }
      if (!f.talked_gran || !f.talked_smith) {
        fd.say({ name: N('guard'), text: S.D('village.guard.notReady', '') });
        return;
      }
      fd.ask({ name: N('guard'), text: S.D('village.guard.challenge', '') },
        [S.T('common.yes', '도전한다'), S.T('common.no', '나중에')],
        function (idx) {
          if (idx !== 0) {
            fd.say({ name: N('guard'), text: S.D('village.guard.declined', '') });
            return;
          }
          S.Game.transition('battle', {
            enemy: 'e_pin',
            enemyName: S.D('village.guard.enemyName', '핀 도둑'),
            bgm: 'battle', quizSet: 'gate',
            back: { map: 'village', at: { x: 11, y: 11, dir: 'down' } },
            onWin: function () {
              F().gatePassed = true;
              F().talked_guard = true;
              var g = S.npc('village', 'guard');   // 길을 비켜준다
              if (g) { g.tx = 9; g.ty = 12; g.dir = 'right'; }
            }
          });
        });
    },

    'village:altar': function (fd) {
      S.State.learn('hub');
      var msgs = S.DL('village.altar').map(function (t, i) {
        return i === 0 ? { name: N('altar'), text: t, icon: 'p_hub' } : { text: t };
      });
      fd.say(msgs);
    },

    'village:sign': function (fd) {
      fd.say(S.DL('village.sign').map(function (t) { return { text: t }; }));
    },

    /* ===== 조립 공방 ===== */
    'workshop:maker': function (fd) {
      if (S.Mission) S.Mission.talk(fd);
      else fd.say({ name: N('maker'), text: '…' });
    },

    'workshop:bench': function (fd) {
      fd.say({ text: S.D('workshop.bench', '') });
    },

    /* ===== 해체의 방 ===== */
    'hubroom:altar': function (fd) {
      if (S.State.flags.bossDone) {
        fd.say({ name: N('hub'), text: S.D('hubroom.altarAwake', ''), icon: 'p_hub' });
        S.Game.transition('ending');
      } else {
        fd.say({ text: S.D('hubroom.altarLocked', ''), icon: 'p_hub' });
      }
    }
  };

  S.Dialogue = {
    talk: function (mapId, id, fd) {
      var key = mapId + ':' + id;
      var fn = TALK[key];
      if (fn) { fn(fd); S.State.flags['talked_' + id] = S.State.flags['talked_' + id] || false; }
      else fd.say(S.D('common.nothing', ''));
    },
    table: TALK
  };
})(SPIKE);

</script>

(function (S) {

    lines: [

    loopFrom: 2,
