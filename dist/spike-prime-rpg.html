<script>
/* ==== src/ui/messageWindow.js ==== */
/* ============================================================
 *  SPIKE.MessageWindow — 쯔꾸르풍 하단 대화창
 *   · 한 글자씩 타이핑 (진행 중 확인키 = 전체 즉시 표시)
 *   · 이름 박스, 선택지, 얼굴 자리(부품 아이콘) 지원
 * ============================================================ */
(function (S) {
  'use strict';

  var FONT = 12;
  var LINE = 16;

  function MessageWindow(opt) {
    opt = opt || {};
    this.x = opt.x == null ? 8 : opt.x;
    this.w = opt.w == null ? S.W - 16 : opt.w;
    this.h = opt.h == null ? 74 : opt.h;
    this.y = opt.y == null ? S.H - this.h - 8 : opt.y;
    this.speed = opt.speed == null ? 42 : opt.speed;  // 글자/초

    this.queue = [];
    this.cur = null;
    this.lines = [];
    this.pages = null;      // 창 높이에 맞춰 쪼갠 페이지들
    this.pageIdx = 0;
    this.shown = 0;
    this.total = 0;
    this.active = false;
    this.done = false;
    this.blink = 0;
    this.onDone = null;

    this.choiceList = null;
    this.choiceIndex = 0;
    this.onChoice = null;
  }

  /* ------------------------------------------------------------
   *  이 창에 몇 줄이 들어가는가
   *    첫 줄 기준선 = y + 9, 줄 간격 = LINE, 글자 높이 ≈ FONT + 2
   *    마지막 줄 바닥이 y + h - 6 을 넘으면 안 된다.
   *  폰트를 바꾸면 글자가 커질 수 있으므로 상수로 박지 않고 계산한다.
   * ---------------------------------------------------------- */
  MessageWindow.prototype.maxLines = function () {
    return Math.max(1, Math.floor((this.h - 29) / LINE) + 1);
  };

  /* msgs: 문자열 | {name, text, icon, color} | 배열 */
  MessageWindow.prototype.show = function (msgs, onDone) {
    if (!Array.isArray(msgs)) msgs = [msgs];
    this.queue = msgs.map(function (m) {
      return typeof m === 'string' ? { text: m } : m;
    });
    this.onDone = onDone || null;
    this.active = true;
    this._next();
    return this;
  };

  MessageWindow.prototype.ask = function (msg, choices, onChoice) {
    this.show(msg);
    this.choiceList = choices;
    this.choiceIndex = 0;
    this.onChoice = onChoice;
    return this;
  };

  MessageWindow.prototype.close = function () {
    this.active = false;
    this.cur = null;
    this.queue.length = 0;
    this.choiceList = null;
    this.pages = null;
    this.pageIdx = 0;
  };

  MessageWindow.prototype._next = function () {
    // 같은 메시지에 남은 페이지가 있으면 먼저 넘긴다
    if (this.pages && this.pageIdx < this.pages.length - 1) {
      this.pageIdx++;
      this._showPage();
      return;
    }
    if (!this.queue.length) {
      if (this.choiceList) { this.done = true; return; }  // 선택지 대기
      this.active = false;
      this.cur = null;
      var cb = this.onDone; this.onDone = null;
      if (cb) cb();
      return;
    }
    this.cur = this.queue.shift();
    var innerW = this.w - 20 - (this.cur.icon ? 40 : 0);
    var all = S.Font.wrap(this.cur.text, FONT, innerW);

    // 창에 안 들어가면 페이지로 쪼갠다 (▼ 로 넘긴다)
    var m = this.maxLines();
    this.pages = [];
    for (var i = 0; i < all.length; i += m) this.pages.push(all.slice(i, i + m));
    if (!this.pages.length) this.pages = [['']];
    this.pageIdx = 0;
    this._showPage();
  };

  MessageWindow.prototype._showPage = function () {
    this.lines = this.pages[this.pageIdx];
    this.total = this.lines.join('').length;
    this.shown = 0;
    this.done = false;
  };

  MessageWindow.prototype.update = function (dt) {
    if (!this.active) return;
    this.blink += dt;

    // --- 선택지 조작 ---
    if (this.choiceList && this.done) {
      var I = S.Input;
      if (I.pressed.up) { this.choiceIndex = (this.choiceIndex + this.choiceList.length - 1) % this.choiceList.length; S.Audio.se('cursor'); }
      if (I.pressed.down) { this.choiceIndex = (this.choiceIndex + 1) % this.choiceList.length; S.Audio.se('cursor'); }
      // 마우스
      for (var i = 0; i < this.choiceList.length; i++) {
        var cy = this._choiceY(i);
        if (I.hover(this.x + 10, cy, this.w - 20, LINE)) this.choiceIndex = i;
        if (I.clicked(this.x + 10, cy, this.w - 20, LINE)) { this._pick(); return; }
      }
      if (I.pressed.ok) this._pick();
      return;
    }

    // --- 타이핑 ---
    if (this.shown < this.total) {
      var before = Math.floor(this.shown);
      this.shown = Math.min(this.total, this.shown + this.speed * dt);
      if (Math.floor(this.shown) > before && Math.floor(this.shown) % 2 === 0) S.Audio.se('text');
      if (S.Input.pressed.ok || S.Input.mouse.pressed) { this.shown = this.total; }
      if (this.shown >= this.total) this.done = true;
      return;
    }

    this.done = true;
    if (S.Input.pressed.ok || S.Input.mouse.pressed) {
      S.Audio.se('cursor');
      this._next();
    }
  };

  MessageWindow.prototype._pick = function () {
    S.Audio.se('ok');
    var cb = this.onChoice, idx = this.choiceIndex;
    this.choiceList = null; this.onChoice = null;
    this.active = false; this.cur = null;
    if (cb) cb(idx);
  };

  MessageWindow.prototype._choiceY = function (i) {
    var n = this.choiceList.length;
    var boxH = n * LINE + 12;
    var boxY = this.y - boxH - 4;
    return boxY + 6 + i * LINE;
  };

  MessageWindow.prototype.draw = function (r) {
    if (!this.active || !this.cur) return;
    var C = S.C;

    r.window(this.x, this.y, this.w, this.h);

    var tx = this.x + 10;
    var ty = this.y + 9;

    // 아이콘(부품 그림) 자리
    if (this.cur.icon && S.Sprites.has(this.cur.icon)) {
      r.rect(this.x + 6, this.y + 6, 36, this.h - 12, '#0a1230');
      r.frame(this.x + 6, this.y + 6, 36, this.h - 12, C.winEdge2, 1);
      var sp = S.Sprites.get(this.cur.icon);
      r.sprite(this.cur.icon,
        this.x + 6 + (36 - sp.width) / 2 | 0,
        this.y + 6 + (this.h - 12 - sp.height) / 2 | 0);
      tx += 40;
    }

    // 이름 박스
    if (this.cur.name) {
      var nw = r.textWidth(this.cur.name, FONT) + 14;
      r.window(this.x + 4, this.y - 19, nw, 21, { alpha: 0.95 });
      r.text(this.cur.name, this.x + 11, this.y - 13, { size: FONT, color: this.cur.color || C.textHi });
    }

    // 본문 (타이핑 중이면 잘라서)
    var left = Math.floor(this.shown);
    for (var i = 0; i < this.lines.length; i++) {
      var ln = this.lines[i];
      var part = ln;
      if (left < ln.length) part = ln.slice(0, Math.max(0, left));
      if (part) r.text(part, tx, ty + i * LINE, { size: FONT, color: C.text });
      left -= ln.length;
      if (left <= 0) break;
    }

    // ▼ 커서
    if (this.done && !this.choiceList && (this.blink % 0.9) < 0.55) {
      var cxp = this.x + this.w - 14, cyp = this.y + this.h - 12;
      r.rect(cxp, cyp, 7, 1, C.white);
      r.rect(cxp + 1, cyp + 1, 5, 1, C.white);
      r.rect(cxp + 2, cyp + 2, 3, 1, C.white);
      r.rect(cxp + 3, cyp + 3, 1, 1, C.white);
    }

    // 선택지
    if (this.choiceList && this.done) {
      var n = this.choiceList.length;
      var boxH = n * LINE + 12;
      var boxW = 0;
      for (var k = 0; k < n; k++) boxW = Math.max(boxW, r.textWidth(this.choiceList[k], FONT));
      boxW += 34;
      var boxX = this.x + this.w - boxW - 4;
      var boxY = this.y - boxH - 4;
      r.window(boxX, boxY, boxW, boxH);
      for (var j = 0; j < n; j++) {
        var yy = boxY + 6 + j * LINE;
        var sel = j === this.choiceIndex;
        if (sel) {
          r.rect(boxX + 4, yy - 1, boxW - 8, LINE, '#ffffff22');
          r.text('→', boxX + 6, yy + 1, { size: FONT, color: C.textHi });
        }
        r.text(this.choiceList[j], boxX + 20, yy + 1,
          { size: FONT, color: sel ? C.textHi : C.text });
      }
    }
  };

  S.MessageWindow = MessageWindow;
})(SPIKE);

</script>
<script>
/* ==== src/ui/missionPanel.js ==== */
/* ============================================================
 *  SPIKE.MissionPanel — MAP2 우측 조립 가이드 뷰어 (DESIGN.md §7-1, §8)
 *
 *  읽기 전용이다. 체크박스도 판정도 없다.
 *  조작은 「← 이전」 / 「다음 →」 뿐 — 마우스 클릭, Q/E, Enter.
 *
 *  ⚠ 이 파일에 한국어 문자열을 넣지 말 것.
 *    모든 텍스트는 content/ui.ko.json 의 guide.* / code.* / common.* 에서 온다.
 *    (fallback 은 JSON 이 통째로 없을 때만 쓰인다)
 *
 *  레이아웃 (패널 192 x 288, x0 = 192)
 *    0   ~  22   헤더   n/6 + 제목 + 진행 점
 *    22  ~ 162   조립도 (full 페이지는 244까지)
 *    162 ~ 244   설명 2~3줄 + ⚠주의
 *    244 ~ 288   ← 이전 · 타이머 · 다음 →
 * ============================================================ */
(function (S) {
  'use strict';

  var PW = 192;
  var HEAD_H = 22;
  var DIAG_Y = 22, DIAG_H = 140;
  var BODY_Y = 162, BODY_H = 82;
  var FOOT_Y = 244;

  /* 조립도 안의 라벨은 guide.<pageId>.<key> 에서 가져온다 */
  function L(p, key, fb) { return S.pageText.label(p, key, fb); }

  /* ------------------------------------------------------------
   *  그리기 헬퍼
   * ---------------------------------------------------------- */

  function arrow(r, x, y, len, dir, color) {
    var c = color || '#ffffff', o = '#000000', i;
    if (dir === 'down' || dir === 'up') {
      r.rect(x - 2, y - 1, 5, len + 2, o);
      r.rect(x - 1, y, 3, len, c);
      for (i = 0; i < 5; i++) {
        var hy = (dir === 'down') ? y + len + i : y - 1 - i;
        r.rect(x - 1 - (4 - i), hy, 2 * (5 - i) - 1, 1, c);
      }
    } else {
      r.rect(x - 1, y - 2, len + 2, 5, o);
      r.rect(x, y - 1, len, 3, c);
      for (i = 0; i < 5; i++) {
        var hx = (dir === 'right') ? x + len + i : x - 1 - i;
        r.rect(hx, y - 1 - (4 - i), 1, 2 * (5 - i) - 1, c);
      }
    }
  }

  function blink(r, x, y, w, h, t, color) {
    if ((t % 1.0) > 0.55) return;
    r.frame(x - 1, y - 1, w + 2, h + 2, color || S.C.textHi, 1);
  }

  /* ------------------------------------------------------------
   *  조립도 6종 — 애니메이션은 t(페이지 진입 후 초)만 보고 그린다.
   *  상태가 없으므로 페이지 재진입 시 항상 처음부터 재생된다.
   * ---------------------------------------------------------- */

  /* 라벨 키는 ui.json 의 guide.parts.* */
  var PARTS_ROW = [
    { sp: 'p_hub',       key: 'hub',       qty: 1 },
    { sp: 'p_motor_m',   key: 'motor',     qty: 1 },
    { sp: 'p_cable',     key: 'cable',     qty: 1 },
    { sp: 'p_beam',      key: 'beam',      qty: 1 },
    { sp: 'p_connector', key: 'connector', qty: 1 },
    { sp: 'p_pin_black', key: 'pin',       qty: 2 },
    { sp: 'p_flag',      key: 'flag',      qty: 1 }
  ];

  var DIAGRAMS = {

    /* 1. 부품 7종 — 4 + 3 배치, 순서대로 하나씩 밝아진다 */
    d_parts: function (r, x, y, w, h, t) {
      var cell = 42, cols = 4;
      var startX = x + (w - cols * cell) / 2 + 5;
      for (var i = 0; i < PARTS_ROW.length; i++) {
        var q = PARTS_ROW[i];
        var c = i % cols, row = (i / cols) | 0;
        var ix = startX + c * cell;
        var iy = y + 8 + row * 56;
        var on = (Math.floor(t * 1.6) % PARTS_ROW.length) === i;
        if (on) r.frame(ix - 2, iy - 2, 36, 36, S.C.textHi, 1);
        r.sprite(q.sp, ix, iy);
        if (q.qty > 1) {
          r.rect(ix + 22, iy + 22, 12, 11, '#000000cc');
          r.text('x' + q.qty, ix + 28, iy + 23, { size: 9, color: S.C.textHi, align: 'center' });
        }
        r.text(S.T('guide.parts.' + q.key, q.key), ix + 16, iy + 35,
          { size: 10, color: on ? S.C.textHi : S.C.text, align: 'center' });
      }
    },

    /* 2. 모터 + 커넥터 — 커넥터가 위에서 내려온다 */
    d_motor: function (r, x, y, w, h, t, p) {
      var cx = x + w / 2;
      var bob = Math.round(Math.abs(Math.sin(t * 2.2)) * 6);

      r.sprite('p_connector', cx - 16, y + 4 + bob);
      r.text(L(p, 'labelConnector', ''), cx + 26, y + 14, { size: 10, color: S.C.text });

      arrow(r, cx, y + 42, 12, 'down', '#ffffff');

      var mx = cx - 32, my = y + 62;
      r.sprite('p_motor_m', mx, my, { scale: 2 });
      r.text(L(p, 'labelMotor', ''), cx, my + 66, { size: 10, color: S.C.text, align: 'center' });

      // 출력축(노랑 십자) 강조 — 원본 22,14 크기 3x4 → 2배
      blink(r, mx + 44, my + 28, 6, 8, t, S.C.textHi);
      if ((t % 1.0) <= 0.55) {
        r.text(L(p, 'labelAxle', ''), mx + 68, my + 24, { size: 10, color: S.C.textHi });
      }
    },

    /* 3. 빔 + 검정핀 2개 — 핀이 좌우에서 박힌다 */
    d_beam: function (r, x, y, w, h, t, p) {
      var cx = x + w / 2;
      var push = Math.round(Math.abs(Math.sin(t * 2.0)) * 5);

      var bx = cx - 32, by = y + 12;
      r.sprite('p_beam', bx, by, { scale: 2 });
      r.text(L(p, 'labelBeam', ''), cx, by + 52, { size: 10, color: S.C.text, align: 'center' });

      r.sprite('p_pin_black', cx - 52 + push, by + 4);
      r.sprite('p_pin_black', cx + 20 - push, by + 4);
      arrow(r, cx - 56 + push, by + 20, 8, 'right', S.C.textNg);
      arrow(r, cx + 56 - push, by + 20, 8, 'left', S.C.textNg);

      r.sprite('p_connector', cx - 16, y + 80);
      r.text(L(p, 'labelConnector', ''), cx + 22, y + 90, { size: 10, color: S.C.text });

      r.text(L(p, 'caption', ''), cx, y + 118,
        { size: 10, color: (t % 1.0) <= 0.55 ? S.C.textNg : S.C.textDim, align: 'center' });
    },

    /* 4. 완성체 — 깃발 위치 점멸 */
    d_flag: function (r, x, y, w, h, t, p) {
      var cx = x + w / 2;
      var wave = Math.sin(t * 3) * 3;

      r.sprite('p_flag', cx - 16 + wave, y + 2);
      blink(r, cx - 16 + wave, y + 2, 32, 32, t, S.C.textHi);

      r.sprite('p_beam', cx - 16, y + 34);
      r.sprite('p_connector', cx - 16, y + 56);
      r.sprite('p_motor_m', cx - 16, y + 80);
      r.sprite('p_hub', cx - 16, y + 104);

      r.text(L(p, 'labelHere', ''), cx + 20 + wave, y + 10, { size: 10, color: S.C.textHi });
      r.text(L(p, 'labelDone', ''), x + 8, y + 116, { size: 11, color: S.C.textOk });
    },

    /* 5. 모터 — 케이블 — 허브(A 포트 점멸) */
    d_cable: function (r, x, y, w, h, t, p) {
      var my = y + 30;

      r.sprite('p_motor_m', x + 10, my);
      r.text(L(p, 'labelMotor', ''), x + 26, my + 34, { size: 10, color: S.C.text, align: 'center' });

      r.sprite('p_cable', x + 50, my);

      var hx = x + 92, hy = my - 14;
      r.sprite('p_hub', hx, hy, { scale: 2 });
      r.text(L(p, 'labelHub', ''), hx + 32, hy + 66, { size: 10, color: S.C.text, align: 'center' });

      // A 포트 — 허브 왼쪽 첫 포트 (원본 1,5 크기 3x5 → 2배)
      var ax = hx + 2, ay = hy + 10;
      if ((t % 0.9) <= 0.5) {
        r.rect(ax, ay, 6, 10, S.C.textHi);
        r.text('A', ax - 10, ay - 2, { size: 11, color: S.C.textHi });
      }
      blink(r, ax - 1, ay - 1, 8, 12, t, S.C.textHi);

      r.text(L(p, 'caption', ''), x + w / 2, y + 112,
        { size: 10, color: S.C.textHi, align: 'center' });
    },

    /* 6. 주문서 카드 (§8-2) — full 페이지라 세로를 다 쓴다 */
    d_code: function (r, x, y, w, h, t) {
      var G = S.CODE_GUIDE;
      if (!G) return;

      r.text(S.T('code.cardTitle', ''), x + w / 2, y + 2,
        { size: 11, color: S.C.textHi, align: 'center' });

      /* --- 실행 순서 애니메이션 (3초 루프) --- */
      var cyc = t % 3.0;
      var hot = -1, rep = 0;
      if (cyc < 0.4) hot = 0;
      else if (cyc < 0.8) { hot = 1; rep = 1; }
      else if (cyc < 2.8) {
        var k = Math.floor((cyc - 0.8) / 0.25);
        hot = G.loopFrom + (k % 2);
        rep = Math.min(G.loopCount, Math.floor(k / 2) + 1);
      }

      /* --- 블록 4줄 --- */
      var by = y + 18, bh = 20, gap = 4;
      for (var i = 0; i < G.lines.length; i++) {
        var Ln = G.lines[i];
        var bx = x + 8 + (Ln.indent ? 14 : 0);
        var bw = w - 16 - (Ln.indent ? 14 : 0);
        var yy = by + i * (bh + gap);
        var col = S.blockColor(Ln.cat);

        // 반복 블록의 ㄴ자 감싸기 (안에 들어 있다는 걸 눈으로)
        if (Ln.wrap) {
          var wrapH = (bh + gap) * 2 + 4;
          r.rect(bx, yy + bh, 6, wrapH, col);
          r.rect(bx, yy + bh + wrapH, 22, 5, col);
        }

        r.rect(bx, yy, bw, bh, '#000000');
        r.rect(bx + 1, yy + 1, bw - 2, bh - 2, col);
        r.rect(bx + 1, yy + 1, bw - 2, 2, '#ffffff44');
        r.rect(bx + 5, yy + bh - 1, 6, 2, col);

        var dark = (Ln.cat === 'event' || Ln.cat === 'ctrl' || Ln.cat === 'motor');
        r.text(G.lineText(Ln), bx + 8, yy + 5,
          { size: 10, color: dark ? '#1a1a22' : '#ffffff', shadow: false });

        if (i === hot) r.frame(bx - 1, yy - 1, bw + 2, bh + 2, '#ffffff', 1);

        if (Ln.wrap && rep > 0) {
          r.text(rep + ' / ' + G.loopCount, bx + bw - 6, yy + 5,
            { size: 10, color: '#1a1a22', align: 'right', shadow: false });
        }
      }

      /* --- SPIKE 앱에서 찾는 법 (§8-5) --- */
      var fy = by + G.lines.length * (bh + gap) + 14;
      r.rect(x + 8, fy - 2, w - 16, 1, S.C.winEdge2);
      r.text(S.T('code.findTitle', ''), x + 10, fy + 4, { size: 10, color: S.C.textHi });

      var list = G.findIt();
      for (var j = 0; j < list.length; j++) {
        var F = list[j];
        var ry = fy + 20 + j * 16;
        r.rect(x + 10, ry + 2, 9, 9, '#000000');
        r.rect(x + 11, ry + 3, 7, 7, S.blockColor(F.cat));
        r.text(F.name, x + 23, ry + 1, { size: 10, color: S.C.text });
        r.text(F.text, x + w - 10, ry + 1, { size: 10, color: S.C.textDim, align: 'right' });
      }

      r.text(S.T('code.outro', ''), x + w / 2, fy + 26 + list.length * 16,
        { size: 10, color: S.C.textOk, align: 'center' });
    }
  };

  /* ------------------------------------------------------------
   *  패널
   * ---------------------------------------------------------- */

  var Panel = S.MissionPanel = {
    x0: S.W - PW,
    active: false,
    hover: '',

    enter: function () {
      this.x0 = S.W - PW;
      this.active = true;
      if (S.Mission && !S.Mission.steps.length) S.Mission.reset();
    },

    exit: function () { this.active = false; },

    _btn: function (which) {
      var x0 = this.x0;
      if (which === 'prev') return [x0 + 8, FOOT_Y + 12, 54, 22];
      return [x0 + PW - 62, FOOT_Y + 12, 54, 22];
    },

    /* fd = 필드 씬. allowInput = 대화창이 안 떠 있을 때만 true */
    update: function (dt, allowInput, fd) {
      if (!this.active || !S.Mission) return;
      S.Mission.update(dt);
      S.Mission.checkLate(fd);
      if (!allowInput) { this.hover = ''; return; }

      var I = S.Input, p = this._btn('prev'), n = this._btn('next');
      this.hover = I.hover(p[0], p[1], p[2], p[3]) ? 'prev'
                 : I.hover(n[0], n[1], n[2], n[3]) ? 'next' : '';

      if (I.clicked(p[0], p[1], p[2], p[3])) { S.Mission.prev(); return; }
      if (I.clicked(n[0], n[1], n[2], n[3])) { S.Mission.next(fd); return; }
    },

    /* field 의 onKey 에서 호출 — Q 이전 / E 다음 */
    onKey: function (code, fd) {
      if (!this.active || !S.Mission) return false;
      if (code === 'KeyQ') { S.Mission.prev(); return true; }
      if (code === 'KeyE') { S.Mission.next(fd); return true; }
      return false;
    },

    /* ---------------- 그리기 ---------------- */

    draw: function (r, viewW) {
      if (!S.Mission) return;
      var x0 = this.x0 = (viewW == null ? S.W - PW : viewW);
      var C = S.C;
      var p = S.Mission.page();
      var t = S.Mission.pageT;

      r.window(x0, 0, PW, S.H, { alpha: 0.96 });
      r.rect(x0, 0, 1, S.H, C.winEdge2);

      if (!p) {
        r.text('…', x0 + PW / 2, S.H / 2, { size: 11, color: C.textDim, align: 'center' });
        return;
      }

      this._header(r, x0, p, C);

      var dh = p.full ? (FOOT_Y - DIAG_Y - 4) : DIAG_H;
      var fn = DIAGRAMS[p.diagram];
      if (fn) {
        r.ctx.save();
        r.ctx.beginPath();
        r.ctx.rect(x0 + 2, DIAG_Y, PW - 4, dh);
        r.ctx.clip();
        fn(r, x0 + 4, DIAG_Y + 2, PW - 8, dh - 4, t, p);
        r.ctx.restore();
      }

      if (!p.full) this._body(r, x0, p, C);
      this._footer(r, x0, C);
      this._toast(r, x0, C);
    },

    _header: function (r, x0, p, C) {
      var i = S.Mission.index(), n = S.Mission.count();
      r.rect(x0 + 2, 2, PW - 4, HEAD_H - 2, '#0a1436');
      r.text((i + 1) + ' / ' + n, x0 + 8, 6, { size: 11, color: C.textHi });
      r.text(S.pageText.title(p), x0 + 40, 6, { size: 11, color: C.text });

      for (var k = 0; k < n; k++) {
        var dx = x0 + PW - 8 - (n - k) * 9;
        r.rect(dx, 11, 5, 5, k < i ? C.textOk : (k === i ? C.textHi : '#42507a'));
      }
      r.rect(x0 + 2, HEAD_H, PW - 4, 1, C.winEdge2);
    },

    /* 설명 2~3줄 + ⚠주의 1~2줄.
     * 폰트를 바꾸면 글자 폭·높이가 달라지므로 줄 수를 세어 배치한다.
     * 본문도 방어적으로 줄바꿈한다 — JSON 을 길게 고쳐도 잘리면 안 된다. */
    _body: function (r, x0, p, C) {
      r.rect(x0 + 2, BODY_Y - 2, PW - 4, 1, C.winEdge2);

      var warn = S.pageText.warn(p);
      var wLines = warn ? S.Font.wrap(warn, 10, PW - 42).slice(0, 2) : [];
      var warnH = wLines.length ? wLines.length * 12 + 8 : 0;
      var warnY = BODY_Y + BODY_H - warnH - 2;

      // 본문 — 남는 높이만큼만 그린다
      var body = [];
      var raw = S.pageText.body(p);
      for (var k = 0; k < raw.length; k++) {
        body = body.concat(S.Font.wrap(raw[k], 10, PW - 20));
      }
      var room = (warnH ? warnY : BODY_Y + BODY_H) - (BODY_Y + 6) - 2;
      var fit = Math.max(1, Math.floor(room / 15));
      var y = BODY_Y + 6;
      for (var i = 0; i < body.length && i < fit; i++) {
        r.text(body[i], x0 + 10, y, { size: 10, color: C.text });
        y += 15;
      }

      if (!wLines.length) return;
      r.rect(x0 + 8, warnY, PW - 16, warnH, '#00000055');
      r.text('⚠', x0 + 12, warnY + (warnH - 12) / 2, { size: 10, color: C.textHi });
      for (var j = 0; j < wLines.length; j++) {
        r.text(wLines[j], x0 + 26, warnY + 4 + j * 12, { size: 10, color: C.textHi });
      }
    },
    _footer: function (r, x0, C) {
      r.rect(x0 + 2, FOOT_Y, PW - 4, 1, C.winEdge2);

      var first = S.Mission.isFirst(), last = S.Mission.isLast();
      var done = S.State.flags.missionDone;

      this._button(r, this._btn('prev'), S.T('common.prev', ''), !first, this.hover === 'prev', C);

      var label = last ? (done ? S.T('common.doneAlready', '') : S.T('common.done', ''))
                       : S.T('common.next', '');
      this._button(r, this._btn('next'), label, !(last && done), this.hover === 'next', C);

      var late = S.State.remaining() < 120;
      var pg = S.Mission.page();
      var over = pg && S.Mission.pageT > pg.budget;
      r.text(S.State.clock(), x0 + PW / 2, FOOT_Y + 8,
        { size: 11, align: 'center',
          color: S.State.paused ? C.textDim : (late ? C.textNg : (over ? C.textHi : C.text)) });

      // 키보드 힌트 (마우스 고장 대비 — §7-4)
      r.text('Q', x0 + PW / 2 - 24, FOOT_Y + 26, { size: 9, color: C.textDim, align: 'center' });
      r.text('E', x0 + PW / 2 + 24, FOOT_Y + 26, { size: 9, color: C.textDim, align: 'center' });
    },

    _button: function (r, b, label, enabled, hovered, C) {
      var bg = enabled ? (hovered ? '#2f56b8' : '#1b2c60') : '#141a2e';
      var fg = enabled ? (hovered ? C.textHi : C.text) : '#4a5372';
      r.rect(b[0], b[1], b[2], b[3], '#000000');
      r.rect(b[0] + 1, b[1] + 1, b[2] - 2, b[3] - 2, bg);
      r.frame(b[0] + 1, b[1] + 1, b[2] - 2, b[3] - 2, enabled ? C.winEdge : '#2a3150', 1);
      r.text(label, b[0] + b[2] / 2, b[1] + 6, { size: 10, color: fg, align: 'center' });
    },

    _toast: function (r, x0, C) {
      if (!S.Mission.toast || S.Mission.toastT <= 0) return;
      var a = Math.min(1, S.Mission.toastT / 0.3);
      var w = Math.min(PW - 16, r.textWidth(S.Mission.toast, 11) + 24);
      var x = x0 + (PW - w) / 2, y = 120;
      r.ctx.globalAlpha = a;
      r.window(x, y, w, 26, { alpha: 0.95 });
      r.text(S.Mission.toast, x0 + PW / 2, y + 8, { size: 11, color: C.textOk, align: 'center' });
      r.ctx.globalAlpha = 1;
    }
  };

  Panel.DIAGRAMS = DIAGRAMS;
})(SPIKE);

</script>

<script>
/* ==== src/scenes/attract.js ==== */
/* ============================================================
 *  scenes/attract — 타이틀 & 어트랙트 (다음 학생 대기 화면)
 *  scenes/opening — 20초 오프닝 (Z로 스킵)
 * ============================================================ */
(function (S) {
  'use strict';

  /* ================= 타이틀 ================= */
  var Attract = {
    t: 0, stars: null, demo: 0,

    enter: function () {
      this.t = 0; this.demo = 0;
      S.State.running = false;
      if (!this.stars) {
        this.stars = [];
        for (var i = 0; i < 46; i++) {
          this.stars.push({
            x: Math.random() * S.W, y: Math.random() * 150,
            s: Math.random() * 2 + 0.3, b: Math.random()
          });
        }
      }
      S.Audio.playBGM('title');
    },

    /* 언어 버튼 (우측 상단). 버튼이 없으면 null */
    langBtn: function () {
      if (!S.Text || S.Text.langs.length < 2) return null;
      var w = Math.max(46, S.Game.renderer
        ? S.Game.renderer.ctx && S.Font.measure(S.Text.langName(), 10) + 16 : 46);
      return [S.W - w - 6, 6, w, 18];
    },

    update: function (dt) {
      this.t += dt;
      this.demo += dt;
      var I = S.Input;

      // 언어 전환 — 게임 시작보다 먼저 본다 (클릭을 가로채야 한다)
      var b = this.langBtn();
      if (b && (I.clicked(b[0], b[1], b[2], b[3]) || I.rawKey === 'KeyL')) {
        I.rawKey = null;
        if (S.Text.cycleLang()) S.Audio.se('cursor');
        return;
      }

      if (I.pressed.ok || I.mouse.pressed) {
        S.Audio.resume();
        S.Audio.se('ok');
        S.State.reset();
        S.Game.transition('opening');
      }
    },

    draw: function (r) {
      var C = S.C;
      // 밤하늘
      r.vgradient(0, 0, S.W, S.H, '#0a0f2a', '#1b2a5e');
      for (var i = 0; i < this.stars.length; i++) {
        var st = this.stars[i];
        var a = 0.4 + 0.6 * Math.abs(Math.sin(this.t * 1.5 + st.b * 9));
        r.ctx.globalAlpha = a;
        r.rect(st.x, st.y, st.s < 1 ? 1 : 2, st.s < 1 ? 1 : 2, '#ffffff');
      }
      r.ctx.globalAlpha = 1;

      // 지면 실루엣
      r.rect(0, 196, S.W, S.H - 196, '#0d1a2e');
      r.rect(0, 196, S.W, 2, '#22406a');

      // 떠 있는 허브
      var by = 96 + Math.sin(this.t * 1.4) * 4;
      var hub = S.Sprites.get('p_hub');
      if (hub) r.ctx.drawImage(hub, (S.W - 64) / 2, by - 30, 64, 64);

      // 타이틀
      r.text(S.T('title.name', ''), S.W / 2, 22, { size: 22, color: '#ffe066', align: 'center' });
      r.text(S.T('title.sub', ''), S.W / 2, 52, { size: 12, color: '#9fc4ff', align: 'center' });
      r.rect(S.W / 2 - 110, 72, 220, 1, '#4a6aa8');

      // 아래 안내
      if ((this.t % 1.2) < 0.75) {
        r.text(S.T('title.press', ''), S.W / 2, 186,
          { size: 13, color: '#ffffff', align: 'center' });
      }

      // 진열된 부품 아이콘 (데모 루프)
      var ids = ['p_hub', 'p_motor_m', 'p_dist', 'p_color', 'p_force', 'p_beam', 'p_pin_black', 'p_cable'];
      for (var k = 0; k < 8; k++) {
        var px = 24 + k * 44;
        var wob = Math.sin(this.t * 2 + k) * 2;
        var sp = S.Sprites.get(ids[k]);
        if (sp) {
          r.ctx.globalAlpha = 0.85;
          r.ctx.drawImage(sp, 0, 0, 32, 32, px, 218 + wob, 28, 28);
          r.ctx.globalAlpha = 1;
        }
      }

      // 언어 버튼
      var lb = this.langBtn();
      if (lb) {
        var hov = S.Input.hover(lb[0], lb[1], lb[2], lb[3]);
        r.window(lb[0], lb[1], lb[2], lb[3], { alpha: hov ? 0.95 : 0.75 });
        r.text(S.Text.langName(), lb[0] + lb[2] / 2, lb[1] + 4,
          { size: 10, color: hov ? S.C.textHi : S.C.text, align: 'center' });
        // 버튼이 화면 오른쪽 끝에 붙어 있어 가운데 정렬하면 힌트가 잘린다
        r.text(S.T('lang.hint', ''), S.W - 6, lb[1] + 20,
          { size: 9, color: S.C.textDim, align: 'right' });
      }

      r.window(4, S.H - 26, S.W - 8, 22, { alpha: 0.8 });
      r.text(S.T('title.footer', ''), S.W / 2, S.H - 20,
        { size: 9, color: '#bcd2f0', align: 'center' });
    }
  };

  /* ================= 오프닝 ================= */
  /* 내레이션은 content/dialogue.<언어>.json 의 opening 배열 */
  function pages() { return S.DL('opening'); }

  var Opening = {
    page: 0, t: 0, shown: 0, mw: null,

    enter: function () {
      this.page = 0; this.t = 0;
      this.mw = new S.MessageWindow({ y: S.H - 90, h: 74, speed: 48 });
      S.Audio.playBGM('title');
      this._show();
    },

    _show: function () {
      var self = this;
      this.mw.show({ text: pages()[this.page] }, function () {
        self.page++;
        if (self.page >= pages().length) {
          S.State.chapter = 1;
          S.Game.transition('field', { map: 'village' });
        } else {
          self._show();
        }
      });
    },

    update: function (dt) {
      this.t += dt;
      if (S.Input.pressed.cancel) {
        S.State.chapter = 1;
        S.Game.transition('field', { map: 'village' });
        return;
      }
      this.mw.update(dt);
    },

    draw: function (r) {
      r.vgradient(0, 0, S.W, S.H, '#05070f', '#141a34');

      // 잠든 허브
      var alt = S.Sprites.get('o_altar');
      if (alt) {
        r.ctx.globalAlpha = 0.35 + 0.1 * Math.sin(this.t);
        r.ctx.drawImage(alt, (S.W - 96) / 2, 40, 96, 108);
        r.ctx.globalAlpha = 1;
      }
      // 뒤엉킨 케이블
      var cab = S.Sprites.get('e_cable');
      if (cab) {
        r.ctx.globalAlpha = 0.5;
        r.ctx.drawImage(cab, (S.W - 128) / 2, 72, 128, 112);
        r.ctx.globalAlpha = 1;
      }

      this.mw.draw(r);
      r.text(S.T('battle.skip', ''), S.W - 10, 8, { size: 9, color: '#7e93c0', align: 'right' });
    }
  };

  S.Game.register('attract', Attract);
  S.Game.register('opening', Opening);
})(SPIKE);

<script>
/* ==== src/scenes/mission.js ==== */
/* ============================================================
 *  SPIKE.Mission — MAP2 조립 가이드 진행 (DESIGN.md §7-7)
 *
 *  판정하지 않는다. 페이지 인덱스만 관리한다.
 *  텍스트는 전부 JSON 에서 온다 (S.pageText / S.T / S.D).
 *    · steps        dialogue.js 의 S.Quest 가 goal 을 읽어간다
 *    · reset()      state.js 가 부른다 (순환형 초기화)
 *    · talk(fd)     장인에게 말 걸었을 때
 *    · next()/prev() 페이지 이동
 * ============================================================ */
(function (S) {
  'use strict';

  function maker() { return S.D('names.maker', '로봇 장인'); }

  var Mission = S.Mission = {

    steps: [],       // dialogue.js 가 steps[missionStep] 로 접근한다

    pageT: 0,        // 현재 페이지 진입 후 경과 초 (조립도 애니메이션용)
    lateSaid: false, // 이 페이지에서 재촉 대사를 이미 했는가
    toast: '',
    toastT: 0,
    busy: false,     // 퀴즈 전환 중 — 입력 차단

    reset: function () {
      this.steps = S.GUIDE_PAGES || [];
      S.State.missionStep = 0;
      this.pageT = 0;
      this.lateSaid = false;
      this.toast = '';
      this.toastT = 0;
      this.busy = false;
    },

    page: function () {
      if (!this.steps.length) this.steps = S.GUIDE_PAGES || [];
      return this.steps[S.State.missionStep] || null;
    },

    /* 현재 페이지의 퀘스트 문구 (좌측 상단 HUD) */
    goal: function () {
      var p = this.page();
      return p ? S.pageText.goal(p) : S.T('quest.maker', '로봇 장인에게 말을 걸자');
    },

    index: function () { return S.State.missionStep; },
    count: function () { return this.steps.length || (S.GUIDE_PAGES || []).length; },
    isFirst: function () { return S.State.missionStep <= 0; },
    isLast: function () { return S.State.missionStep >= this.count() - 1; },
    isDone: function () { return !!S.State.flags.missionDone; },

    update: function (dt) {
      this.pageT += dt;
      if (this.toastT > 0) this.toastT -= dt;
    },

    /* ---------------- 페이지 이동 ---------------- */

    _go: function (i) {
      var n = this.count();
      i = Math.max(0, Math.min(n - 1, i));
      if (i === S.State.missionStep) return;
      S.State.missionStep = i;
      this.pageT = 0;
      this.lateSaid = false;
      S.Audio.se('page');
      this._learn();
    },

    /* 페이지를 지나갈 때 도감 자동 등록 */
    _learn: function () {
      var p = this.page();
      if (!p || !p.learn) return;
      for (var i = 0; i < p.learn.length; i++) S.State.learn(p.learn[i]);
    },

    prev: function () {
      if (this.busy || this.isFirst()) return false;
      this._go(S.State.missionStep - 1);
      return true;
    },

    /* 다음 페이지. fd = 필드 씬 (메시지 윈도우 주인) */
    next: function (fd) {
      if (this.busy) return false;
      var p = this.page();
      if (!p) return false;

      if (this.isLast()) return this._finish(fd);

      // 페이지를 떠날 때의 특수 처리
      if (p.onLeave === 'quiz:mission' && !S.State.flags.missionQuizDone) {
        this._quiz();
        return true;
      }

      this._advance();
      return true;
    },

    _advance: function () {
      var from = this.page();
      this._go(S.State.missionStep + 1);
      if (from && from.toast) this.showToast(S.T(from.toast, ''));
    },

    /* 케이블 페이지 → 확인 퀴즈 2문제 (기존 battle 씬 재사용, 추가 구현 0) */
    _quiz: function () {
      var self = this;
      this.busy = true;
      S.Game.transition('battle', {
        enemy: 'e_cable',
        enemyName: S.D('workshop.quizEnemyName', '꼬인 케이블'),
        bgm: 'battle',
        quizSet: 'mission',
        back: { map: 'workshop', at: { x: 6, y: 5, dir: 'up' } },
        onWin: function () {
          S.State.flags.missionQuizDone = true;
          self.busy = false;
          self._go(S.State.missionStep + 1);
        }
      });
    },

    /* 마지막 페이지에서 완료 */
    _finish: function (fd) {
      var who = maker();
      if (S.State.flags.missionDone) {
        if (fd) fd.say({ name: who, text: S.D('workshop.maker.afterDone', '') });
        return false;
      }
      S.State.flags.missionDone = true;
      S.State.chapter = 3;
      S.Audio.se('fanfare');
      this.showToast(S.T('guide.finishToast', ''));
      if (fd) {
        var lines = S.DL('workshop.maker.finish');
        fd.say(lines.map(function (line) { return { name: who, text: line }; }));
      }
      return true;
    },

    showToast: function (msg) {
      if (!msg) return;
      this.toast = msg;
      this.toastT = 1.2;
    },

    /* ---------------- 장인 대화 ---------------- */

    talk: function (fd) {
      var p = this.page(), who = maker();
      if (S.State.flags.missionDone) {
        fd.say({ name: who, text: S.D('workshop.maker.afterDone', '') });
        return;
      }
      if (!p) { fd.say({ name: who, text: '…' }); return; }
      fd.say({ name: who, text: S.pageText.maker(p) });
    },

    /* 예산 초과 시 재촉 (페이지당 1회) */
    checkLate: function (fd) {
      var p = this.page();
      if (!p || this.lateSaid) return;
      if (this.pageT < p.budget + 20) return;
      this.lateSaid = true;
      var line = S.pageText.late(p);
      if (line && fd && !fd.mw.active) fd.say({ name: maker(), text: line });
    }
  };

  Mission.steps = S.GUIDE_PAGES || [];
})(SPIKE);

</script>
<script>
/* ==== src/scenes/field.js ==== */
/* ============================================================
 *  scenes/field — 탑다운 필드 (타일맵 + 그리드 이동 + 대화)
 * ============================================================ */
(function (S) {
  'use strict';

  var T = S.TILE;
  /* 한 칸 이동 시간(초).
     10분 안에 세 맵을 도는 체험이라 이동에 시간을 쓰면 안 된다.
     0.16 은 초당 6칸으로 굼떠서 0.12(초당 8칸)로 올렸다. */
  var STEP = 0.12;
  var DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  var Field = {
    mapId: '', map: null,
    solid: null,
    player: null,
    cam: { x: 0, y: 0 },
    viewW: S.W, viewH: S.H,
    mw: null,
    animT: 0,
    busy: false,

    enter: function (p) {
      this.mapId = p.map || 'village';
      this.map = S.MAPS[this.mapId];
      this.mw = this.mw || new S.MessageWindow();
      this.mw.close();
      this.busy = false;

      this.viewW = this.map.split ? 192 : S.W;
      this.viewH = S.H;
      if (this.map.split) this.mw = new S.MessageWindow({ x: 4, w: this.viewW - 8, h: 66 });
      else this.mw = new S.MessageWindow();

      this._buildSolid();

      var st = (p.at) ? p.at : this.map.start;
      this.player = {
        tx: st.x, ty: st.y, px: st.x * T, py: st.y * T,
        dir: st.dir || 'down', moving: false, t: 0, frame: 0, animT: 0,
        fx: st.x, fy: st.y
      };
      this._camera();

      S.Audio.resume();
      if (this.map.bgm) S.Audio.playBGM(this.map.bgm);

      if (S.MissionPanel && this.map.split) S.MissionPanel.enter();
    },

    exit: function () {
      if (S.MissionPanel && this.map && this.map.split) S.MissionPanel.exit();
    },

    _buildSolid: function () {
      var m = this.map, h = m.ground.length, w = m.ground[0].length;
      this.gw = w; this.gh = h;
      var grid = [];
      for (var y = 0; y < h; y++) {
        grid[y] = [];
        for (var x = 0; x < w; x++) {
          grid[y][x] = S.SOLID_CHARS.indexOf(m.ground[y][x]) >= 0;
        }
      }
      for (var i = 0; i < (m.objects || []).length; i++) {
        var o = m.objects[i];
        for (var j = 0; j < (o.solid || []).length; j++) {
          var c = o.solid[j];
          if (grid[c[1]]) grid[c[1]][c[0]] = true;
        }
      }
      this.solid = grid;
    },

    passable: function (tx, ty) {
      if (tx < 0 || ty < 0 || ty >= this.gh || tx >= this.gw) return false;
      if (this.solid[ty][tx]) return false;
      var n = this.map.npcs || [];
      for (var i = 0; i < n.length; i++) {
        if (n[i].hidden) continue;
        if (n[i].tx === tx && n[i].ty === ty) return false;
      }
      return true;
    },

    /* ---------------- 갱신 ---------------- */

    update: function (dt) {
      this.animT += dt;

      // 가이드 패널: 애니메이션은 항상, 입력은 대화창이 없을 때만
      if (S.MissionPanel && this.map.split) {
        S.MissionPanel.update(dt, !this.mw.active && !this.busy, this);
      }

      if (this.mw.active) { this.mw.update(dt); return; }
      if (this.busy) return;

      var pl = this.player, I = S.Input;

      // 이동 보간
      if (pl.moving) {
        pl.t += dt / STEP;

        if (pl.t >= 1) {
          // 도착. 남은 시간은 버리지 않고 다음 칸으로 이월한다.
          // (예전에는 도착 프레임에 아무것도 안 해서 칸마다 한 프레임씩 멈췄다)
          var carry = (pl.t - 1) * STEP;
          pl.t = 0; pl.moving = false;
          pl.px = pl.tx * T; pl.py = pl.ty * T;
          this._onArrive();

          // 도착 처리가 대화나 맵 이동을 시작했으면 여기서 멈춘다
          var blocked = this.mw.active || this.busy || S.Game._pending;
          if (!blocked) {
            var nd = this._heldDir();
            if (nd && this._tryStep(nd)) {
              pl.t = Math.min(0.99, carry / STEP);
              this._lerp();
            }
          }
        } else {
          this._lerp();
        }
        pl.animT += dt;

      } else {
        var d = this._heldDir();
        if (d) {
          if (!this._tryStep(d)) pl.frame = 0;
        } else {
          pl.frame = 0;
          pl.animT = 0;
        }
        if (I.pressed.ok) {
          // 정면에 말 걸 대상이 없으면 가이드 페이지를 넘긴다
          if (!this._interact() && this.map.split && S.Mission) S.Mission.next(this);
        }
        if (I.pressed.cancel) S.Game.push('dex');
      }

      this._camera();
    },

    /* 지금 눌려 있는 방향 (없으면 null) */
    _heldDir: function () {
      var I = S.Input;
      if (I.down.up) return 'up';
      if (I.down.down) return 'down';
      if (I.down.left) return 'left';
      if (I.down.right) return 'right';
      return null;
    },

    /* 그 방향으로 한 칸 시작. 막혀 있으면 방향만 바꾸고 false */
    _tryStep: function (d) {
      var pl = this.player, v = DIRV[d];
      pl.dir = d;
      var nx = pl.tx + v[0], ny = pl.ty + v[1];
      if (!this.passable(nx, ny)) return false;
      pl.fx = pl.tx; pl.fy = pl.ty;
      pl.tx = nx; pl.ty = ny;
      pl.moving = true; pl.t = 0;
      pl.frame = pl.frame === 1 ? 2 : 1;
      return true;
    },

    /* 두 칸 사이 보간 */
    _lerp: function () {
      var pl = this.player;
      pl.px = (pl.fx + (pl.tx - pl.fx) * pl.t) * T;
      pl.py = (pl.fy + (pl.ty - pl.fy) * pl.t) * T;
    },

    _camera: function () {
      var mw = this.gw * T, mh = this.gh * T;
      var cx = this.player.px + T / 2 - this.viewW / 2;
      var cy = this.player.py + T / 2 - this.viewH / 2;
      this.cam.x = Math.max(0, Math.min(mw - this.viewW, Math.round(cx)));
      this.cam.y = Math.max(0, Math.min(mh - this.viewH, Math.round(cy)));
      if (mw <= this.viewW) this.cam.x = 0;
      if (mh <= this.viewH) this.cam.y = 0;
    },

    _onArrive: function () {
      var pl = this.player;
      var ex = this.map.exits || [];
      for (var i = 0; i < ex.length; i++) {
        var e = ex[i];
        if (e.tx === pl.tx && e.ty === pl.ty) {
          if (e.need && !S.State.flags[e.need]) {
            this.mw.show(e.deny || '아직 갈 수 없다.');
            // 되돌려 세운다
            var v = DIRV[pl.dir];
            pl.tx -= v[0]; pl.ty -= v[1];
            pl.px = pl.tx * T; pl.py = pl.ty * T;
            pl.dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[pl.dir];
            return;
          }
          S.Audio.se('ok');
          S.Game.transition('field', { map: e.to, at: e.at });
          return;
        }
      }
    },

    /* 정면 칸의 대상과 상호작용. 말 건 대상이 있으면 true */
    _interact: function () {
      var pl = this.player, v = DIRV[pl.dir];
      var fx = pl.tx + v[0], fy = pl.ty + v[1];

      var n = this.map.npcs || [];
      for (var i = 0; i < n.length; i++) {
        if (n[i].hidden) continue;
        if (n[i].tx === fx && n[i].ty === fy) {
          n[i].dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[pl.dir];
          S.Dialogue.talk(this.mapId, n[i].id, this);
          return true;
        }
      }
      var o = this.map.objects || [];
      for (var j = 0; j < o.length; j++) {
        if (!o[j].id) continue;
        var cells = o[j].solid || [];
        for (var k = 0; k < cells.length; k++) {
          if (cells[k][0] === fx && cells[k][1] === fy) {
            S.Dialogue.talk(this.mapId, o[j].id, this);
            return true;
          }
        }
      }
      return false;
    },

    /* Q / E — 가이드 페이지 넘김 (마우스 고장 대비) */
    onKey: function (e) {
      if (this.map && this.map.split && !this.mw.active && !this.busy &&
          S.MissionPanel && S.MissionPanel.onKey(e.code, this)) {
        e.preventDefault();
      }
    },

    say: function (msgs, done) { this.mw.show(msgs, done); },
    ask: function (msg, choices, cb) { this.mw.ask(msg, choices, cb); },

    /* ---------------- 그리기 ---------------- */

    draw: function (r) {
      var ctx = r.ctx;
      ctx.save();
      if (this.map.split) {
        ctx.beginPath();
        ctx.rect(0, 0, this.viewW, this.viewH);
        ctx.clip();
      }
      ctx.translate(-this.cam.x, -this.cam.y);

      this._drawGround(r);
      this._drawEntities(r);

      ctx.restore();

      if (this.map.split && S.MissionPanel) S.MissionPanel.draw(r, this.viewW);

      this._drawHUD(r);
      this.mw.draw(r);
    },

    _drawGround: function (r) {
      var m = this.map;
      var x0 = Math.floor(this.cam.x / T), x1 = Math.ceil((this.cam.x + this.viewW) / T);
      var y0 = Math.floor(this.cam.y / T), y1 = Math.ceil((this.cam.y + this.viewH) / T);
      for (var y = y0; y < y1 && y < this.gh; y++) {
        for (var x = x0; x < x1 && x < this.gw; x++) {
          if (x < 0 || y < 0) continue;
          var ch = m.ground[y][x];
          var tile = S.TERRAIN[ch] || 't_grass';
          var sp = S.Sprites.get(tile);
          if (sp) r.ctx.drawImage(sp, x * T, y * T);
          if (ch === 'D') {
            // 출구 표시
            r.rect(x * T + 2, y * T + 2, T - 4, T - 4, '#00000044');
            r.text('▼', x * T + T / 2, y * T + 3, { size: 10, color: '#ffe066', align: 'center' });
          }
        }
      }
    },

    _drawEntities: function (r) {
      var list = [];
      var m = this.map, i;

      for (i = 0; i < (m.objects || []).length; i++) {
        var o = m.objects[i];
        if (o.hidden) continue;
        var sp = S.Sprites.get(o.sprite);
        if (!sp) continue;
        list.push({
          y: (o.ty + 1) * T,
          draw: function (o, sp) {
            return function () {
              r.ctx.drawImage(sp, o.tx * T, (o.ty + 1) * T - sp.height);
            };
          }(o, sp)
        });
      }

      for (i = 0; i < (m.npcs || []).length; i++) {
        var n = m.npcs[i];
        if (n.hidden) continue;
        list.push({ y: (n.ty + 1) * T, draw: this._npcDrawer(r, n) });
      }

      list.push({ y: this.player.py + T, draw: this._playerDrawer(r) });

      list.sort(function (a, b) { return a.y - b.y; });
      for (i = 0; i < list.length; i++) list[i].draw();
    },

    _npcDrawer: function (r, n) {
      var self = this;
      return function () {
        var s = S.Sprites.charSprite(n.char, n.dir || 'down', 0);
        var sp = S.Sprites.get(s.id);
        if (!sp) return;
        var dx = n.tx * T + (T - 16) / 2;
        var dy = (n.ty + 1) * T - sp.height + 4;
        r.sprite(s.id, dx, dy, { flipX: s.flip });
        // 아직 말 안 건 NPC 머리 위 !
        if (n.mark && !S.State.flags['talked_' + n.id]) {
          var bob = Math.sin(self.animT * 5) * 2;
          r.sprite('o_excl', dx + 4, dy - 12 + bob);
        }
      };
    },

    _playerDrawer: function (r) {
      var pl = this.player;
      return function () {
        var frame = pl.moving ? (Math.floor(pl.animT * 8) % 2 === 0 ? 1 : 2) : 0;
        var s = S.Sprites.charSprite('hero', pl.dir, frame);
        var bob = (pl.moving && frame !== 0) ? -1 : 0;
        var sp = S.Sprites.get(s.id);
        if (!sp) return;
        r.sprite(s.id, Math.round(pl.px) + (T - 16) / 2,
          Math.round(pl.py) + T - sp.height + 4 + bob, { flipX: s.flip });
      };
    },

    _drawHUD: function (r) {
      var C = S.C;
      var obj = S.Quest.current();

      // 좌측 목표 — 분할 맵에서는 폭이 좁으므로 넘치면 잘라낸다
      var maxW = this.viewW - 8;
      var label = '◆ ' + obj;
      if (r.textWidth(label, 10) + 18 > maxW) {
        while (label.length > 4 && r.textWidth(label + '…', 10) + 18 > maxW) {
          label = label.slice(0, -1);
        }
        label += '…';
      }
      r.window(4, 4, Math.min(r.textWidth(label, 10) + 18, maxW), 20, { alpha: 0.85 });
      r.text(label, 11, 9, { size: 10, color: C.textHi });

      // 우측 타이머 (분할 맵에서는 패널이 담당)
      if (!this.map.split) {
        var t = S.State.clock();
        var late = S.State.remaining() < 120;
        var tw = 54;
        r.window(S.W - tw - 4, 4, tw, 20, { alpha: 0.85 });
        r.text(t, S.W - tw + 4, 9,
          { size: 10, color: S.State.paused ? C.textDim : (late ? C.textNg : C.text) });
      }
    }
  };

  S.Game.register('field', Field);
  S.Field = Field;
})(SPIKE);

</script>
<script>
/* ==== src/scenes/cards.js ==== */
/* ============================================================
 *  scenes/cards — 부품 카드 넘김 (도감 등록 연출)
 *  push('cards', { title, ids:[...], onDone })
 * ============================================================ */
(function (S) {
  'use strict';

  var Cards = {
    ids: [], i: 0, title: '', onDone: null,
    t: 0, slide: 0,

    enter: function (p) {
      this.ids = p.ids || [];
      this.title = p.title || '부품 도감';
      this.onDone = p.onDone || null;
      this.i = 0; this.t = 0; this.slide = 1;
      this._register();
    },

    _register: function () {
      var id = this.ids[this.i];
      if (id && S.State.learn(id)) S.Audio.se('item');
      else S.Audio.se('cursor');
    },

    update: function (dt) {
      this.t += dt;
      if (this.slide > 0) this.slide = Math.max(0, this.slide - dt * 6);

      var I = S.Input;
      var next = I.pressed.ok || I.mouse.pressed;
      if (next) {
        this.i++;
        if (this.i >= this.ids.length) {
          var cb = this.onDone;
          S.Game.pop();
          if (cb) cb();
          return;
        }
        this.slide = 1;
        this._register();
      }
      if (I.pressed.cancel) {
        // 건너뛰기 — 남은 카드도 도감에는 등록해 준다
        for (var k = this.i; k < this.ids.length; k++) S.State.learn(this.ids[k]);
        var cb2 = this.onDone;
        S.Game.pop();
        if (cb2) cb2();
      }
    },

    draw: function (r) {
      var C = S.C;
      r.fade(0.72);

      var part = S.partById(this.ids[this.i]);
      if (!part) return;

      var bw = 344, bh = 196;
      var bx = Math.round((S.W - bw) / 2);
      var by = 44 + Math.round(this.slide * 10);

      r.window(bx, by, bw, bh);

      // 상단 타이틀 바
      r.rect(bx + 4, by + 4, bw - 8, 18, '#0a1230');
      r.text(this.title, bx + bw / 2, by + 8, { size: 11, color: C.textHi, align: 'center' });
      r.text((this.i + 1) + ' / ' + this.ids.length, bx + bw - 12, by + 8,
        { size: 10, color: C.textDim, align: 'right' });

      // 아이콘 (3배 확대)
      var ix = bx + 18, iy = by + 34;
      r.rect(ix, iy, 100, 100, '#0a1230');
      r.frame(ix, iy, 100, 100, C.winEdge2, 1);
      var sp = S.Sprites.get(part.icon);
      if (sp) {
        var pulse = 1 + Math.sin(this.t * 4) * 0.02;
        r.ctx.drawImage(sp, ix + 2, iy + 2, 96, 96);
        if (pulse) { /* 정수 스케일 유지 */ }
      }
      r.text('NEW', ix + 50, iy + 104, { size: 9, color: C.textOk, align: 'center' });

      // 텍스트
      var tx = bx + 132;
      r.text(part.title, tx, by + 34, { size: 14, color: C.textHi });
      r.text(part.real, tx, by + 53, { size: 10, color: C.textDim });
      r.rect(tx, by + 68, bw - 150, 1, C.winEdge2);
      r.text(part.one, tx, by + 74, { size: 11, color: C.white });

      var maxLines = 4;
      for (var i = 0; i < part.lines.length && i < maxLines; i++) {
        r.text(part.lines[i], tx, by + 94 + i * 14, { size: 10, color: C.text });
      }

      // 팁
      r.rect(bx + 8, by + bh - 34, bw - 16, 26, '#0a123099');
      r.text('TIP', bx + 14, by + bh - 29, { size: 9, color: C.textHi });
      var tip = S.Font.wrap(part.tip, 9, bw - 52);
      for (var j = 0; j < tip.length && j < 2; j++) {
        r.text(tip[j], bx + 38, by + bh - 30 + j * 11, { size: 9, color: C.textDim });
      }

      // 진행 안내
      if ((this.t % 1) < 0.6) {
        r.text(S.T('cards.hint', ''), S.W / 2, by + bh + 8,
          { size: 10, color: C.white, align: 'center' });
      }
    }
  };

  S.Game.register('cards', Cards);
})(SPIKE);

</script>
<script>
/* ==== src/scenes/dex.js ==== */
/* ============================================================
 *  scenes/dex — 부품 도감 (게임 내장 매뉴얼)
 *  X / Esc 로 열고 닫는다. 배운 부품만 상세가 보인다.
 * ============================================================ */
(function (S) {
  'use strict';

  var Dex = {
    idx: 0, scroll: 0, t: 0,

    enter: function () { this.t = 0; S.Audio.se('ok'); },
    exit: function () { S.Audio.se('cancel'); },

    update: function (dt) {
      this.t += dt;
      var I = S.Input, n = S.PARTS.length;

      if (I.pressed.up) { this.idx = (this.idx + n - 1) % n; S.Audio.se('cursor'); }
      if (I.pressed.down) { this.idx = (this.idx + 1) % n; S.Audio.se('cursor'); }
      if (I.pressed.left) { this.idx = Math.max(0, this.idx - 8); S.Audio.se('cursor'); }
      if (I.pressed.right) { this.idx = Math.min(n - 1, this.idx + 8); S.Audio.se('cursor'); }
      if (I.pressed.cancel || I.pressed.ok) { S.Game.pop(); return; }

      // 목록 스크롤 유지
      var rows = 9;
      if (this.idx < this.scroll) this.scroll = this.idx;
      if (this.idx >= this.scroll + rows) this.scroll = this.idx - rows + 1;

      // 마우스
      for (var i = 0; i < rows; i++) {
        var pi = this.scroll + i;
        if (pi >= n) break;
        if (I.hover(10, 44 + i * 18, 122, 18)) this.idx = pi;
      }
      if (I.clicked(S.W - 60, 6, 54, 18)) S.Game.pop();
    },

    draw: function (r) {
      var C = S.C;
      r.fade(0.8);

      // 헤더
      r.window(4, 4, S.W - 8, 26);
      r.text(S.T('dex.title', ''), 14, 10, { size: 14, color: C.textHi });
      r.text(S.Text.fmt(S.T('dex.collected', ''), { n: S.State.dexCount(), total: S.PARTS.length }), 150, 13, { size: 10, color: C.text });
      r.text(S.T('dex.move', ''), S.W - 14, 13, { size: 10, color: C.textDim, align: 'right' });

      // 좌측 목록
      r.window(4, 34, 132, S.H - 40);
      var rows = 9;
      for (var i = 0; i < rows; i++) {
        var pi = this.scroll + i;
        if (pi >= S.PARTS.length) break;
        var p = S.PARTS[pi];
        var known = !!S.State.dex[p.id];
        var y = 44 + i * 18;
        var sel = pi === this.idx;
        if (sel) r.rect(8, y - 2, 124, 18, '#ffffff22');
        var sp = S.Sprites.get(p.icon);
        if (sp) {
          r.ctx.save();
          if (!known) r.ctx.globalAlpha = 0.25;
          r.ctx.drawImage(sp, 0, 0, 32, 32, 11, y - 1, 16, 16);
          r.ctx.restore();
        }
        r.text(known ? p.title : '???', 32, y + 1,
          { size: 11, color: sel ? C.textHi : (known ? C.text : C.textDim) });
      }
      if (S.PARTS.length > rows) {
        r.text('▼', 70, S.H - 18, { size: 9, color: C.textDim, align: 'center' });
      }

      // 우측 상세
      var p2 = S.PARTS[this.idx];
      var dx = 142, dw = S.W - 146;
      r.window(dx, 34, dw, S.H - 40);

      if (!S.State.dex[p2.id]) {
        r.text(S.T('dex.unknown', ''), dx + dw / 2, 120, { size: 11, color: C.textDim, align: 'center' });
        return;
      }

      var sp2 = S.Sprites.get(p2.icon);
      if (sp2) {
        r.rect(dx + 10, 44, 68, 68, '#0a1230');
        r.frame(dx + 10, 44, 68, 68, C.winEdge2, 1);
        r.ctx.drawImage(sp2, dx + 12, 46, 64, 64);
      }
      r.text(p2.title, dx + 88, 46, { size: 13, color: C.textHi });
      r.text(p2.real, dx + 88, 64, { size: 9, color: C.textDim });
      r.text(p2.one, dx + 88, 82, { size: 10, color: C.white });
      r.text(S.T(p2.group === 'core' ? 'dex.core' : 'dex.tech', ''), dx + 88, 98,
        { size: 9, color: p2.group === 'core' ? C.blkSense : C.blkCtrl });

      r.rect(dx + 10, 118, dw - 20, 1, C.winEdge2);

      /* 설명과 TIP.
       * 줄을 그대로 그리면 폰트를 바꿨을 때 오른쪽으로 삐져나간다.
       * 항상 칸 폭에 맞춰 줄바꿈하고, TIP 은 창 바닥에 붙여
       * 설명이 길어져도 아래로 밀려 나가지 않게 한다. */
      var panelBottom = 34 + (S.H - 40);
      var tipLines = S.Font.wrap(p2.tip, 9, dw - 56).slice(0, 3);
      var tipH = tipLines.length * 12 + 10;
      var tipY = panelBottom - 8 - tipH;

      /* 설명은 산문이다. 작성자가 끊어 놓은 위치를 그대로 쓰면
         언어나 폰트가 바뀔 때 "time" 같은 고아 단어가 생긴다.
         이어 붙인 뒤 칸 폭에 맞춰 다시 끊는다. */
      var desc = S.Font.wrap(p2.lines.join(' '), 10, dw - 24);
      var fit = Math.max(1, Math.floor((tipY - 126 - 6) / 14));
      for (var m = 0; m < desc.length && m < fit; m++) {
        r.text(desc[m], dx + 12, 126 + m * 14, { size: 10, color: C.text });
      }

      r.rect(dx + 8, tipY, dw - 16, tipH, '#0a123099');
      r.text(S.T('dex.tip', 'TIP'), dx + 14, tipY + 5, { size: 9, color: C.textHi });
      for (var j = 0; j < tipLines.length; j++) {
        r.text(tipLines[j], dx + 40, tipY + 5 + j * 12, { size: 9, color: C.textDim });
      }
    }
  };

  S.Game.register('dex', Dex);
})(SPIKE);

</script>
<script>
/* ==== src/scenes/battle.js ==== */
/* ============================================================
 *  scenes/battle — 퀴즈 배틀 (정면 뷰 턴제)
 *   정답 = 큰 공격 / 오답 = 해설 후 작은 공격
 *   게임오버 없음. 모든 문제를 풀면 반드시 승리한다.
 * ============================================================ */
(function (S) {
  'use strict';

  var PH = { INTRO: 0, ASK: 1, JUDGE: 2, WHY: 3, WIN: 4 };

  var Battle = {
    enemy: '', enemyName: '', qs: [], qi: 0, sel: 0,
    phase: 0, t: 0, back: null, onWin: null,
    hpMax: 0, hp: 0, shake: 0, lastOk: false, dmgPop: null,
    mw: null, flash: 0, act: '',

    enter: function (p) {
      this.enemy = p.enemy || 'e_pin';
      this.enemyName = p.enemyName || '수상한 그림자';
      this.back = p.back || null;
      this.onWin = p.onWin || null;
      this.act = '';

      var set = S.QUIZ[p.quizSet] || S.QUIZ.gate;
      this.qs = set.map(S.shuffleQuiz);
      this.qi = 0; this.sel = 0;
      this.hpMax = this.qs.length; this.hp = this.qs.length;
      this.phase = PH.INTRO; this.t = 0; this.shake = 0; this.flash = 0;
      this.dmgPop = null;

      // 해설이 3줄까지 나온다 — 높이를 그만큼 준다 (maxLines 참조)
      this.mw = new S.MessageWindow({ h: 74, y: S.H - 82 });
      var self = this;
      this.mw.show({ name: this.enemyName, text: this.enemyName + '이(가) 나타났다!\n문제를 맞혀서 물리쳐라!' },
        function () { self.phase = PH.ASK; });

      S.Audio.playBGM(p.bgm || 'battle');
    },

    update: function (dt) {
      this.t += dt;
      if (this.shake > 0) this.shake -= dt * 30;
      if (this.flash > 0) this.flash -= dt * 3;
      if (this.dmgPop) {
        this.dmgPop.t += dt;
        if (this.dmgPop.t > 1) this.dmgPop = null;
      }

      var I = S.Input;

      if (this.phase === PH.INTRO || this.phase === PH.WHY) {
        this.mw.update(dt);
        return;
      }

      if (this.phase === PH.ASK) {
        var q = this.qs[this.qi];
        var n = q.choices.length;
        if (I.pressed.up) { this.sel = (this.sel + n - 1) % n; S.Audio.se('cursor'); }
        if (I.pressed.down) { this.sel = (this.sel + 1) % n; S.Audio.se('cursor'); }
        for (var i = 0; i < n; i++) {
          var b = this._choiceRect(i);
          if (I.hover(b[0], b[1], b[2], b[3])) this.sel = i;
          if (I.clicked(b[0], b[1], b[2], b[3])) { this._answer(); return; }
        }
        if (I.pressed.ok) this._answer();
        return;
      }

      if (this.phase === PH.JUDGE) {
        if (this.t > 0.85) this._explain();
        return;
      }

      if (this.phase === PH.WIN) {
        this.mw.update(dt);
        return;
      }
    },

    _choiceRect: function (i) {
      var w = (S.W - 24) / 2 | 0;
      var x = 8 + (i % 2) * (w + 8);
      var y = 152 + Math.floor(i / 2) * 26;
      return [x, y, w, 22];
    },

    _answer: function () {
      var q = this.qs[this.qi];
      this.lastOk = (this.sel === q.ans);
      this.phase = PH.JUDGE;
      this.t = 0;

      if (this.lastOk) {
        S.State.quizOk++;
        S.Audio.se('correct');
        S.Game.quake(7);
        this.shake = 10;
        this.flash = 1;
        this.hp = Math.max(0, this.hp - 1);
        this.dmgPop = { t: 0, v: '정답!', col: S.C.textOk };
      } else {
        S.State.quizNg++;
        S.Audio.se('wrong');
        S.State.hp = Math.max(0, S.State.hp - 1);
        this.hp = Math.max(0, this.hp - 1);   // 진행은 반드시 된다
        this.dmgPop = { t: 0, v: '아쉽다…', col: S.C.textNg };
      }
    },

    _explain: function () {
      var q = this.qs[this.qi];
      var self = this;
      this.phase = PH.WHY;
      var msgs = [{
        name: this.lastOk ? '정답!' : '해설',
        color: this.lastOk ? S.C.textOk : S.C.textNg,
        text: (this.lastOk ? '' : '정답은 「' + q.choices[q.ans] + '」.\n') + q.why,
        icon: q.icon
      }];
      if (q.act) {
        this.act = q.act;
        msgs.push({ name: '실제 행동', color: S.C.textHi, text: '지금 실물에서 → ' + q.act });
      }
      this.mw.show(msgs, function () {
        self.qi++;
        self.sel = 0;
        if (self.qi >= self.qs.length) self._win();
        else self.phase = PH.ASK;
      });
    },

    _win: function () {
      this.phase = PH.WIN;
      S.Audio.stopBGM();
      S.Audio.se('fanfare');
      var self = this;
      var ok = S.State.quizOk, ng = S.State.quizNg;
      this.mw.show([
        { name: '승리!', color: S.C.textHi, text: this.enemyName + '을(를) 물리쳤다!' },
        { text: '정답 ' + ok + '개 / 오답 ' + ng + '개\n배운 것을 잊지 말자.' }
      ], function () {
        if (self.onWin) self.onWin();
        if (self.back) S.Game.transition('field', { map: self.back.map, at: self.back.at });
        else S.Game.transition('field', { map: 'village' });
      });
    },

    draw: function (r) {
      var C = S.C;

      // 배경
      r.vgradient(0, 0, S.W, S.H, '#1a1030', '#3a2050');
      for (var i = 0; i < 12; i++) {
        var y = 20 + i * 10;
        r.ctx.globalAlpha = 0.06;
        r.rect(0, y, S.W, 2, '#ffffff');
      }
      r.ctx.globalAlpha = 1;
      r.rect(0, 118, S.W, 4, '#241640');

      if (this.flash > 0) {
        r.ctx.globalAlpha = Math.min(0.5, this.flash * 0.5);
        r.rect(0, 0, S.W, S.H, '#ffffff');
        r.ctx.globalAlpha = 1;
      }

      // 적
      var sp = S.Sprites.get(this.enemy);
      if (sp) {
        var ex = (S.W - sp.width) / 2 + (this.shake > 0 ? (Math.random() - 0.5) * this.shake : 0);
        var ey = 36 + Math.sin(this.t * 2) * 3;
        r.ctx.save();
        if (this.phase === PH.JUDGE && this.lastOk) r.ctx.globalAlpha = 0.6;
        r.ctx.drawImage(sp, Math.round(ex), Math.round(ey));
        r.ctx.restore();
      }

      // 적 이름 + HP 게이지
      r.text(this.enemyName, S.W / 2, 10, { size: 12, color: '#ffd7d7', align: 'center' });
      var gw = 140, gx = (S.W - gw) / 2;
      r.rect(gx - 1, 27, gw + 2, 7, '#000000');
      r.rect(gx, 28, gw, 5, '#40203a');
      r.rect(gx, 28, Math.round(gw * this.hp / this.hpMax), 5, '#e0405a');

      // 데미지 팝업
      if (this.dmgPop) {
        var a = 1 - this.dmgPop.t;
        r.ctx.globalAlpha = Math.max(0, a);
        r.text(this.dmgPop.v, S.W / 2, 62 - this.dmgPop.t * 20,
          { size: 16, color: this.dmgPop.col, align: 'center' });
        r.ctx.globalAlpha = 1;
      }

      // 진행 표시
      r.window(4, 4, 62, 20, { alpha: 0.85 });
      r.text(S.Text.fmt(S.T('battle.question', ''),
        { n: Math.min(this.qi + 1, this.qs.length), total: this.qs.length }), 11, 9,
        { size: 10, color: C.textHi });

      // 플레이어 하트
      r.window(S.W - 76, 4, 72, 20, { alpha: 0.85 });
      for (var h = 0; h < S.State.maxHp; h++) {
        var full = h < S.State.hp;
        var hx = S.W - 70 + h * 13, hy = 10;
        r.rect(hx, hy + 1, 3, 3, full ? '#ff5a6a' : '#5a3a44');
        r.rect(hx + 5, hy + 1, 3, 3, full ? '#ff5a6a' : '#5a3a44');
        r.rect(hx, hy + 3, 8, 3, full ? '#ff5a6a' : '#5a3a44');
        r.rect(hx + 1, hy + 6, 6, 2, full ? '#d03a4a' : '#4a2e36');
        r.rect(hx + 3, hy + 8, 2, 1, full ? '#d03a4a' : '#4a2e36');
      }

      // 질문 + 보기
      if (this.phase === PH.ASK || this.phase === PH.JUDGE) {
        var q = this.qs[this.qi];
        r.window(4, 108, S.W - 8, 40);
        if (q.icon && S.Sprites.has(q.icon)) {
          r.ctx.drawImage(S.Sprites.get(q.icon), 0, 0, 32, 32, 9, 112, 30, 30);
        }
        var qlines = S.Font.wrap(q.q, 11, S.W - 56);
        for (var L = 0; L < qlines.length && L < 2; L++) {
          r.text(qlines[L], 44, 115 + L * 14, { size: 11, color: C.white });
        }

        for (var c = 0; c < q.choices.length; c++) {
          var b = this._choiceRect(c);
          var sel = c === this.sel;
          var reveal = this.phase === PH.JUDGE;
          var col = C.text, bg = null;
          if (reveal) {
            if (c === q.ans) { bg = '#1e6b3a'; col = '#b6ffcb'; }
            else if (c === this.sel) { bg = '#6b1e28'; col = '#ffc0c8'; }
          } else if (sel) { bg = '#2a4a8a'; col = C.textHi; }

          r.rect(b[0], b[1], b[2], b[3], bg || '#141c38');
          r.frame(b[0], b[1], b[2], b[3], sel && !reveal ? C.winEdge : C.winEdge2, 1);
          if (sel && !reveal) r.text('→', b[0] + 4, b[1] + 5, { size: 10, color: C.textHi });
          r.text(q.choices[c], b[0] + 16, b[1] + 5, { size: 10, color: col });
        }

        if (this.phase === PH.ASK && (this.t % 1.4) < 0.9) {
          r.text(S.T('battle.hint', ''), S.W / 2, S.H - 16,
            { size: 9, color: C.textDim, align: 'center' });
        }
      }

      if (this.phase === PH.INTRO || this.phase === PH.WHY || this.phase === PH.WIN) {
        this.mw.draw(r);
      }
    }
  };

  S.Game.register('battle', Battle);
})(SPIKE);

</script>
<script>
/* ==== src/scenes/ending.js ==== */
/* ============================================================
 *  scenes/ending — 랭크 발표 (이름 입력 없음, 키보드 입력 0)
 * ============================================================ */
(function (S) {
  'use strict';

  var RANKS = {
    S: { color: '#ffe066', word: '완벽한 메카닉!', sub: '부품도 순서도 전부 정확했다.' },
    A: { color: '#8fe3ff', word: '훌륭한 메카닉!', sub: '거의 다 맞혔다. 실전에서도 잘하겠다.' },
    B: { color: '#b6ffcb', word: '좋은 출발!',     sub: '핵심은 잡았다. 도감을 다시 보면 완벽!' },
    C: { color: '#ffc0c8', word: '수고했다!',       sub: '오늘 만져본 감각이 진짜 실력이 된다.' }
  };

  var Ending = {
    t: 0, rank: 'C', ready: false, parts: [],

    enter: function () {
      this.t = 0;
      this.rank = S.State.rank();
      this.ready = false;
      S.Audio.stopBGM();
      S.Audio.se('fanfare');
      setTimeout(function () { S.Audio.playBGM('ending'); }, 1200);

      // 축하 파티클
      this.parts = [];
      for (var i = 0; i < 40; i++) {
        this.parts.push({
          x: Math.random() * S.W, y: -Math.random() * 200,
          v: 20 + Math.random() * 40, w: Math.random() * 2 + 1,
          c: ['#ffe066', '#8fe3ff', '#ff8fb0', '#b6ffcb'][Math.floor(Math.random() * 4)],
          p: Math.random() * 6
        });
      }
    },

    update: function (dt) {
      this.t += dt;
      for (var i = 0; i < this.parts.length; i++) {
        var p = this.parts[i];
        p.y += p.v * dt;
        if (p.y > S.H + 4) { p.y = -4; p.x = Math.random() * S.W; }
      }
      if (this.t > 1.2) this.ready = true;
      if (this.ready && (S.Input.pressed.ok || S.Input.pressed.cancel || S.Input.mouse.pressed)) {
        S.Audio.stopBGM();
        S.Game.transition('attract');
      }
    },

    draw: function (r) {
      var C = S.C, R = RANKS[this.rank];
      r.vgradient(0, 0, S.W, S.H, '#101a3a', '#2a1a4a');

      for (var i = 0; i < this.parts.length; i++) {
        var p = this.parts[i];
        r.rect(p.x + Math.sin(this.t * 2 + p.p) * 6, p.y, p.w + 1, p.w + 1, p.c);
      }

      r.text('M I S S I O N   C O M P L E T E', S.W / 2, 18,
        { size: 13, color: '#ffffff', align: 'center' });
      r.rect(S.W / 2 - 120, 38, 240, 1, '#5a76b8');

      // 랭크
      var pop = Math.min(1, this.t * 3);
      var size = Math.round(40 * pop) + 8;
      r.text(this.rank, S.W / 2, 56, { size: size, color: R.color, align: 'center' });
      r.text('R A N K', S.W / 2, 50, { size: 9, color: '#9fb4d8', align: 'center' });

      if (this.t > 0.6) {
        r.text(R.word, S.W / 2, 112, { size: 15, color: R.color, align: 'center' });
        r.text(R.sub, S.W / 2, 134, { size: 10, color: C.text, align: 'center' });
      }

      if (this.t > 0.9) {
        var bw = 260, bx = (S.W - bw) / 2;
        r.window(bx, 152, bw, 76);
        var total = S.State.quizOk + S.State.quizNg;
        var acc = total ? Math.round(S.State.quizOk / total * 100) : 0;
        var el = Math.round(S.State.elapsed());
        var mm = Math.floor(el / 60), ss = el % 60;
        var rows = [
          ['정답률', S.State.quizOk + ' / ' + total + '   (' + acc + '%)'],
          ['걸린 시간', mm + '분 ' + (ss < 10 ? '0' : '') + ss + '초'],
          ['도감 수집', S.State.dexCount() + ' / ' + S.PARTS.length + ' 종']
        ];
        for (var k = 0; k < rows.length; k++) {
          r.text(rows[k][0], bx + 18, 164 + k * 20, { size: 11, color: C.textHi });
          r.text(rows[k][1], bx + bw - 18, 164 + k * 20, { size: 11, color: C.text, align: 'right' });
        }
      }

      if (this.ready && (this.t % 1.2) < 0.7) {
        r.text(S.T('ending.press', ''), S.W / 2, S.H - 24,
          { size: 10, color: '#cfe0ff', align: 'center' });
      }
    }
  };

  S.Game.register('ending', Ending);
})(SPIKE);

</script>

<script>
/* ==== src/main.js ==== */
/* ============================================================
 *  main — 부팅
 * ============================================================ */
(function (S) {
  'use strict';

  function boot() {
    var canvas = document.getElementById('game');
    S.Audio.init();
    S.Game.start(canvas, 'attract');

    // 첫 클릭/키 입력에서 오디오 잠금 해제
    var unlock = function () {
      S.Audio.resume();
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);

    // 우클릭 메뉴 차단 (부스 환경)
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var loading = document.getElementById('loading');
    if (loading) loading.remove();
  }

  /* 텍스트 JSON → 폰트 순으로 준비한 뒤 게임을 띄운다.
     순서가 중요하다: JSON 이 폰트 사다리를 정하고, 그 사다리로 폰트를 로드한다.
     어느 쪽이 실패해도 부스가 멈추면 안 되므로 전부 fallback 으로 진행한다. */
  function start() {
    var p = S.Text ? S.Text.boot() : Promise.resolve();
    p.then(function () { return S.Font.preload(); }, function () { return S.Font.preload(); })
     .then(boot, boot);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})(SPIKE);

</script>
