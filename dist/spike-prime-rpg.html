/* ============================================================
 *  scenes/field — 탑다운 필드 (타일맵 + 그리드 이동 + 대화)
 * ============================================================ */
(function (S) {
  'use strict';

  var T = S.TILE;
  var STEP = 0.16;           // 한 칸 이동 시간(초)
  var DIRV = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };

  var Field = {
    mapId: '', map: null,
    solid: null,
    player: null,
    cam: { x: 0, y: 0 },
    viewW: S.W, viewH: S.H,
    mw: null,
    animT: 0,
    busy: false,

    enter: function (p) {
      this.mapId = p.map || 'village';
      this.map = S.MAPS[this.mapId];
      this.mw = this.mw || new S.MessageWindow();
      this.mw.close();
      this.busy = false;

      this.viewW = this.map.split ? 192 : S.W;
      this.viewH = S.H;
      if (this.map.split) this.mw = new S.MessageWindow({ x: 4, w: this.viewW - 8, h: 66 });
      else this.mw = new S.MessageWindow();

      this._buildSolid();

      var st = (p.at) ? p.at : this.map.start;
      this.player = {
        tx: st.x, ty: st.y, px: st.x * T, py: st.y * T,
        dir: st.dir || 'down', moving: false, t: 0, frame: 0, animT: 0,
        fx: st.x, fy: st.y
      };
      this._camera();

      S.Audio.resume();
      if (this.map.bgm) S.Audio.playBGM(this.map.bgm);

      if (S.MissionPanel && this.map.split) S.MissionPanel.enter();
    },

    exit: function () {
      if (S.MissionPanel && this.map && this.map.split) S.MissionPanel.exit();
    },

    _buildSolid: function () {
      var m = this.map, h = m.ground.length, w = m.ground[0].length;
      this.gw = w; this.gh = h;
      var grid = [];
      for (var y = 0; y < h; y++) {
        grid[y] = [];
        for (var x = 0; x < w; x++) {
          grid[y][x] = S.SOLID_CHARS.indexOf(m.ground[y][x]) >= 0;
        }
      }
      for (var i = 0; i < (m.objects || []).length; i++) {
        var o = m.objects[i];
        for (var j = 0; j < (o.solid || []).length; j++) {
          var c = o.solid[j];
          if (grid[c[1]]) grid[c[1]][c[0]] = true;
        }
      }
      this.solid = grid;
    },

    passable: function (tx, ty) {
      if (tx < 0 || ty < 0 || ty >= this.gh || tx >= this.gw) return false;
      if (this.solid[ty][tx]) return false;
      var n = this.map.npcs || [];
      for (var i = 0; i < n.length; i++) {
        if (n[i].hidden) continue;
        if (n[i].tx === tx && n[i].ty === ty) return false;
      }
      return true;
    },

    /* ---------------- 갱신 ---------------- */

    update: function (dt) {
      this.animT += dt;

      if (this.mw.active) { this.mw.update(dt); return; }
      if (this.busy) return;

      var pl = this.player, I = S.Input;

      // 이동 보간
      if (pl.moving) {
        pl.t += dt / STEP;
        if (pl.t >= 1) {
          pl.t = 0; pl.moving = false;
          pl.px = pl.tx * T; pl.py = pl.ty * T;
          this._onArrive();
        } else {
          pl.px = (pl.fx + (pl.tx - pl.fx) * pl.t) * T;
          pl.py = (pl.fy + (pl.ty - pl.fy) * pl.t) * T;
        }
        pl.animT += dt;
      } else {
        var d = null;
        if (I.down.up) d = 'up';
        else if (I.down.down) d = 'down';
        else if (I.down.left) d = 'left';
        else if (I.down.right) d = 'right';

        if (d) {
          pl.dir = d;
          var v = DIRV[d];
          var nx = pl.tx + v[0], ny = pl.ty + v[1];
          if (this.passable(nx, ny)) {
            pl.fx = pl.tx; pl.fy = pl.ty;
            pl.tx = nx; pl.ty = ny;
            pl.moving = true; pl.t = 0;
            pl.frame = pl.frame === 1 ? 2 : 1;
          } else {
            pl.frame = 0;
          }
        } else {
          pl.frame = 0;
          pl.animT = 0;
        }

        if (I.pressed.ok) this._interact();
        if (I.pressed.cancel) S.Game.push('dex');
      }

      this._camera();
    },

    _camera: function () {
      var mw = this.gw * T, mh = this.gh * T;
      var cx = this.player.px + T / 2 - this.viewW / 2;
      var cy = this.player.py + T / 2 - this.viewH / 2;
      this.cam.x = Math.max(0, Math.min(mw - this.viewW, Math.round(cx)));
      this.cam.y = Math.max(0, Math.min(mh - this.viewH, Math.round(cy)));
      if (mw <= this.viewW) this.cam.x = 0;
      if (mh <= this.viewH) this.cam.y = 0;
    },

    _onArrive: function () {
      var pl = this.player;
      var ex = this.map.exits || [];
      for (var i = 0; i < ex.length; i++) {
        var e = ex[i];
        if (e.tx === pl.tx && e.ty === pl.ty) {
          if (e.need && !S.State.flags[e.need]) {
            this.mw.show(e.deny || '아직 갈 수 없다.');
            // 되돌려 세운다
            var v = DIRV[pl.dir];
            pl.tx -= v[0]; pl.ty -= v[1];
            pl.px = pl.tx * T; pl.py = pl.ty * T;
            pl.dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[pl.dir];
            return;
          }
          S.Audio.se('ok');
          S.Game.transition('field', { map: e.to, at: e.at });
          return;
        }
      }
    },

    /* 정면 칸의 대상과 상호작용 */
    _interact: function () {
      var pl = this.player, v = DIRV[pl.dir];
      var fx = pl.tx + v[0], fy = pl.ty + v[1];

      var n = this.map.npcs || [];
      for (var i = 0; i < n.length; i++) {
        if (n[i].hidden) continue;
        if (n[i].tx === fx && n[i].ty === fy) {
          n[i].dir = { up: 'down', down: 'up', left: 'right', right: 'left' }[pl.dir];
          S.Dialogue.talk(this.mapId, n[i].id, this);
          return;
        }
      }
      var o = this.map.objects || [];
      for (var j = 0; j < o.length; j++) {
        if (!o[j].id) continue;
        var cells = o[j].solid || [];
        for (var k = 0; k < cells.length; k++) {
          if (cells[k][0] === fx && cells[k][1] === fy) {
            S.Dialogue.talk(this.mapId, o[j].id, this);
            return;
          }
        }
      }
    },

    say: function (msgs, done) { this.mw.show(msgs, done); },
    ask: function (msg, choices, cb) { this.mw.ask(msg, choices, cb); },

    /* ---------------- 그리기 ---------------- */

    draw: function (r) {
      var ctx = r.ctx;
      ctx.save();
      if (this.map.split) {
        ctx.beginPath();
        ctx.rect(0, 0, this.viewW, this.viewH);
        ctx.clip();
      }
      ctx.translate(-this.cam.x, -this.cam.y);

      this._drawGround(r);
      this._drawEntities(r);

      ctx.restore();

      if (this.map.split && S.MissionPanel) S.MissionPanel.draw(r, this.viewW);

      this._drawHUD(r);
      this.mw.draw(r);
    },

    _drawGround: function (r) {
      var m = this.map;
      var x0 = Math.floor(this.cam.x / T), x1 = Math.ceil((this.cam.x + this.viewW) / T);
      var y0 = Math.floor(this.cam.y / T), y1 = Math.ceil((this.cam.y + this.viewH) / T);
      for (var y = y0; y < y1 && y < this.gh; y++) {
        for (var x = x0; x < x1 && x < this.gw; x++) {
          if (x < 0 || y < 0) continue;
          var ch = m.ground[y][x];
          var tile = S.TERRAIN[ch] || 't_grass';
          var sp = S.Sprites.get(tile);
          if (sp) r.ctx.drawImage(sp, x * T, y * T);
          if (ch === 'D') {
            // 출구 표시
            r.rect(x * T + 2, y * T + 2, T - 4, T - 4, '#00000044');
            r.text('▼', x * T + T / 2, y * T + 3, { size: 10, color: '#ffe066', align: 'center' });
          }
        }
      }
    },

    _drawEntities: function (r) {
      var list = [];
      var m = this.map, i;

      for (i = 0; i < (m.objects || []).length; i++) {
        var o = m.objects[i];
        if (o.hidden) continue;
        var sp = S.Sprites.get(o.sprite);
        if (!sp) continue;
        list.push({
          y: (o.ty + 1) * T,
          draw: function (o, sp) {
            return function () {
              r.ctx.drawImage(sp, o.tx * T, (o.ty + 1) * T - sp.height);
            };
          }(o, sp)
        });
      }

      for (i = 0; i < (m.npcs || []).length; i++) {
        var n = m.npcs[i];
        if (n.hidden) continue;
        list.push({ y: (n.ty + 1) * T, draw: this._npcDrawer(r, n) });
      }

      list.push({ y: this.player.py + T, draw: this._playerDrawer(r) });

      list.sort(function (a, b) { return a.y - b.y; });
      for (i = 0; i < list.length; i++) list[i].draw();
    },

    _npcDrawer: function (r, n) {
      var self = this;
      return function () {
        var s = S.Sprites.charSprite(n.char, n.dir || 'down', 0);
        var sp = S.Sprites.get(s.id);
        if (!sp) return;
        var dx = n.tx * T + (T - 16) / 2;
        var dy = (n.ty + 1) * T - sp.height + 4;
        r.sprite(s.id, dx, dy, { flipX: s.flip });
        // 아직 말 안 건 NPC 머리 위 !
        if (n.mark && !S.State.flags['talked_' + n.id]) {
          var bob = Math.sin(self.animT * 5) * 2;
          r.sprite('o_excl', dx + 4, dy - 12 + bob);
        }
      };
    },

    _playerDrawer: function (r) {
      var pl = this.player;
      return function () {
        var frame = pl.moving ? (Math.floor(pl.animT * 8) % 2 === 0 ? 1 : 2) : 0;
        var s = S.Sprites.charSprite('hero', pl.dir, frame);
        var bob = (pl.moving && frame !== 0) ? -1 : 0;
        var sp = S.Sprites.get(s.id);
        if (!sp) return;
        r.sprite(s.id, Math.round(pl.px) + (T - 16) / 2,
          Math.round(pl.py) + T - sp.height + 4 + bob, { flipX: s.flip });
      };
    },

    _drawHUD: function (r) {
      var C = S.C;
      var obj = S.Quest.current();

      // 좌측 목표
      var ow = r.textWidth(obj, 10) + 18;
      r.window(4, 4, Math.min(ow, this.viewW - 8), 20, { alpha: 0.85 });
      r.text('◆ ' + obj, 11, 9, { size: 10, color: C.textHi });

      // 우측 타이머 (분할 맵에서는 패널이 담당)
      if (!this.map.split) {
        var t = S.State.clock();
        var late = S.State.remaining() < 120;
        var tw = 54;
        r.window(S.W - tw - 4, 4, tw, 20, { alpha: 0.85 });
        r.text('⏱ ' + t, S.W - tw + 4, 9,
          { size: 10, color: S.State.paused ? C.textDim : (late ? C.textNg : C.text) });
      }
    }
  };

  S.Game.register('field', Field);
  S.Field = Field;
})(SPIKE);

</script>
<script>
/* ==== src/scenes/cards.js ==== */
/* ============================================================
 *  scenes/cards — 부품 카드 넘김 (도감 등록 연출)
 *  push('cards', { title, ids:[...], onDone })
 * ============================================================ */
(function (S) {
  'use strict';

  var Cards = {
    ids: [], i: 0, title: '', onDone: null,
    t: 0, slide: 0,

    enter: function (p) {
      this.ids = p.ids || [];
      this.title = p.title || '부품 도감';
      this.onDone = p.onDone || null;
      this.i = 0; this.t = 0; this.slide = 1;
      this._register();
    },

    _register: function () {
      var id = this.ids[this.i];
      if (id && S.State.learn(id)) S.Audio.se('item');
      else S.Audio.se('cursor');
    },

    update: function (dt) {
      this.t += dt;
      if (this.slide > 0) this.slide = Math.max(0, this.slide - dt * 6);

      var I = S.Input;
      var next = I.pressed.ok || I.mouse.pressed;
      if (next) {
        this.i++;
        if (this.i >= this.ids.length) {
          var cb = this.onDone;
          S.Game.pop();
          if (cb) cb();
          return;
        }
        this.slide = 1;
        this._register();
      }
      if (I.pressed.cancel) {
        // 건너뛰기 — 남은 카드도 도감에는 등록해 준다
        for (var k = this.i; k < this.ids.length; k++) S.State.learn(this.ids[k]);
        var cb2 = this.onDone;
        S.Game.pop();
        if (cb2) cb2();
      }
    },

    draw: function (r) {
      var C = S.C;
      r.fade(0.72);

      var part = S.partById(this.ids[this.i]);
      if (!part) return;

      var bw = 344, bh = 196;
      var bx = Math.round((S.W - bw) / 2);
      var by = 44 + Math.round(this.slide * 10);

      r.window(bx, by, bw, bh);

      // 상단 타이틀 바
      r.rect(bx + 4, by + 4, bw - 8, 18, '#0a1230');
      r.text(this.title, bx + bw / 2, by + 8, { size: 11, color: C.textHi, align: 'center' });
      r.text((this.i + 1) + ' / ' + this.ids.length, bx + bw - 12, by + 8,
        { size: 10, color: C.textDim, align: 'right' });

      // 아이콘 (3배 확대)
      var ix = bx + 18, iy = by + 34;
      r.rect(ix, iy, 100, 100, '#0a1230');
      r.frame(ix, iy, 100, 100, C.winEdge2, 1);
      var sp = S.Sprites.get(part.icon);
      if (sp) {
        var pulse = 1 + Math.sin(this.t * 4) * 0.02;
        r.ctx.drawImage(sp, ix + 2, iy + 2, 96, 96);
        if (pulse) { /* 정수 스케일 유지 */ }
      }
      r.text('NEW', ix + 50, iy + 104, { size: 9, color: C.textOk, align: 'center' });

      // 텍스트
      var tx = bx + 132;
      r.text(part.title, tx, by + 34, { size: 14, color: C.textHi });
      r.text(part.real, tx, by + 53, { size: 10, color: C.textDim });
      r.rect(tx, by + 68, bw - 150, 1, C.winEdge2);
      r.text(part.one, tx, by + 74, { size: 11, color: C.white });

      var maxLines = 4;
      for (var i = 0; i < part.lines.length && i < maxLines; i++) {
        r.text(part.lines[i], tx, by + 94 + i * 14, { size: 10, color: C.text });
      }

      // 팁
      r.rect(bx + 8, by + bh - 34, bw - 16, 26, '#0a123099');
      r.text('TIP', bx + 14, by + bh - 29, { size: 9, color: C.textHi });
      var tip = S.Font.wrap(part.tip, 9, bw - 52);
      for (var j = 0; j < tip.length && j < 2; j++) {
        r.text(tip[j], bx + 38, by + bh - 30 + j * 11, { size: 9, color: C.textDim });
      }

      // 진행 안내
      if ((this.t % 1) < 0.6) {
        r.text('Z — 다음     X — 건너뛰기', S.W / 2, by + bh + 8,
          { size: 10, color: C.white, align: 'center' });
      }
    }
  };

  S.Game.register('cards', Cards);
})(SPIKE);

</script>
<script>
/* ==== src/scenes/dex.js ==== */
/* ============================================================
 *  scenes/dex — 부품 도감 (게임 내장 매뉴얼)
 *  X / Esc 로 열고 닫는다. 배운 부품만 상세가 보인다.
 * ============================================================ */
(function (S) {
  'use strict';

  var Dex = {
    idx: 0, scroll: 0, t: 0,

    enter: function () { this.t = 0; S.Audio.se('ok'); },
    exit: function () { S.Audio.se('cancel'); },

    update: function (dt) {
      this.t += dt;
      var I = S.Input, n = S.PARTS.length;

      if (I.pressed.up) { this.idx = (this.idx + n - 1) % n; S.Audio.se('cursor'); }
      if (I.pressed.down) { this.idx = (this.idx + 1) % n; S.Audio.se('cursor'); }
      if (I.pressed.left) { this.idx = Math.max(0, this.idx - 8); S.Audio.se('cursor'); }
      if (I.pressed.right) { this.idx = Math.min(n - 1, this.idx + 8); S.Audio.se('cursor'); }
      if (I.pressed.cancel || I.pressed.ok) { S.Game.pop(); return; }

      // 목록 스크롤 유지
      var rows = 9;
      if (this.idx < this.scroll) this.scroll = this.idx;
      if (this.idx >= this.scroll + rows) this.scroll = this.idx - rows + 1;

      // 마우스
      for (var i = 0; i < rows; i++) {
        var pi = this.scroll + i;
        if (pi >= n) break;
        if (I.hover(10, 44 + i * 18, 122, 18)) this.idx = pi;
      }
      if (I.clicked(S.W - 60, 6, 54, 18)) S.Game.pop();
    },

    draw: function (r) {
      var C = S.C;
      r.fade(0.8);

      // 헤더
      r.window(4, 4, S.W - 8, 26);
      r.text('부 품 도 감', 14, 10, { size: 14, color: C.textHi });
      r.text('수집 ' + S.State.dexCount() + ' / ' + S.PARTS.length, 150, 13, { size: 10, color: C.text });
      r.text('↑↓ 이동    X 닫기', S.W - 14, 13, { size: 10, color: C.textDim, align: 'right' });

      // 좌측 목록
      r.window(4, 34, 132, S.H - 40);
      var rows = 9;
      for (var i = 0; i < rows; i++) {
        var pi = this.scroll + i;
        if (pi >= S.PARTS.length) break;
        var p = S.PARTS[pi];
        var known = !!S.State.dex[p.id];
        var y = 44 + i * 18;
        var sel = pi === this.idx;
        if (sel) r.rect(8, y - 2, 124, 18, '#ffffff22');
        var sp = S.Sprites.get(p.icon);
        if (sp) {
          r.ctx.save();
          if (!known) r.ctx.globalAlpha = 0.25;
          r.ctx.drawImage(sp, 0, 0, 32, 32, 11, y - 1, 16, 16);
          r.ctx.restore();
        }
        r.text(known ? p.title : '？？？', 32, y + 1,
          { size: 11, color: sel ? C.textHi : (known ? C.text : C.textDim) });
      }
      if (S.PARTS.length > rows) {
        r.text('▼', 70, S.H - 18, { size: 9, color: C.textDim, align: 'center' });
      }

      // 우측 상세
      var p2 = S.PARTS[this.idx];
      var dx = 142, dw = S.W - 146;
      r.window(dx, 34, dw, S.H - 40);

      if (!S.State.dex[p2.id]) {
        r.text('아직 만나지 못한 부품', dx + dw / 2, 120, { size: 11, color: C.textDim, align: 'center' });
        return;
      }

      var sp2 = S.Sprites.get(p2.icon);
      if (sp2) {
        r.rect(dx + 10, 44, 68, 68, '#0a1230');
        r.frame(dx + 10, 44, 68, 68, C.winEdge2, 1);
        r.ctx.drawImage(sp2, dx + 12, 46, 64, 64);
      }
      r.text(p2.title, dx + 88, 46, { size: 13, color: C.textHi });
      r.text(p2.real, dx + 88, 64, { size: 9, color: C.textDim });
      r.text(p2.one, dx + 88, 82, { size: 10, color: C.white });
      r.text(p2.group === 'core' ? '전자 부품' : '구조 부품', dx + 88, 98,
        { size: 9, color: p2.group === 'core' ? C.blkSense : C.blkCtrl });

      r.rect(dx + 10, 118, dw - 20, 1, C.winEdge2);
      for (var k = 0; k < p2.lines.length; k++) {
        r.text(p2.lines[k], dx + 12, 126 + k * 14, { size: 10, color: C.text });
      }

      var ty = 126 + p2.lines.length * 14 + 6;
      r.rect(dx + 8, ty, dw - 16, 30, '#0a123099');
      r.text('TIP', dx + 14, ty + 4, { size: 9, color: C.textHi });
      var tip = S.Font.wrap(p2.tip, 9, dw - 56);
      for (var j = 0; j < tip.length && j < 2; j++) {
        r.text(tip[j], dx + 40, ty + 4 + j * 11, { size: 9, color: C.textDim });
      }
    }
  };

  S.Game.register('dex', Dex);
})(SPIKE);

</script>
<script>
/* ==== src/scenes/battle.js ==== */
/* ============================================================
 *  scenes/battle — 퀴즈 배틀 (정면 뷰 턴제)
 *   정답 = 큰 공격 / 오답 = 해설 후 작은 공격
 *   게임오버 없음. 모든 문제를 풀면 반드시 승리한다.
 * ============================================================ */
(function (S) {
  'use strict';

  var PH = { INTRO: 0, ASK: 1, JUDGE: 2, WHY: 3, WIN: 4 };

  var Battle = {
    enemy: '', enemyName: '', qs: [], qi: 0, sel: 0,
    phase: 0, t: 0, back: null, onWin: null,
    hpMax: 0, hp: 0, shake: 0, lastOk: false, dmgPop: null,
    mw: null, flash: 0, act: '',

    enter: function (p) {
      this.enemy = p.enemy || 'e_pin';
      this.enemyName = p.enemyName || '수상한 그림자';
      this.back = p.back || null;
      this.onWin = p.onWin || null;
      this.act = '';

      var set = S.QUIZ[p.quizSet] || S.QUIZ.gate;
      this.qs = set.map(S.shuffleQuiz);
      this.qi = 0; this.sel = 0;
      this.hpMax = this.qs.length; this.hp = this.qs.length;
      this.phase = PH.INTRO; this.t = 0; this.shake = 0; this.flash = 0;
      this.dmgPop = null;

      this.mw = new S.MessageWindow({ h: 54, y: S.H - 62 });
      var self = this;
      this.mw.show({ name: this.enemyName, text: this.enemyName + '이(가) 나타났다!\n문제를 맞혀서 물리쳐라!' },
        function () { self.phase = PH.ASK; });

      S.Audio.playBGM(p.bgm || 'battle');
    },

    update: function (dt) {
      this.t += dt;
      if (this.shake > 0) this.shake -= dt * 30;
      if (this.flash > 0) this.flash -= dt * 3;
      if (this.dmgPop) {
        this.dmgPop.t += dt;
        if (this.dmgPop.t > 1) this.dmgPop = null;
      }

      var I = S.Input;

      if (this.phase === PH.INTRO || this.phase === PH.WHY) {
        this.mw.update(dt);
        return;
      }

      if (this.phase === PH.ASK) {
        var q = this.qs[this.qi];
        var n = q.choices.length;
        if (I.pressed.up) { this.sel = (this.sel + n - 1) % n; S.Audio.se('cursor'); }
        if (I.pressed.down) { this.sel = (this.sel + 1) % n; S.Audio.se('cursor'); }
        for (var i = 0; i < n; i++) {
          var b = this._choiceRect(i);
          if (I.hover(b[0], b[1], b[2], b[3])) this.sel = i;
          if (I.clicked(b[0], b[1], b[2], b[3])) { this._answer(); return; }
        }
        if (I.pressed.ok) this._answer();
        return;
      }

      if (this.phase === PH.JUDGE) {
        if (this.t > 0.85) this._explain();
        return;
      }

      if (this.phase === PH.WIN) {
        this.mw.update(dt);
        return;
      }
    },

    _choiceRect: function (i) {
      var w = (S.W - 24) / 2 | 0;
      var x = 8 + (i % 2) * (w + 8);
      var y = 152 + Math.floor(i / 2) * 26;
      return [x, y, w, 22];
    },

    _answer: function () {
      var q = this.qs[this.qi];
      this.lastOk = (this.sel === q.ans);
      this.phase = PH.JUDGE;
      this.t = 0;

      if (this.lastOk) {
        S.State.quizOk++;
        S.Audio.se('correct');
        S.Game.quake(7);
        this.shake = 10;
        this.flash = 1;
        this.hp = Math.max(0, this.hp - 1);
        this.dmgPop = { t: 0, v: '정답!', col: S.C.textOk };
      } else {
        S.State.quizNg++;
        S.Audio.se('wrong');
        S.State.hp = Math.max(0, S.State.hp - 1);
        this.hp = Math.max(0, this.hp - 1);   // 진행은 반드시 된다
        this.dmgPop = { t: 0, v: '아쉽다…', col: S.C.textNg };
      }
    },

    _explain: function () {
      var q = this.qs[this.qi];
      var self = this;
      this.phase = PH.WHY;
      var msgs = [{
        name: this.lastOk ? '정답!' : '해설',
        color: this.lastOk ? S.C.textOk : S.C.textNg,
        text: (this.lastOk ? '' : '정답은 「' + q.choices[q.ans] + '」.\n') + q.why,
        icon: q.icon
      }];
      if (q.act) {
        this.act = q.act;
        msgs.push({ name: '실제 행동', color: S.C.textHi, text: '지금 실물에서 → ' + q.act });
      }
      this.mw.show(msgs, function () {
        self.qi++;
        self.sel = 0;
        if (self.qi >= self.qs.length) self._win();
        else self.phase = PH.ASK;
      });
    },

    _win: function () {
      this.phase = PH.WIN;
      S.Audio.stopBGM();
      S.Audio.se('fanfare');
      var self = this;
      var ok = S.State.quizOk, ng = S.State.quizNg;
      this.mw.show([
        { name: '승리!', color: S.C.textHi, text: this.enemyName + '을(를) 물리쳤다!' },
        { text: '정답 ' + ok + '개 / 오답 ' + ng + '개\n배운 것을 잊지 말자.' }
      ], function () {
        if (self.onWin) self.onWin();
        if (self.back) S.Game.transition('field', { map: self.back.map, at: self.back.at });
        else S.Game.transition('field', { map: 'village' });
      });
    },

    draw: function (r) {
      var C = S.C;

      // 배경
      r.vgradient(0, 0, S.W, S.H, '#1a1030', '#3a2050');
      for (var i = 0; i < 12; i++) {
        var y = 20 + i * 10;
        r.ctx.globalAlpha = 0.06;
        r.rect(0, y, S.W, 2, '#ffffff');
      }
      r.ctx.globalAlpha = 1;
      r.rect(0, 118, S.W, 4, '#241640');

      if (this.flash > 0) {
        r.ctx.globalAlpha = Math.min(0.5, this.flash * 0.5);
        r.rect(0, 0, S.W, S.H, '#ffffff');
        r.ctx.globalAlpha = 1;
      }

      // 적
      var sp = S.Sprites.get(this.enemy);
      if (sp) {
        var ex = (S.W - sp.width) / 2 + (this.shake > 0 ? (Math.random() - 0.5) * this.shake : 0);
        var ey = 36 + Math.sin(this.t * 2) * 3;
        r.ctx.save();
        if (this.phase === PH.JUDGE && this.lastOk) r.ctx.globalAlpha = 0.6;
        r.ctx.drawImage(sp, Math.round(ex), Math.round(ey));
        r.ctx.restore();
      }

      // 적 이름 + HP 게이지
      r.text(this.enemyName, S.W / 2, 10, { size: 12, color: '#ffd7d7', align: 'center' });
      var gw = 140, gx = (S.W - gw) / 2;
      r.rect(gx - 1, 27, gw + 2, 7, '#000000');
      r.rect(gx, 28, gw, 5, '#40203a');
      r.rect(gx, 28, Math.round(gw * this.hp / this.hpMax), 5, '#e0405a');

      // 데미지 팝업
      if (this.dmgPop) {
        var a = 1 - this.dmgPop.t;
        r.ctx.globalAlpha = Math.max(0, a);
        r.text(this.dmgPop.v, S.W / 2, 62 - this.dmgPop.t * 20,
          { size: 16, color: this.dmgPop.col, align: 'center' });
        r.ctx.globalAlpha = 1;
      }

      // 진행 표시
      r.window(4, 4, 62, 20, { alpha: 0.85 });
      r.text('문제 ' + Math.min(this.qi + 1, this.qs.length) + '/' + this.qs.length, 11, 9,
        { size: 10, color: C.textHi });

      // 플레이어 하트
      r.window(S.W - 76, 4, 72, 20, { alpha: 0.85 });
      for (var h = 0; h < S.State.maxHp; h++) {
        var full = h < S.State.hp;
        var hx = S.W - 70 + h * 13, hy = 10;
        r.rect(hx, hy + 1, 3, 3, full ? '#ff5a6a' : '#5a3a44');
        r.rect(hx + 5, hy + 1, 3, 3, full ? '#ff5a6a' : '#5a3a44');
        r.rect(hx, hy + 3, 8, 3, full ? '#ff5a6a' : '#5a3a44');
        r.rect(hx + 1, hy + 6, 6, 2, full ? '#d03a4a' : '#4a2e36');
        r.rect(hx + 3, hy + 8, 2, 1, full ? '#d03a4a' : '#4a2e36');
      }

      // 질문 + 보기
      if (this.phase === PH.ASK || this.phase === PH.JUDGE) {
        var q = this.qs[this.qi];
        r.window(4, 108, S.W - 8, 40);
        if (q.icon && S.Sprites.has(q.icon)) {
          r.ctx.drawImage(S.Sprites.get(q.icon), 0, 0, 32, 32, 9, 112, 30, 30);
        }
        var qlines = S.Font.wrap(q.q, 11, S.W - 56);
        for (var L = 0; L < qlines.length && L < 2; L++) {
          r.text(qlines[L], 44, 115 + L * 14, { size: 11, color: C.white });
        }

        for (var c = 0; c < q.choices.length; c++) {
          var b = this._choiceRect(c);
          var sel = c === this.sel;
          var reveal = this.phase === PH.JUDGE;
          var col = C.text, bg = null;
          if (reveal) {
            if (c === q.ans) { bg = '#1e6b3a'; col = '#b6ffcb'; }
            else if (c === this.sel) { bg = '#6b1e28'; col = '#ffc0c8'; }
          } else if (sel) { bg = '#2a4a8a'; col = C.textHi; }

          r.rect(b[0], b[1], b[2], b[3], bg || '#141c38');
          r.frame(b[0], b[1], b[2], b[3], sel && !reveal ? C.winEdge : C.winEdge2, 1);
          if (sel && !reveal) r.text('▶', b[0] + 4, b[1] + 5, { size: 10, color: C.textHi });
          r.text(q.choices[c], b[0] + 16, b[1] + 5, { size: 10, color: col });
        }

        if (this.phase === PH.ASK && (this.t % 1.4) < 0.9) {
          r.text('↑↓ 또는 마우스로 고르고  Z/클릭', S.W / 2, S.H - 16,
            { size: 9, color: C.textDim, align: 'center' });
        }
      }

      if (this.phase === PH.INTRO || this.phase === PH.WHY || this.phase === PH.WIN) {
        this.mw.draw(r);
      }
    }
  };

  S.Game.register('battle', Battle);
})(SPIKE);

</script>
<script>
/* ==== src/scenes/ending.js ==== */
/* ============================================================
 *  scenes/ending — 랭크 발표 (이름 입력 없음, 키보드 입력 0)
 * ============================================================ */
(function (S) {
  'use strict';

  var RANKS = {
    S: { color: '#ffe066', word: '완벽한 메카닉!', sub: '부품도 순서도 전부 정확했다.' },
    A: { color: '#8fe3ff', word: '훌륭한 메카닉!', sub: '거의 다 맞혔다. 실전에서도 잘하겠다.' },
    B: { color: '#b6ffcb', word: '좋은 출발!',     sub: '핵심은 잡았다. 도감을 다시 보면 완벽!' },
    C: { color: '#ffc0c8', word: '수고했다!',       sub: '오늘 만져본 감각이 진짜 실력이 된다.' }
  };

  var Ending = {
    t: 0, rank: 'C', ready: false, parts: [],

    enter: function () {
      this.t = 0;
      this.rank = S.State.rank();
      this.ready = false;
      S.Audio.stopBGM();
      S.Audio.se('fanfare');
      setTimeout(function () { S.Audio.playBGM('ending'); }, 1200);

      // 축하 파티클
      this.parts = [];
      for (var i = 0; i < 40; i++) {
        this.parts.push({
          x: Math.random() * S.W, y: -Math.random() * 200,
          v: 20 + Math.random() * 40, w: Math.random() * 2 + 1,
          c: ['#ffe066', '#8fe3ff', '#ff8fb0', '#b6ffcb'][Math.floor(Math.random() * 4)],
          p: Math.random() * 6
        });
      }
    },

    update: function (dt) {
      this.t += dt;
      for (var i = 0; i < this.parts.length; i++) {
        var p = this.parts[i];
        p.y += p.v * dt;
        if (p.y > S.H + 4) { p.y = -4; p.x = Math.random() * S.W; }
      }
      if (this.t > 1.2) this.ready = true;
      if (this.ready && (S.Input.pressed.ok || S.Input.pressed.cancel || S.Input.mouse.pressed)) {
        S.Audio.stopBGM();
        S.Game.transition('attract');
      }
    },

    draw: function (r) {
      var C = S.C, R = RANKS[this.rank];
      r.vgradient(0, 0, S.W, S.H, '#101a3a', '#2a1a4a');

      for (var i = 0; i < this.parts.length; i++) {
        var p = this.parts[i];
        r.rect(p.x + Math.sin(this.t * 2 + p.p) * 6, p.y, p.w + 1, p.w + 1, p.c);
      }

      r.text('M I S S I O N   C O M P L E T E', S.W / 2, 18,
        { size: 13, color: '#ffffff', align: 'center' });
      r.rect(S.W / 2 - 120, 38, 240, 1, '#5a76b8');

      // 랭크
      var pop = Math.min(1, this.t * 3);
      var size = Math.round(40 * pop) + 8;
      r.text(this.rank, S.W / 2, 56, { size: size, color: R.color, align: 'center' });
      r.text('R A N K', S.W / 2, 50, { size: 9, color: '#9fb4d8', align: 'center' });

      if (this.t > 0.6) {
        r.text(R.word, S.W / 2, 112, { size: 15, color: R.color, align: 'center' });
        r.text(R.sub, S.W / 2, 134, { size: 10, color: C.text, align: 'center' });
      }

      if (this.t > 0.9) {
        var bw = 260, bx = (S.W - bw) / 2;
        r.window(bx, 152, bw, 76);
        var total = S.State.quizOk + S.State.quizNg;
        var acc = total ? Math.round(S.State.quizOk / total * 100) : 0;
        var el = Math.round(S.State.elapsed());
        var mm = Math.floor(el / 60), ss = el % 60;
        var rows = [
          ['정답률', S.State.quizOk + ' / ' + total + '   (' + acc + '%)'],
          ['걸린 시간', mm + '분 ' + (ss < 10 ? '0' : '') + ss + '초'],
          ['도감 수집', S.State.dexCount() + ' / ' + S.PARTS.length + ' 종']
        ];
        for (var k = 0; k < rows.length; k++) {
          r.text(rows[k][0], bx + 18, 164 + k * 20, { size: 11, color: C.textHi });
          r.text(rows[k][1], bx + bw - 18, 164 + k * 20, { size: 11, color: C.text, align: 'right' });
        }
      }

      if (this.ready && (this.t % 1.2) < 0.7) {
        r.text('아무 키나 누르면 처음 화면으로', S.W / 2, S.H - 24,
          { size: 10, color: '#cfe0ff', align: 'center' });
      }
    }
  };

  S.Game.register('ending', Ending);
})(SPIKE);

</script>

<script>
/* ==== src/main.js ==== */
/* ============================================================
 *  main — 부팅
 * ============================================================ */
(function (S) {
  'use strict';

  function boot() {
    var canvas = document.getElementById('game');
    S.Audio.init();
    S.Game.start(canvas, 'attract');

    // 첫 클릭/키 입력에서 오디오 잠금 해제
    var unlock = function () {
      S.Audio.resume();
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    };
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);

    // 우클릭 메뉴 차단 (부스 환경)
    window.addEventListener('contextmenu', function (e) { e.preventDefault(); });

    var loading = document.getElementById('loading');
    if (loading) loading.remove();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})(SPIKE);

</script>
</body>
