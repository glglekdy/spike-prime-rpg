<script>
/* ==== src/core/const.js ==== */
/* ============================================================
 *  SPIKE Prime RPG — 전역 상수
 *  논리 해상도 384x288 (4:3), 타일 16px, 정수배 스케일
 * ============================================================ */
var SPIKE = window.SPIKE || (window.SPIKE = {});

SPIKE.W = 384;   // 논리 가로
SPIKE.H = 288;   // 논리 세로
SPIKE.TILE = 16; // 타일 한 변

/* 전체 체험 제한시간 (초). 참고용 타이머 — 강제 진행은 하지 않는다. */
SPIKE.TOTAL_SECONDS = 600;

/* 쯔꾸르풍 팔레트 */
SPIKE.C = {
  black:    '#000000',
  white:    '#ffffff',
  shadow:   '#00000099',

  // 메시지 윈도우 (RPG Maker 2000 기본 스킨 계열)
  winTop:   '#2b4fa8',
  winBot:   '#0b1b50',
  winEdge:  '#ffffff',
  winEdge2: '#6d8fe0',

  // 텍스트
  text:     '#ffffff',
  textDim:  '#9fb4d8',
  textHi:   '#ffe066',
  textOk:   '#7dff9b',
  textNg:   '#ff7d7d',

  // 필드
  grass:    '#4a8b3a',
  grass2:   '#5c9e45',
  path:     '#c9a86a',
  path2:    '#b8955a',
  wall:     '#6b6b7a',
  wall2:    '#54545f',
  floor:    '#8a7355',
  floor2:   '#7a6449',
  water:    '#3a6bb5',

  // SPIKE 블록 카테고리 색 (실제 앱과 동일 계열)
  blkEvent: '#ffbf00', // 이벤트 노랑
  blkMotor: '#4ecdc4', // 모터 민트
  blkMove:  '#4a90e2', // 움직임 파랑
  blkLight: '#9b59b6', // 조명 보라
  blkSound: '#ff6b9d', // 소리 분홍
  blkCtrl:  '#ff9f43', // 제어 주황
  blkSense: '#54c7ec', // 센서 하늘
  blkOp:    '#5cb85c', // 연산 초록
};

/* 블록 카테고리 메타 (도감/코딩 퍼즐 공용) */
SPIKE.BLOCK_CATS = [
  { id: 'event', name: '이벤트', spell: '시동 주문', color: SPIKE.C.blkEvent },
  { id: 'motor', name: '모터',   spell: '힘의 주문', color: SPIKE.C.blkMotor },
  { id: 'move',  name: '움직임', spell: '이동 주문', color: SPIKE.C.blkMove  },
  { id: 'light', name: '조명',   spell: '빛의 주문', color: SPIKE.C.blkLight },

  { id: 'ctrl',  name: '제어',   spell: '시간의 주문', color: SPIKE.C.blkCtrl },

<script>
/* ==== src/core/font.js ==== */
/* ============================================================
 *  SPIKE.Font — 도트 한글 텍스트
 *
 *  폰트 파일을 임베드하지 않고 "진짜 도트"를 얻는 방법:
 *    1) 시스템 폰트로 오프스크린 캔버스에 1배 크기로 그린다
 *    2) 알파값을 이진화(threshold)해서 안티에일리어싱 회색을 날린다
 *    3) 남은 픽셀을 지정 색으로 칠하고, 1px 검정 그림자를 깐다
 *    4) 결과 캔버스를 문자열 단위로 캐시
 *  이 캔버스가 다시 화면 전체 정수배(×3) 확대를 타면서
 *  1픽셀이 3×3 블록이 되어 쯔꾸르 감성이 나온다.
 * ============================================================ */
(function (S) {
  'use strict';

  var FAMILY = '"DungGeunMo","NeoDunggeunmo","Galmuri11","Galmuri9",' +
               'Dotum,"돋움","Malgun Gothic","맑은 고딕",monospace';

  var Font = S.Font = {
    family: FAMILY,
    threshold: 96,      // 이 값보다 진한 픽셀만 살린다 (낮을수록 획이 두꺼워짐)
    cache: new Map(),
    _measureCtx: null,

    /* 문자열 픽셀 폭 (그림자 1px 포함) */
    measure: function (text, size) {
      if (!this._measureCtx) {
        var c = document.createElement('canvas');
        this._measureCtx = c.getContext('2d');
      }
      var ctx = this._measureCtx;
      ctx.font = size + 'px ' + FAMILY;
      return Math.ceil(ctx.measureText(text).width) + 1;
    },

    lineHeight: function (size) { return size + 4; },

    /* 캐시된 도트 텍스트 캔버스 얻기 */
    get: function (text, size, color, shadow) {
      var key = size + '|' + color + '|' + (shadow ? 1 : 0) + '|' + text;
      var hit = this.cache.get(key);
      if (hit) return hit;
      var made = this._render(text, size, color, shadow);
      // 캐시가 너무 커지면 앞쪽부터 버린다 (순환형이라 문자열 종류는 유한)
      if (this.cache.size > 1200) {
        var firstKey = this.cache.keys().next().value;
        this.cache.delete(firstKey);
      }
      this.cache.set(key, made);
      return made;
    },

    _render: function (text, size, color, shadow) {
      var pad = 2;
      var w = this.measure(text, size) + pad * 2;
      var h = size + pad * 2 + 4;

      // --- 1) 흰색으로 글자만 그린다 ---
      var src = document.createElement('canvas');
      src.width = w; src.height = h;
      var sctx = src.getContext('2d', { willReadFrequently: true });
      sctx.font = size + 'px ' + FAMILY;
      sctx.textBaseline = 'top';
      sctx.fillStyle = '#ffffff';
      sctx.fillText(text, pad, pad);

      // --- 2) 알파 이진화 ---
      var img = sctx.getImageData(0, 0, w, h);
      var d = img.data, th = this.threshold;
      for (var i = 0; i < d.length; i += 4) {
        d[i + 3] = d[i + 3] >= th ? 255 : 0;
      }
      sctx.putImageData(img, 0, 0);

      // --- 3) 그림자 + 색 입히기 ---
      var out = document.createElement('canvas');
      out.width = w + 1; out.height = h + 1;
      var octx = out.getContext('2d');
      octx.imageSmoothingEnabled = false;

      if (shadow !== false) {
        octx.drawImage(src, 1, 1);
        octx.globalCompositeOperation = 'source-in';
        octx.fillStyle = '#000000';
        octx.fillRect(0, 0, out.width, out.height);
        octx.globalCompositeOperation = 'source-over';
      }

      // 본문은 별도 캔버스에서 색칠한 뒤 합성 (그림자를 덮어쓰지 않도록)
      var body = document.createElement('canvas');
      body.width = w; body.height = h;
      var bctx = body.getContext('2d');
      bctx.imageSmoothingEnabled = false;
      bctx.drawImage(src, 0, 0);
      bctx.globalCompositeOperation = 'source-in';
      bctx.fillStyle = color || '#ffffff';
      bctx.fillRect(0, 0, w, h);

      octx.drawImage(body, 0, 0);

      out._ox = pad;              // 실제 글자 시작 오프셋
      out._oy = pad;
      out._tw = w - pad * 2;      // 정렬 계산용 순수 글자 폭
      return out;
    },

    /* 줄바꿈: 우선 공백에서 끊고, 한 덩어리가 너무 길면 글자 단위로 끊는다 */
    wrap: function (text, size, maxWidth) {
      var lines = [];
      var paragraphs = String(text).split('\n');
      for (var p = 0; p < paragraphs.length; p++) {
        var words = paragraphs[p].split(' ');
        var line = '';
        for (var i = 0; i < words.length; i++) {
          var test = line ? line + ' ' + words[i] : words[i];
          if (this.measure(test, size) <= maxWidth) { line = test; continue; }
          if (line) { lines.push(line); line = ''; }
          // 단어 자체가 넘치면 글자 단위 분할
          var chunk = words[i];
          while (this.measure(chunk, size) > maxWidth) {
            var cut = chunk.length;
            while (cut > 1 && this.measure(chunk.slice(0, cut), size) > maxWidth) cut--;
            lines.push(chunk.slice(0, cut));
            chunk = chunk.slice(cut);
          }
          line = chunk;
        }
        lines.push(line);
      }
      return lines;
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/renderer.js ==== */
/* ============================================================
 *  SPIKE.Renderer — 384x288 논리 캔버스 + 정수배 업스케일
 * ============================================================ */
(function (S) {
  'use strict';

  function Renderer(canvas) {
    this.canvas = canvas;
    canvas.width = S.W;
    canvas.height = S.H;
    this.ctx = canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;
    this.scale = 1;
    this.fit();
    window.addEventListener('resize', this.fit.bind(this));
  }

  /* 창 크기에 맞는 최대 정수 배율 */
  Renderer.prototype.fit = function () {
    var pad = 16;
    var sx = Math.floor((window.innerWidth - pad) / S.W);
    var sy = Math.floor((window.innerHeight - pad) / S.H);
    var s = Math.max(1, Math.min(sx, sy));
    this.scale = s;
    this.canvas.style.width = (S.W * s) + 'px';
    this.canvas.style.height = (S.H * s) + 'px';
  };

  /* 화면(클라이언트) 좌표 → 논리 좌표 */
  Renderer.prototype.toLogical = function (clientX, clientY) {
    var r = this.canvas.getBoundingClientRect();
    return {
      x: Math.floor((clientX - r.left) / this.scale),
      y: Math.floor((clientY - r.top) / this.scale)
    };
  };

  /* ---------- 기본 도형 ---------- */

  Renderer.prototype.clear = function (color) {
    var c = this.ctx;
    c.fillStyle = color || '#000';
    c.fillRect(0, 0, S.W, S.H);
  };

  Renderer.prototype.rect = function (x, y, w, h, color) {
    var c = this.ctx;
    c.fillStyle = color;
    c.fillRect(x | 0, y | 0, w | 0, h | 0);
  };

  Renderer.prototype.frame = function (x, y, w, h, color, thick) {
    var t = thick || 1;
    this.rect(x, y, w, t, color);
    this.rect(x, y + h - t, w, t, color);
    this.rect(x, y, t, h, color);
    this.rect(x + w - t, y, t, h, color);
  };

  Renderer.prototype.vgradient = function (x, y, w, h, top, bottom) {
    var c = this.ctx;
    var g = c.createLinearGradient(0, y, 0, y + h);
    g.addColorStop(0, top);
    g.addColorStop(1, bottom);
    c.fillStyle = g;
    c.fillRect(x | 0, y | 0, w | 0, h | 0);
  };

  /* ---------- 쯔꾸르풍 윈도우 ----------
   * 파란 세로 그라데이션 + 흰 바깥선 + 연파랑 안쪽선 + 모서리 깎임
   */
  Renderer.prototype.window = function (x, y, w, h, opt) {
    opt = opt || {};
    var C = S.C;
    x |= 0; y |= 0; w |= 0; h |= 0;

    // 반투명 본체
    this.ctx.globalAlpha = opt.alpha == null ? 0.92 : opt.alpha;
    this.vgradient(x + 2, y + 2, w - 4, h - 4, opt.top || C.winTop, opt.bottom || C.winBot);
    this.ctx.globalAlpha = 1;

    // 바깥 흰 테두리 (모서리 1px 비움)
    var e = opt.edge || C.winEdge;
    this.rect(x + 1, y, w - 2, 1, e);
    this.rect(x + 1, y + h - 1, w - 2, 1, e);
    this.rect(x, y + 1, 1, h - 2, e);
    this.rect(x + w - 1, y + 1, 1, h - 2, e);

    // 안쪽 연파랑 선
    var e2 = opt.edge2 || C.winEdge2;
    this.frame(x + 2, y + 2, w - 4, h - 4, e2, 1);
  };

  /* ---------- 텍스트 ---------- */

  Renderer.prototype.text = function (str, x, y, opt) {
    opt = opt || {};
    var size = opt.size || 12;
    var color = opt.color || S.C.text;
    var cv = S.Font.get(String(str), size, color, opt.shadow !== false);
    var dx = x | 0, dy = y | 0;
    if (opt.align === 'center') dx -= Math.floor(cv._tw / 2);
    else if (opt.align === 'right') dx -= cv._tw;
    this.ctx.drawImage(cv, dx - cv._ox, dy - cv._oy);
    return cv._tw;
  };

  Renderer.prototype.textWidth = function (str, size) {
    return S.Font.measure(String(str), size || 12);
  };

  /* ---------- 스프라이트 (문자열 픽셀맵) ---------- */

  Renderer.prototype.sprite = function (name, x, y, opt) {
    var sp = S.Sprites.get(name);
    if (!sp) return;
    opt = opt || {};
    var sc = opt.scale || 1;
    this.ctx.save();
    if (opt.flipX) {
      this.ctx.translate((x | 0) + sp.width * sc, y | 0);
      this.ctx.scale(-sc, sc);
      this.ctx.drawImage(sp, 0, 0);
    } else {
      this.ctx.drawImage(sp, x | 0, y | 0, sp.width * sc, sp.height * sc);
    }
    this.ctx.restore();
  };

  /* ---------- 연출 ---------- */

  Renderer.prototype.fade = function (alpha, color) {
    if (alpha <= 0) return;
    this.ctx.globalAlpha = Math.min(1, alpha);
    this.rect(0, 0, S.W, S.H, color || '#000');
    this.ctx.globalAlpha = 1;
  };

  S.Renderer = Renderer;
})(SPIKE);

</script>
<script>
/* ==== src/core/input.js ==== */
/* ============================================================
 *  SPIKE.Input — 키보드 + 마우스 (논리 좌표)
 * ============================================================ */
(function (S) {
  'use strict';

  var MAP = {
    ArrowUp: 'up', KeyW: 'up',
    ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left',
    ArrowRight: 'right', KeyD: 'right',
    KeyZ: 'ok', Enter: 'ok', Space: 'ok', NumpadEnter: 'ok',
    KeyX: 'cancel', Escape: 'cancel', Backspace: 'cancel',
    ShiftLeft: 'dash', ShiftRight: 'dash'
  };

  var Input = S.Input = {
    down: {},        // 눌린 상태
    pressed: {},     // 이번 프레임에 새로 눌림
    released: {},
    mouse: { x: 0, y: 0, down: false, pressed: false, released: false },
    lastActivity: 0,
    renderer: null,

    init: function (renderer) {
      this.renderer = renderer;
      this.lastActivity = performance.now();
      var self = this;

      window.addEventListener('keydown', function (e) {
        // 브라우저 기본 스크롤/검색 차단
        if (MAP[e.code] || /^F\d+$/.test(e.code)) e.preventDefault();
        self.lastActivity = performance.now();

        // 강사 단축키는 씬보다 먼저 가로챈다
        if (S.Hotkeys && S.Hotkeys.handle(e)) return;

        var a = MAP[e.code];
        if (a && !self.down[a]) self.pressed[a] = true;
        if (a) self.down[a] = true;
        self.rawKey = e.code;
        if (S.Game && S.Game.scene && S.Game.scene.onKey) S.Game.scene.onKey(e);
      });

      window.addEventListener('keyup', function (e) {
        var a = MAP[e.code];
        if (a) { self.down[a] = false; self.released[a] = true; }
      });

      var cv = renderer.canvas;
      cv.addEventListener('mousemove', function (e) {
        var p = renderer.toLogical(e.clientX, e.clientY);
        self.mouse.x = p.x; self.mouse.y = p.y;
        self.lastActivity = performance.now();
      });
      cv.addEventListener('mousedown', function (e) {
        var p = renderer.toLogical(e.clientX, e.clientY);
        self.mouse.x = p.x; self.mouse.y = p.y;
        self.mouse.down = true; self.mouse.pressed = true;
        self.lastActivity = performance.now();
        e.preventDefault();
      });
      window.addEventListener('mouseup', function () {
        self.mouse.down = false; self.mouse.released = true;
        self.lastActivity = performance.now();
      });
      window.addEventListener('blur', function () {
        self.down = {};
        self.mouse.down = false;
      });
    },

    /* 매 프레임 끝에서 호출 */
    endFrame: function () {
      this.pressed = {};
      this.released = {};
      this.mouse.pressed = false;
      this.mouse.released = false;
    },

    idleSeconds: function () {
      return (performance.now() - this.lastActivity) / 1000;
    },

    poke: function () { this.lastActivity = performance.now(); },

    /* 마우스가 사각형 안에 있는가 */
    hover: function (x, y, w, h) {
      var m = this.mouse;
      return m.x >= x && m.x < x + w && m.y >= y && m.y < y + h;
    },
    clicked: function (x, y, w, h) {
      return this.mouse.pressed && this.hover(x, y, w, h);
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/audio.js ==== */
/* ============================================================
 *  SPIKE.Audio — WebAudio 8bit 합성 (외부 파일 0)
 *  BGM: 간단한 스텝 시퀀서 (리드 + 베이스)
 *  SE : 원샷 톤 / 노이즈
 * ============================================================ */
(function (S) {
  'use strict';

  var NOTE = { 'C':0,'C#':1,'D':2,'D#':3,'E':4,'F':5,'F#':6,'G':7,'G#':8,'A':9,'A#':10,'B':11 };

  function freq(name) {
    if (!name || name === '-') return 0;
    var m = /^([A-G]#?)(\d)$/.exec(name);
    if (!m) return 0;
    var n = NOTE[m[1]] + (parseInt(m[2], 10) + 1) * 12;
    return 440 * Math.pow(2, (n - 69) / 12);
  }

  var Audio = S.Audio = {
    ctx: null,
    master: null,
    muted: false,
    _bgm: null,
    _timer: null,
    _step: 0,

    init: function () {
      if (this.ctx) return;
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.35;
      this.master.connect(this.ctx.destination);
    },

    /* 브라우저 자동재생 정책: 첫 사용자 입력에서 호출 */
    resume: function () {
      if (!this.ctx) this.init();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    },

    toggleMute: function () {
      this.muted = !this.muted;
      if (this.master) this.master.gain.value = this.muted ? 0 : 0.35;
      return this.muted;
    },

    /* ---------- 단발음 ---------- */
    tone: function (f, dur, type, vol, slideTo) {
      if (!this.ctx || this.muted || !f) return;
      var t = this.ctx.currentTime;
      var o = this.ctx.createOscillator();
      var g = this.ctx.createGain();
      o.type = type || 'square';
      o.frequency.setValueAtTime(f, t);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(1, slideTo), t + dur);
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(vol == null ? 0.25 : vol, t + 0.006);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(this.master);
      o.start(t); o.stop(t + dur + 0.02);
    },

    noise: function (dur, vol, hp) {
      if (!this.ctx || this.muted) return;
      var t = this.ctx.currentTime;
      var len = Math.max(1, Math.floor(this.ctx.sampleRate * dur));
      var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = this.ctx.createBufferSource();
      src.buffer = buf;
      var g = this.ctx.createGain();
      g.gain.value = vol == null ? 0.2 : vol;
      var f = this.ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = hp || 800;
      src.connect(f); f.connect(g); g.connect(this.master);
      src.start(t);
    },

    /* ---------- 효과음 프리셋 ---------- */
    se: function (name) {
      switch (name) {
        case 'cursor':  this.tone(880, 0.05, 'square', 0.14); break;
        case 'ok':      this.tone(660, 0.06, 'square', 0.18);
                        setTimeout(function(){ Audio.tone(990, 0.09, 'square', 0.18); }, 55); break;
        case 'cancel':  this.tone(330, 0.09, 'square', 0.16); break;
        case 'text':    this.tone(1400, 0.015, 'square', 0.045); break;
        case 'correct': [784, 988, 1319].forEach(function (f, i) {
                          setTimeout(function () { Audio.tone(f, 0.12, 'square', 0.2); }, i * 70);
                        }); break;
        case 'wrong':   this.tone(200, 0.28, 'sawtooth', 0.18, 90); break;
        case 'hit':     this.noise(0.14, 0.26, 500); this.tone(160, 0.12, 'square', 0.18, 70); break;
        case 'damage':  this.tone(140, 0.2, 'sawtooth', 0.2, 60); break;
        case 'step':    this.tone(1046, 0.1, 'triangle', 0.13); break;
        case 'item':    [1046, 1318, 1568, 2093].forEach(function (f, i) {
                          setTimeout(function () { Audio.tone(f, 0.1, 'triangle', 0.18); }, i * 60);
                        }); break;
        case 'snap':    this.tone(1200, 0.04, 'square', 0.16);
                        setTimeout(function(){ Audio.tone(1600, 0.05, 'square', 0.14); }, 40); break;
        case 'fanfare': [523,659,784,1046,784,1046,1318].forEach(function (f, i) {
                          setTimeout(function () { Audio.tone(f, 0.22, 'square', 0.2); }, i * 130);
                        }); break;
      }
    },

    /* ---------- BGM ---------- */
    playBGM: function (track) {
      if (!this.ctx) this.init();
      if (this._bgm === track) return;
      this.stopBGM();
      var t = S.BGM && S.BGM[track];
      if (!t) return;
      this._bgm = track;
      this._step = 0;
      var self = this;
      this._timer = setInterval(function () { self._tick(t); }, t.tempo);
    },

    stopBGM: function () {
      if (this._timer) clearInterval(this._timer);
      this._timer = null;
      this._bgm = null;
    },

    _tick: function (t) {
      if (this.muted || !this.ctx) { this._step++; return; }
      var i = this._step % t.lead.length;
      var lead = t.lead[i];
      if (lead && lead !== '-') this.tone(freq(lead), t.tempo / 1000 * 0.85, 'square', 0.085);
      if (t.bass) {
        var b = t.bass[this._step % t.bass.length];
        if (b && b !== '-') this.tone(freq(b), t.tempo / 1000 * 1.6, 'triangle', 0.11);
      }
      if (t.drum) {
        var d = t.drum[this._step % t.drum.length];
        if (d === 'x') this.noise(0.05, 0.07, 3000);
        else if (d === 'o') this.tone(90, 0.1, 'sine', 0.16, 45);
      }
      this._step++;
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/sprites.js ==== */
/* ============================================================
 *  SPIKE.Sprites — 문자열 픽셀맵 → 캔버스 스프라이트
 *
 *  define(id, palette, rows)
 *    palette: { '문자': '#rrggbb' | null }  ('.'은 항상 투명)
 *    rows   : 문자열 배열. 길이가 어긋나면 자동으로 맞춘다.
 * ============================================================ */
(function (S) {
  'use strict';

  var Sprites = S.Sprites = {
    defs: {},
    cache: {},

    init: function () { /* 지연 생성이므로 할 일 없음 */ },

    define: function (id, pal, rows) {
      this.defs[id] = { pal: pal, rows: rows };
      delete this.cache[id];
      return this;
    },

    has: function (id) { return !!(this.cache[id] || this.defs[id]); },

    get: function (id) {
      if (this.cache[id]) return this.cache[id];
      var d = this.defs[id];
      if (!d) return null;
      var cv = this._build(d.pal, d.rows);
      this.cache[id] = cv;
      return cv;
    },

    _build: function (pal, rows) {
      var h = rows.length;
      var w = 0, i;
      for (i = 0; i < h; i++) if (rows[i].length > w) w = rows[i].length;

      var cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      var ctx = cv.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      for (var y = 0; y < h; y++) {
        var row = rows[y];
        for (var x = 0; x < row.length; x++) {
          var ch = row[x];
          if (ch === '.' || ch === ' ') continue;
          var col = pal[ch];
          if (!col) continue;
          ctx.fillStyle = col;
          ctx.fillRect(x, y, 1, 1);
        }
      }
      return cv;
    },

    /* 행 일부를 좌우로 민 복사본 (걷기 프레임 생성용) */
    shiftRows: function (rows, from, to, dx) {
      var out = rows.slice();
      for (var y = from; y <= to && y < rows.length; y++) {
        var r = rows[y];
        if (dx > 0) out[y] = '.'.repeat(dx) + r.slice(0, r.length - dx);
        else if (dx < 0) out[y] = r.slice(-dx) + '.'.repeat(-dx);
      }
      return out;
    }
  };

  /* ========================================================
   *  캐릭터 템플릿 (16 x 24)
   *  토큰: k외곽 h머리 H머리하이라이트 s피부 S피부그늘 e눈 m입
   *        c옷 C옷그늘 o포인트 b신발
   * ======================================================== */

  var BODY_DOWN = [
    '................',
    '.....kkkkkk.....',
    '....khhhhhhk....',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...kssssssssk...',
    '...kssssssssk...',
    '...ksesssseskk..',
    '...kssssssssk...',
    '...ksssmmsssk...',
    '...kssssssssk...',
    '....kssssssk....',
    '.....kkkkkk.....',
    '..kkcccccccckk..',
    '..kcoccccccock..',
    '..kcoccccccock..',
    '..ksccccccccsk..',
    '..kscCCCCCCcsk..',
    '...kCCCCCCCCk...',
    '...kCCC..CCCk...',
    '...kbbk..kbbk...',
    '...kbbk..kbbk...',
    '...kbbk..kbbk...',
    '...kkkk..kkkk...'
  ];

  var BODY_UP = [
    '................',
    '.....kkkkkk.....',
    '....khhhhhhk....',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '...khhhhhhhhk...',
    '....khhhhhhk....',
    '.....kkkkkk.....',
    '..kkcccccccckk..',
    '..kcccccccccck..',
    '..kcccccccccck..',
    '..ksccccccccsk..',
    '..kscCCCCCCcsk..',
    '...kCCCCCCCCk...',
    '...kCCC..CCCk...',
    '...kbbk..kbbk...',
    '...kbbk..kbbk...',
    '...kbbk..kbbk...',
    '...kkkk..kkkk...'
  ];

  var BODY_SIDE = [
    '................',
    '....kkkkkk......',
    '...khhhhhhk.....',
    '..khhhhhhhhk....',
    '..khhhhhhhhk....',
    '..khhhsssssk....',
    '..khsssssssk....',
    '..khssesssk.....',
    '..khsssssssk....',
    '..khsssmsssk....',
    '..khsssssssk....',
    '...khsssssk.....',
    '....kkkkkk......',
    '...kkcccckk.....',
    '..kcocccccck....',
    '..kcocccccsk....',
    '..kccccccck.....',
    '..kcCCCCCck.....',
    '...kCCCCCk......',
    '...kCCCCCk......',
    '...kbbkbbk......',
    '...kbbkbbk......',
    '...kbbkbbk......',
    '...kkkkkkk......'
  ];

  /* 머리 위 액세서리 (고글/모자 등). 본체 위에 덧그린다. */
  var ACC = {
    goggles_down: [
      '', '', '', '',
      '...kGGGGGGGGk...',
      '...kGggkkggGk...',
      '', '', '', '', '', '', ''
    ],
    goggles_side: [
      '', '', '', '',
      '..kGGGGGGGGk....',
      '..kGgggkkGk.....',
      '', '', '', '', '', '', ''
    ],
    hat_down: [
      '',
      '....kkkkkkkk....',
      '...kHHHHHHHHk...',
      '..kkkkkkkkkkkk..',
      '', '', '', '', '', '', '', '', ''
    ]
  };

  function merge(base, overlay) {
    if (!overlay) return base;
    var out = base.slice();
    for (var y = 0; y < overlay.length && y < out.length; y++) {
      var o = overlay[y];
      if (!o) continue;
      var b = out[y].split('');
      for (var x = 0; x < o.length && x < b.length; x++) {
        if (o[x] !== '.' && o[x] !== ' ') b[x] = o[x];
      }
      out[y] = b.join('');
    }
    return out;
  }

  /* 캐릭터 1명분(4방향 × 3프레임) 등록 */
  Sprites.defineChar = function (id, pal, accDown, accSide) {
    var LEG_TOP = 19, LEG_BOT = 23;
    var sets = {
      down: merge(BODY_DOWN, accDown ? ACC[accDown] : null),
      up:   BODY_UP,
      side: merge(BODY_SIDE, accSide ? ACC[accSide] : null)
    };
    for (var dir in sets) {
      var rows = sets[dir];
      this.define(id + '_' + dir + '_0', pal, rows);
      this.define(id + '_' + dir + '_1', pal, this.shiftRows(rows, LEG_TOP, LEG_BOT, 1));
      this.define(id + '_' + dir + '_2', pal, this.shiftRows(rows, LEG_TOP, LEG_BOT, -1));
    }
    return this;
  };

  /* 방향+프레임 → 스프라이트 id (좌향은 우향을 뒤집어 쓴다) */
  Sprites.charSprite = function (id, dir, frame) {
    var d = (dir === 'left' || dir === 'right') ? 'side' : dir;
    return { id: id + '_' + d + '_' + frame, flip: dir === 'left' };
  };

  /* ========================================================
   *  등장인물 팔레트
   * ======================================================== */
  var K = '#1a1a24';

  // 주인공 — 견습 메카닉 (파란 작업복 + 고글)
  Sprites.defineChar('hero', {
    k: K, h: '#7a4a28', H: '#9a6238', s: '#f2c79a', S: '#d6a274',
    e: '#20202c', m: '#b8705a',
    c: '#3f7cc4', C: '#2c5a92', o: '#ff9f43', b: '#4a3524',
    g: '#8fe3ff', G: '#c8ccd6'
  }, 'goggles_down', 'goggles_side');

  // 도감 할머니 — 부품 학자
  Sprites.defineChar('gran', {
    k: K, h: '#e8e8f0', H: '#ffffff', s: '#f0c79c', S: '#d4a478',
    e: '#20202c', m: '#b8705a',
    c: '#8e63c4', C: '#6a4795', o: '#ffd966', b: '#4a3a4a'
  });

  // 대장장이 — 테크닉 부품 장인
  Sprites.defineChar('smith', {
    k: K, h: '#3a2a1a', H: '#55402a', s: '#e0a878', S: '#c08a5c',
    e: '#20202c', m: '#a05a48',
    c: '#b03f3f', C: '#822c2c', o: '#7a5a3a', b: '#3a2a1a'
  });

  // 문지기 — 마을 입구 퀴즈
  Sprites.defineChar('guard', {
    k: K, h: '#4a4a58', H: '#6a6a78', s: '#eebf92', S: '#cc9f72',
    e: '#20202c', m: '#a05a48',
    c: '#8c98ac', C: '#67728a', o: '#ffd966', b: '#3a3a48'
  });

  // 로봇 장인 — 조립 공방 안내
  Sprites.defineChar('maker', {
    k: K, h: '#2a2a34', H: '#44444f', s: '#f0c79c', S: '#d4a478',
    e: '#20202c', m: '#b8705a',
    c: '#ff8c3a', C: '#cc6a22', o: '#3f7cc4', b: '#3a3a44',
    g: '#8fe3ff', G: '#c8ccd6'
  }, 'goggles_down', 'goggles_side');
})(SPIKE);

</script>
<script>
/* ==== src/core/tiles.js ==== */
/* ============================================================
 *  SPIKE 타일 & 오브젝트 아트
 *  - defineNoise : 잔디/바닥 같은 질감 타일을 시드 난수로 생성
 *  - defineDraw  : 큰 오브젝트를 그리기 함수로 정의 후 1회 캐시
 * ============================================================ */
(function (S) {
  'use strict';
  var Sp = S.Sprites;

  /* 결정적 난수 (같은 시드 → 항상 같은 무늬) */
  function prng(seed) {
    var s = seed | 0;
    return function () { s = (s * 1664525 + 1013904223) | 0; return ((s >>> 8) & 0xffff) / 0x10000; };
  }

  Sp.defineDraw = function (id, w, h, fn) {
    var cv = document.createElement('canvas');
    cv.width = w; cv.height = h;
    var ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    fn(ctx, w, h);
    this.cache[id] = cv;
    return this;
  };

  Sp.defineNoise = function (id, base, spots, density, seed, size) {
    var n = size || 16;
    return this.defineDraw(id, n, n, function (ctx) {
      ctx.fillStyle = base;
      ctx.fillRect(0, 0, n, n);
      var r = prng(seed || 7);
      var count = Math.floor(n * n * (density || 0.12));
      for (var i = 0; i < count; i++) {
        var x = Math.floor(r() * n), y = Math.floor(r() * n);
        ctx.fillStyle = spots[Math.floor(r() * spots.length)];
        ctx.fillRect(x, y, 1, 1);
      }
    });
  };

  /* ---------------- 바닥 타일 ---------------- */
  Sp.defineNoise('t_grass',  '#4a8b3a', ['#5c9e45', '#3d7530', '#6aad50'], 0.16, 11);
  Sp.defineNoise('t_grass2', '#4a8b3a', ['#5c9e45', '#e8d44a', '#f0f0f0'], 0.09, 29);  // 꽃
  Sp.defineNoise('t_path',   '#c2a06a', ['#d4b47e', '#ab8a58', '#b89a62'], 0.20, 37);
  Sp.defineNoise('t_dark',   '#3a3a48', ['#45455a', '#2e2e3a', '#4e4e64'], 0.16, 91);
  Sp.defineNoise('t_carpet', '#a03c4a', ['#b84a58', '#84303c'], 0.12, 103);

  /* 나무 바닥 — 판자 이음선 포함 */
  Sp.defineDraw('t_wood', 16, 16, function (ctx) {
    ctx.fillStyle = '#8a6a44'; ctx.fillRect(0, 0, 16, 16);
    var r = prng(53);
    for (var i = 0; i < 26; i++) {
      ctx.fillStyle = ['#9b7a52', '#75593a', '#a08558'][Math.floor(r() * 3)];
      ctx.fillRect(Math.floor(r() * 16), Math.floor(r() * 16), 1, 1);
    }
    ctx.fillStyle = '#5f4830';
    ctx.fillRect(0, 5, 16, 1);
    ctx.fillRect(0, 12, 16, 1);
    ctx.fillRect(8, 0, 1, 5);
    ctx.fillRect(3, 13, 1, 3);
  });

  /* 돌바닥 이음선 */
  Sp.defineDraw('t_stone', 16, 16, function (ctx) {
    ctx.fillStyle = '#6f6f7e'; ctx.fillRect(0, 0, 16, 16);
    var r = prng(71);
    for (var i = 0; i < 40; i++) {
      ctx.fillStyle = ['#7f7f8e', '#5d5d6a', '#888897'][Math.floor(r() * 3)];
      ctx.fillRect(Math.floor(r() * 16), Math.floor(r() * 16), 1, 1);
    }
    ctx.fillStyle = '#4c4c58';
    ctx.fillRect(0, 7, 16, 1);
    ctx.fillRect(7, 0, 1, 7);
    ctx.fillRect(11, 8, 1, 8);
  });

  /* ---------------- 벽 ---------------- */
  Sp.defineDraw('t_wall', 16, 16, function (ctx) {
    ctx.fillStyle = '#6a6272'; ctx.fillRect(0, 0, 16, 16);
    ctx.fillStyle = '#7d7486'; ctx.fillRect(0, 0, 16, 2);
    ctx.fillStyle = '#4d4655';
    ctx.fillRect(0, 7, 16, 1); ctx.fillRect(0, 15, 16, 1);
    ctx.fillRect(5, 0, 1, 7); ctx.fillRect(11, 8, 1, 7);
    ctx.fillStyle = '#585064'; ctx.fillRect(1, 9, 3, 2);
  });

  Sp.defineDraw('t_walltop', 16, 16, function (ctx) {
    ctx.fillStyle = '#8d8498'; ctx.fillRect(0, 0, 16, 16);
    ctx.fillStyle = '#a49bb0'; ctx.fillRect(0, 0, 16, 4);
    ctx.fillStyle = '#5d5568'; ctx.fillRect(0, 14, 16, 2);
  });

  /* ---------------- 오브젝트 ---------------- */

  // 나무 (16 x 28)
  Sp.defineDraw('o_tree', 16, 28, function (ctx) {
    ctx.fillStyle = '#5a3f26'; ctx.fillRect(6, 18, 4, 10);
    ctx.fillStyle = '#42301c'; ctx.fillRect(9, 18, 1, 10);
    var leaf = ['#2f6b28', '#3b8433', '#4d9c42'];
    var blobs = [[3,2,10,8],[1,6,14,8],[2,11,12,6],[4,15,8,4]];
    for (var i = 0; i < blobs.length; i++) {
      ctx.fillStyle = leaf[i % 3];
      var b = blobs[i]; ctx.fillRect(b[0], b[1], b[2], b[3]);
    }
    ctx.fillStyle = '#56ad48';
    ctx.fillRect(4, 3, 3, 2); ctx.fillRect(9, 7, 3, 2); ctx.fillRect(3, 12, 2, 2);
    ctx.fillStyle = '#25521f';
    ctx.fillRect(1, 13, 14, 1); ctx.fillRect(3, 18, 10, 1);
  });

  // 덤불 (16 x 12)
  Sp.defineDraw('o_bush', 16, 12, function (ctx) {
    ctx.fillStyle = '#31702a'; ctx.fillRect(1, 4, 14, 8);
    ctx.fillStyle = '#3f8a36'; ctx.fillRect(2, 2, 12, 7);
    ctx.fillStyle = '#4fa344'; ctx.fillRect(4, 1, 5, 3); ctx.fillRect(10, 3, 3, 2);
    ctx.fillStyle = '#25521f'; ctx.fillRect(1, 11, 14, 1);
  });

  // 표지판 (16 x 20)
  Sp.defineDraw('o_sign', 16, 20, function (ctx) {
    ctx.fillStyle = '#5a3f26'; ctx.fillRect(7, 12, 2, 8);
    ctx.fillStyle = '#c9a15e'; ctx.fillRect(1, 2, 14, 11);
    ctx.fillStyle = '#a8834a'; ctx.fillRect(1, 2, 14, 2);
    ctx.fillStyle = '#6b4a28'; ctx.strokeStyle = '#6b4a28';
    ctx.fillRect(1, 2, 14, 1); ctx.fillRect(1, 12, 14, 1);
    ctx.fillRect(1, 2, 1, 11); ctx.fillRect(14, 2, 1, 11);
    ctx.fillStyle = '#6b4a28';
    ctx.fillRect(3, 6, 10, 1); ctx.fillRect(3, 9, 7, 1);
  });

  // 울타리 (16 x 16)
  Sp.defineDraw('o_fence', 16, 16, function (ctx) {
    ctx.fillStyle = '#8a6a44';
    ctx.fillRect(2, 4, 3, 12); ctx.fillRect(11, 4, 3, 12);
    ctx.fillRect(0, 6, 16, 2); ctx.fillRect(0, 11, 16, 2);
    ctx.fillStyle = '#6b4f30';
    ctx.fillRect(2, 4, 3, 1); ctx.fillRect(11, 4, 3, 1); ctx.fillRect(0, 12, 16, 1);
  });

  // 작업대 (32 x 24) — 조립 공방
  Sp.defineDraw('o_workbench', 32, 24, function (ctx) {
    ctx.fillStyle = '#7a5a38'; ctx.fillRect(0, 6, 32, 7);
    ctx.fillStyle = '#9b7548'; ctx.fillRect(0, 6, 32, 3);
    ctx.fillStyle = '#5a4128'; ctx.fillRect(0, 12, 32, 1);
    ctx.fillRect(3, 13, 4, 11); ctx.fillRect(25, 13, 4, 11);
    ctx.fillStyle = '#6b4f30'; ctx.fillRect(3, 13, 4, 2); ctx.fillRect(25, 13, 4, 2);
    // 위에 놓인 부품들
    ctx.fillStyle = '#e8d44a'; ctx.fillRect(4, 2, 7, 4);        // 노란 브릭
    ctx.fillStyle = '#c8ccd6'; ctx.fillRect(13, 1, 8, 5);       // 회색 허브
    ctx.fillStyle = '#54c7ec'; ctx.fillRect(14, 2, 2, 2); ctx.fillRect(18, 2, 2, 2);
    ctx.fillStyle = '#d04a4a'; ctx.fillRect(23, 3, 6, 3);       // 빨간 축
  });

  // 책장 (16 x 28) — 도감
  Sp.defineDraw('o_shelf', 16, 28, function (ctx) {
    ctx.fillStyle = '#6b4f30'; ctx.fillRect(0, 0, 16, 28);
    ctx.fillStyle = '#4d381f'; ctx.fillRect(0, 0, 16, 2); ctx.fillRect(0, 26, 16, 2);
    var books = ['#c04a4a', '#4a8bc0', '#d0a03a', '#5cb85c', '#9b59b6'];
    for (var s = 0; s < 3; s++) {
      var y = 3 + s * 8;
      ctx.fillStyle = '#3d2c18'; ctx.fillRect(1, y + 6, 14, 2);
      for (var i = 0; i < 5; i++) {
        ctx.fillStyle = books[(s * 3 + i) % books.length];
        ctx.fillRect(2 + i * 3, y, 2, 6);
      }
    }
  });

<script>
/* ==== src/core/sprites_parts.js ==== */
/* ============================================================
 *  SPIKE Prime 부품 아이콘 (도감 · 체크리스트 · 퀴즈 공용)

(function (S) {
  'use strict';
  var Sp = S.Sprites;
  var D = Sp.defineDraw.bind(Sp);

  function px(ctx, c, x, y, w, h) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }

  /* ---------- 라지 허브 ---------- */
  D('p_hub', 32, 32, function (c) {
    px(c, '#20242e', 3, 2, 26, 28);          // 외곽선

    px(c, '#191d26', 8, 6, 16, 14);
    for (var y = 0; y < 5; y++) for (var x = 0; x < 5; x++) {
      var on = (x === 0 || x === 4 || y === 0 || y === 4);
      px(c, on ? '#ffcf3a' : '#3a4052', 9 + x * 3, 7 + y * 2 + (y ? 1 : 0) - (y ? 0 : 0), 2, 2);
    }
    // 중앙 버튼 + 좌우 버튼
    px(c, '#9aa2b4', 14, 22, 4, 4);
    px(c, '#d7dce8', 15, 23, 2, 2);
    px(c, '#9aa2b4', 7, 23, 3, 2);

<script>
/* ==== src/core/state.js ==== */
/* ============================================================
 *  SPIKE.State — 1회 플레이 진행 상태
 *  순환형이므로 저장하지 않는다. reset()이 곧 "다음 학생".
 * ============================================================ */
(function (S) {
  'use strict';

  var State = S.State = {
    started: 0,        // performance.now()
    running: false,
    paused: false,
    pausedAt: 0,
    pausedTotal: 0,

    chapter: 1,        // 1=마을 2=공방 3=해체의방
    dex: {},           // 도감 등록된 부품 id
    flags: {},         // 진행 플래그
    quizOk: 0,
    quizNg: 0,
    hp: 5,
    maxHp: 5,
    missionStep: 0,    // MAP2 실습 스텝 인덱스
    missionChecks: {}, // 체크리스트 상태
    codeSolved: false,
    bossStep: 0,

    reset: function () {
      this.started = performance.now();
      this.running = true;
      this.paused = false;
      this.pausedAt = 0;
      this.pausedTotal = 0;
      this.chapter = 1;
      this.dex = {};
      this.flags = {};
      this.quizOk = 0;
      this.quizNg = 0;
      this.hp = 5;
      this.maxHp = 5;
      this.missionStep = 0;
      this.missionChecks = {};
      this.codeSolved = false;
      this.bossStep = 0;
      if (S.resetMaps) S.resetMaps();      // NPC 위치 등 맵 변형 원상복구
      if (S.Mission) S.Mission.reset();
    },

    /* 경과 초 (일시정지 제외) */
    elapsed: function () {
      if (!this.running) return 0;
      var now = this.paused ? this.pausedAt : performance.now();
      return (now - this.started - this.pausedTotal) / 1000;
    },

    remaining: function () {
      return Math.max(0, S.TOTAL_SECONDS - this.elapsed());
    },

    /* mm:ss */
    clock: function () {
      var r = Math.ceil(this.remaining());
      var m = Math.floor(r / 60), s = r % 60;
      return m + ':' + (s < 10 ? '0' : '') + s;
    },

    togglePause: function () {
      if (this.paused) {
        this.pausedTotal += performance.now() - this.pausedAt;
        this.paused = false;
      } else {
        this.pausedAt = performance.now();
        this.paused = true;
      }
      return this.paused;
    },

    learn: function (partId) {
      if (!this.dex[partId]) {
        this.dex[partId] = true;
        return true;   // 새로 등록됨
      }
      return false;
    },

    dexCount: function () { return Object.keys(this.dex).length; },

    /* 최종 랭크 */
    rank: function () {
      var total = this.quizOk + this.quizNg;
      var acc = total ? this.quizOk / total : 0;
      var t = this.elapsed();
      var onTime = t <= S.TOTAL_SECONDS;
      if (acc >= 0.9 && onTime) return 'S';
      if (acc >= 0.75) return 'A';
      if (acc >= 0.5) return 'B';
      return 'C';
    }
  };
})(SPIKE);

</script>
<script>
/* ==== src/core/hotkeys.js ==== */
/* ============================================================
 *  SPIKE.Hotkeys — 강사 운영용 단축키 (순환형 부스 필수)
 *    Ctrl+R  다음 학생 (완전 초기화)
 *    F1      조작법
 *    F2      챕터 점프
 *    F3      타이머 일시정지
 *    M       음소거
 * ============================================================ */
(function (S) {
  'use strict';

  var Hotkeys = S.Hotkeys = {
    helpOpen: false,
    jumpOpen: false,
    toast: '',
    toastT: 0,

    say: function (msg) { this.toast = msg; this.toastT = 1.8; },

    handle: function (e) {
      // 챕터 점프 창이 열려 있으면 숫자 입력을 먹는다
      if (this.jumpOpen) {
        if (e.code === 'Digit1' || e.code === 'Numpad1') { this.jumpOpen = false; this._jump(1); return true; }
        if (e.code === 'Digit2' || e.code === 'Numpad2') { this.jumpOpen = false; this._jump(2); return true; }
        if (e.code === 'Digit3' || e.code === 'Numpad3') { this.jumpOpen = false; this._jump(3); return true; }
        if (e.code === 'Escape' || e.code === 'F2') { this.jumpOpen = false; return true; }
        return true;
      }

      if (e.ctrlKey && e.code === 'KeyR') {
        e.preventDefault();
        S.Audio.stopBGM();
        S.Game.transition('attract');
        this.say('초기화 — 다음 학생을 기다립니다');
        return true;
      }
      if (e.code === 'F1') { e.preventDefault(); this.helpOpen = !this.helpOpen; return true; }
      if (e.code === 'F2') { e.preventDefault(); this.jumpOpen = true; return true; }
      if (e.code === 'F3') {
        e.preventDefault();
        var p = S.State.togglePause();
        this.say(p ? '타이머 일시정지' : '타이머 재개');
        return true;
      }
      if (e.code === 'KeyM') {
        var m = S.Audio.toggleMute();
        this.say(m ? '음소거 ON' : '음소거 OFF');
        return true;
      }
      if (this.helpOpen) { this.helpOpen = false; return true; }
      return false;
    },

    _jump: function (ch) {

/* ============================================================
 *  SPIKE.Idle — 무인 자동 복귀 (반복 순환형 부스 필수)
 *  90초 무입력 → 10초 카운트다운 → 완전 초기화
 * ============================================================ */
(function (S) {
  'use strict';

  var LIMIT = 90;    // 무입력 허용 초
  var WARN = 10;     // 경고 카운트다운 초

  S.Idle = {
    enabled: true,

    tick: function (dt, r) {
      if (!this.enabled) return;
      if (S.Game.sceneName === 'attract') return;

      var idle = S.Input.idleSeconds();
      if (idle < LIMIT) return;

      var left = Math.ceil(LIMIT + WARN - idle);
      if (left <= 0) {
        S.Audio.stopBGM();
        S.Input.poke();
        S.Game.transition('attract');
        return;
      }

      // 경고 오버레이
      r.fade(0.6);
      var bw = 260, bh = 78, bx = (S.W - bw) / 2, by = (S.H - bh) / 2;
      r.window(bx, by, bw, bh);
      r.text('자리를 비우셨나요?', bx + bw / 2, by + 12,
        { size: 13, color: S.C.textHi, align: 'center' });
      r.text(left + '초 후 처음 화면으로 돌아갑니다', bx + bw / 2, by + 34,
        { size: 10, color: S.C.text, align: 'center' });
      r.text('아무 키나 누르면 계속합니다', bx + bw / 2, by + 54,
        { size: 10, color: S.C.textDim, align: 'center' });
    }
  };
})(SPIKE);

<script>
/* ==== src/core/engine.js ==== */
/* ============================================================
 *  SPIKE.Game — 게임 루프 + 씬 매니저
 *  씬 인터페이스: { enter(p), exit(), update(dt), draw(r), onKey(e) }
 * ============================================================ */
(function (S) {
  'use strict';

  var Game = S.Game = {
    renderer: null,
    scenes: {},
    scene: null,
    sceneName: '',
    stack: [],          // push/pop 용 (메뉴, 도감 등 오버레이 씬)
    _last: 0,
    _fade: 0,           // 0 = 없음, 양수 = 페이드 진행
    _fadeDir: 0,        // -1 어두워짐, +1 밝아짐
    _pending: null,
    shake: 0,

    register: function (name, scene) { this.scenes[name] = scene; return this; },

    /* 즉시 전환 */
    change: function (name, params) {
      if (this.scene && this.scene.exit) this.scene.exit();
      this.stack.length = 0;
      this.scene = this.scenes[name];
      this.sceneName = name;
      if (!this.scene) { console.error('없는 씬:', name); return; }
      if (this.scene.enter) this.scene.enter(params || {});
    },

    /* 페이드 아웃 → 전환 → 페이드 인 */
    transition: function (name, params) {
      if (this._pending) return;
      this._pending = { name: name, params: params };
      this._fade = 0;
      this._fadeDir = -1;
    },

    /* 오버레이 씬 (필드 위에 메뉴 등) */
    push: function (name, params) {
      var sc = this.scenes[name];
      if (!sc) return;
      this.stack.push(sc);
      if (sc.enter) sc.enter(params || {});
    },
    pop: function () {
      var sc = this.stack.pop();
      if (sc && sc.exit) sc.exit();
    },
    top: function () {
      return this.stack.length ? this.stack[this.stack.length - 1] : this.scene;
    },

    start: function (canvas, firstScene) {
      this.renderer = new S.Renderer(canvas);
      S.Input.init(this.renderer);
      S.Sprites.init();
      this.change(firstScene);
      this._last = performance.now();
      var self = this;
      requestAnimationFrame(function step(t) { self._loop(t); requestAnimationFrame(step); });
    },

    _loop: function (t) {
      var dt = Math.min(0.05, (t - this._last) / 1000);
      this._last = t;

      // --- 페이드 처리 ---
      if (this._fadeDir < 0) {
        this._fade += dt * 4;
        if (this._fade >= 1) {
          this._fade = 1;
          var p = this._pending;
          this._pending = null;
          this._fadeDir = 1;
          if (p) this.change(p.name, p.params);
        }
      } else if (this._fadeDir > 0) {
        this._fade -= dt * 3;
        if (this._fade <= 0) { this._fade = 0; this._fadeDir = 0; }
      }

      // --- 갱신 ---
      var active = this.top();
      if (active && active.update && this._fadeDir >= 0) active.update(dt);

      // 오버레이가 떠 있어도 바닥 씬의 애니메이션은 돌린다
      if (this.stack.length && this.scene && this.scene.updateBackground) {
        this.scene.updateBackground(dt);
      }

      // --- 그리기 ---
      var r = this.renderer;
      r.ctx.save();
      if (this.shake > 0) {
        this.shake -= dt * 40;
        var s = Math.max(0, this.shake);
        r.ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
      }
      if (this.scene && this.scene.draw) this.scene.draw(r);
      for (var i = 0; i < this.stack.length; i++) {
        if (this.stack[i].draw) this.stack[i].draw(r);
      }
      r.ctx.restore();

      if (this._fade > 0) r.fade(this._fade);

      if (S.Idle) S.Idle.tick(dt, r);
      if (S.Hotkeys) S.Hotkeys.draw(r);

      S.Input.endFrame();
    },

    quake: function (power) { this.shake = power || 8; }
  };
})(SPIKE);

</script>

  S.shuffleQuiz = function (q) {
    var pairs = q.choices.map(function (c, i) { return { c: c, ok: i === q.ans }; });
    for (var i = pairs.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = pairs[i]; pairs[i] = pairs[j]; pairs[j] = t;
    }
    var ans = 0;
    for (var k = 0; k < pairs.length; k++) if (pairs[k].ok) ans = k;
    return {
      q: q.q, icon: q.icon, why: q.why, act: q.act,
      choices: pairs.map(function (p) { return p.c; }),
      ans: ans
    };
  };
})(SPIKE);

  var TALK = {

    'village:gran': function (fd) {

<script>
/* ==== src/ui/messageWindow.js ==== */
/* ============================================================
 *  SPIKE.MessageWindow — 쯔꾸르풍 하단 대화창
 *   · 한 글자씩 타이핑 (진행 중 확인키 = 전체 즉시 표시)
 *   · 이름 박스, 선택지, 얼굴 자리(부품 아이콘) 지원
 * ============================================================ */
(function (S) {
  'use strict';

  var FONT = 12;
  var LINE = 16;

  function MessageWindow(opt) {
    opt = opt || {};
    this.x = opt.x == null ? 8 : opt.x;
    this.w = opt.w == null ? S.W - 16 : opt.w;
    this.h = opt.h == null ? 74 : opt.h;
    this.y = opt.y == null ? S.H - this.h - 8 : opt.y;
    this.speed = opt.speed == null ? 42 : opt.speed;  // 글자/초

    this.queue = [];
    this.cur = null;
    this.lines = [];
    this.shown = 0;
    this.total = 0;
    this.active = false;
    this.done = false;
    this.blink = 0;
    this.onDone = null;

    this.choiceList = null;
    this.choiceIndex = 0;
    this.onChoice = null;
  }

  /* msgs: 문자열 | {name, text, icon, color} | 배열 */
  MessageWindow.prototype.show = function (msgs, onDone) {
    if (!Array.isArray(msgs)) msgs = [msgs];
    this.queue = msgs.map(function (m) {
      return typeof m === 'string' ? { text: m } : m;
    });
    this.onDone = onDone || null;
    this.active = true;
    this._next();
    return this;
  };

  MessageWindow.prototype.ask = function (msg, choices, onChoice) {
    this.show(msg);
    this.choiceList = choices;
    this.choiceIndex = 0;
    this.onChoice = onChoice;
    return this;
  };

  MessageWindow.prototype.close = function () {
    this.active = false;
    this.cur = null;
    this.queue.length = 0;
    this.choiceList = null;
  };

  MessageWindow.prototype._next = function () {
    if (!this.queue.length) {
      if (this.choiceList) { this.done = true; return; }  // 선택지 대기
      this.active = false;
      this.cur = null;
      var cb = this.onDone; this.onDone = null;
      if (cb) cb();
      return;
    }
    this.cur = this.queue.shift();
    var innerW = this.w - 20 - (this.cur.icon ? 40 : 0);
    this.lines = S.Font.wrap(this.cur.text, FONT, innerW);
    this.total = this.lines.join('').length;
    this.shown = 0;
    this.done = false;
  };

  MessageWindow.prototype.update = function (dt) {
    if (!this.active) return;
    this.blink += dt;

    // --- 선택지 조작 ---
    if (this.choiceList && this.done) {
      var I = S.Input;
      if (I.pressed.up) { this.choiceIndex = (this.choiceIndex + this.choiceList.length - 1) % this.choiceList.length; S.Audio.se('cursor'); }
      if (I.pressed.down) { this.choiceIndex = (this.choiceIndex + 1) % this.choiceList.length; S.Audio.se('cursor'); }
      // 마우스
      for (var i = 0; i < this.choiceList.length; i++) {
        var cy = this._choiceY(i);
        if (I.hover(this.x + 10, cy, this.w - 20, LINE)) this.choiceIndex = i;
        if (I.clicked(this.x + 10, cy, this.w - 20, LINE)) { this._pick(); return; }
      }
      if (I.pressed.ok) this._pick();
      return;
    }

    // --- 타이핑 ---
    if (this.shown < this.total) {
      var before = Math.floor(this.shown);
      this.shown = Math.min(this.total, this.shown + this.speed * dt);
      if (Math.floor(this.shown) > before && Math.floor(this.shown) % 2 === 0) S.Audio.se('text');
      if (S.Input.pressed.ok || S.Input.mouse.pressed) { this.shown = this.total; }
      if (this.shown >= this.total) this.done = true;
      return;
    }

    this.done = true;
    if (S.Input.pressed.ok || S.Input.mouse.pressed) {
      S.Audio.se('cursor');
      this._next();
    }
  };

  MessageWindow.prototype._pick = function () {
    S.Audio.se('ok');
    var cb = this.onChoice, idx = this.choiceIndex;
    this.choiceList = null; this.onChoice = null;
    this.active = false; this.cur = null;
    if (cb) cb(idx);
  };

  MessageWindow.prototype._choiceY = function (i) {
    var n = this.choiceList.length;
    var boxH = n * LINE + 12;
    var boxY = this.y - boxH - 4;
    return boxY + 6 + i * LINE;
  };

  MessageWindow.prototype.draw = function (r) {
    if (!this.active || !this.cur) return;
    var C = S.C;

    r.window(this.x, this.y, this.w, this.h);

    var tx = this.x + 10;
    var ty = this.y + 9;

    // 아이콘(부품 그림) 자리
    if (this.cur.icon && S.Sprites.has(this.cur.icon)) {
      r.rect(this.x + 6, this.y + 6, 36, this.h - 12, '#0a1230');
      r.frame(this.x + 6, this.y + 6, 36, this.h - 12, C.winEdge2, 1);
      var sp = S.Sprites.get(this.cur.icon);
      r.sprite(this.cur.icon,
        this.x + 6 + (36 - sp.width) / 2 | 0,
        this.y + 6 + (this.h - 12 - sp.height) / 2 | 0);
      tx += 40;
    }

    // 이름 박스
    if (this.cur.name) {
      var nw = r.textWidth(this.cur.name, FONT) + 14;
      r.window(this.x + 4, this.y - 19, nw, 21, { alpha: 0.95 });
      r.text(this.cur.name, this.x + 11, this.y - 13, { size: FONT, color: this.cur.color || C.textHi });
    }

    // 본문 (타이핑 중이면 잘라서)
    var left = Math.floor(this.shown);
    for (var i = 0; i < this.lines.length && i < 4; i++) {
      var ln = this.lines[i];
      var part = ln;
      if (left < ln.length) part = ln.slice(0, Math.max(0, left));
      if (part) r.text(part, tx, ty + i * LINE, { size: FONT, color: C.text });
      left -= ln.length;
      if (left <= 0) break;
    }

    // ▼ 커서
    if (this.done && !this.choiceList && (this.blink % 0.9) < 0.55) {
      var cxp = this.x + this.w - 14, cyp = this.y + this.h - 12;
      r.rect(cxp, cyp, 7, 1, C.white);
      r.rect(cxp + 1, cyp + 1, 5, 1, C.white);
      r.rect(cxp + 2, cyp + 2, 3, 1, C.white);
      r.rect(cxp + 3, cyp + 3, 1, 1, C.white);
    }

    // 선택지
    if (this.choiceList && this.done) {
      var n = this.choiceList.length;
      var boxH = n * LINE + 12;
      var boxW = 0;
      for (var k = 0; k < n; k++) boxW = Math.max(boxW, r.textWidth(this.choiceList[k], FONT));
      boxW += 34;
      var boxX = this.x + this.w - boxW - 4;
      var boxY = this.y - boxH - 4;
      r.window(boxX, boxY, boxW, boxH);
      for (var j = 0; j < n; j++) {
        var yy = boxY + 6 + j * LINE;
        var sel = j === this.choiceIndex;
        if (sel) {
          r.rect(boxX + 4, yy - 1, boxW - 8, LINE, '#ffffff22');
          r.text('▶', boxX + 6, yy + 1, { size: FONT, color: C.textHi });
        }
        r.text(this.choiceList[j], boxX + 20, yy + 1,
          { size: FONT, color: sel ? C.textHi : C.text });
      }
    }
  };

  S.MessageWindow = MessageWindow;
})(SPIKE);

</script>

<script>
/* ==== src/scenes/attract.js ==== */
/* ============================================================
 *  scenes/attract — 타이틀 & 어트랙트 (다음 학생 대기 화면)
 *  scenes/opening — 20초 오프닝 (Z로 스킵)
 * ============================================================ */
(function (S) {
  'use strict';

  /* ================= 타이틀 ================= */
  var Attract = {
    t: 0, stars: null, demo: 0,

    enter: function () {
      this.t = 0; this.demo = 0;
      S.State.running = false;
      if (!this.stars) {
        this.stars = [];
        for (var i = 0; i < 46; i++) {
          this.stars.push({
            x: Math.random() * S.W, y: Math.random() * 150,
            s: Math.random() * 2 + 0.3, b: Math.random()
          });
        }
      }
      S.Audio.playBGM('title');
    },

    update: function (dt) {
      this.t += dt;
      this.demo += dt;
      var I = S.Input;
      if (I.pressed.ok || I.mouse.pressed) {
        S.Audio.resume();
        S.Audio.se('ok');
        S.State.reset();
        S.Game.transition('opening');
      }
    },

    draw: function (r) {
      var C = S.C;
      // 밤하늘
      r.vgradient(0, 0, S.W, S.H, '#0a0f2a', '#1b2a5e');
      for (var i = 0; i < this.stars.length; i++) {
        var st = this.stars[i];
        var a = 0.4 + 0.6 * Math.abs(Math.sin(this.t * 1.5 + st.b * 9));
        r.ctx.globalAlpha = a;
        r.rect(st.x, st.y, st.s < 1 ? 1 : 2, st.s < 1 ? 1 : 2, '#ffffff');
      }
      r.ctx.globalAlpha = 1;

      // 지면 실루엣
      r.rect(0, 196, S.W, S.H - 196, '#0d1a2e');
      r.rect(0, 196, S.W, 2, '#22406a');

      // 떠 있는 허브
      var by = 96 + Math.sin(this.t * 1.4) * 4;
      var hub = S.Sprites.get('p_hub');
      if (hub) r.ctx.drawImage(hub, (S.W - 64) / 2, by - 30, 64, 64);

      // 타이틀
      r.text('SPIKE  마 스 터', S.W / 2, 22, { size: 22, color: '#ffe066', align: 'center' });
      r.text('~ 잠 든  허 브  왕 ~', S.W / 2, 52, { size: 12, color: '#9fc4ff', align: 'center' });
      r.rect(S.W / 2 - 110, 72, 220, 1, '#4a6aa8');

      // 아래 안내
      if ((this.t % 1.2) < 0.75) {
        r.text('▶  P R E S S   E N T E R  ◀', S.W / 2, 186,
          { size: 13, color: '#ffffff', align: 'center' });
      }

      // 진열된 부품 아이콘 (데모 루프)
      var ids = ['p_hub', 'p_motor_m', 'p_dist', 'p_color', 'p_force', 'p_beam', 'p_pin_black', 'p_cable'];
      for (var k = 0; k < 8; k++) {
        var px = 24 + k * 44;
        var wob = Math.sin(this.t * 2 + k) * 2;
        var sp = S.Sprites.get(ids[k]);
        if (sp) {
          r.ctx.globalAlpha = 0.85;
          r.ctx.drawImage(sp, 0, 0, 32, 32, px, 218 + wob, 28, 28);
          r.ctx.globalAlpha = 1;
        }
      }

      r.window(4, S.H - 26, S.W - 8, 22, { alpha: 0.8 });
      r.text('중학생 학과체험 · SPIKE Prime 조립 & 블록코딩   |   F1 조작법', S.W / 2, S.H - 20,
        { size: 9, color: '#bcd2f0', align: 'center' });
    }
  };

  /* ================= 오프닝 ================= */
  var PAGES = [
    '로봇 왕국 「브릭시티」.\n이 나라의 모든 기계는 중앙의 허브 왕이 움직였다.',
    '그러나 어느 날, 뒤엉킨 케이블이 왕을 감쌌고\n5×5의 눈은 빛을 잃었다.',
    '멈춰버린 왕국. 남은 희망은 단 하나 —\n오늘 부임한 견습 메카닉, 바로 당신이다.',
    '부품을 익히고, 직접 손으로 조립하고,\n주문(코드)을 엮어 왕을 깨워라.',
    '제한 시간은 10분.\n…시작하자.'
  ];

  var Opening = {
    page: 0, t: 0, shown: 0, mw: null,

    enter: function () {
      this.page = 0; this.t = 0;
      this.mw = new S.MessageWindow({ y: S.H - 90, h: 74, speed: 48 });
      S.Audio.playBGM('title');
      this._show();
    },

    _show: function () {
      var self = this;
      this.mw.show({ text: PAGES[this.page] }, function () {
        self.page++;
        if (self.page >= PAGES.length) {
          S.State.chapter = 1;
          S.Game.transition('field', { map: 'village' });
        } else {
          self._show();
        }
      });
    },

    update: function (dt) {

      if (S.Input.pressed.cancel) {
        S.State.chapter = 1;
        S.Game.transition('field', { map: 'village' });
        return;
      }
      this.mw.update(dt);
    },

    draw: function (r) {
      r.vgradient(0, 0, S.W, S.H, '#05070f', '#141a34');

      // 잠든 허브
      var alt = S.Sprites.get('o_altar');

        r.ctx.globalAlpha = 0.35 + 0.1 * Math.sin(this.t);

      // 뒤엉킨 케이블

      if (cab) {
        r.ctx.globalAlpha = 0.5;
        r.ctx.drawImage(cab, (S.W - 128) / 2, 72, 128, 112);
        r.ctx.globalAlpha = 1;
      }

      this.mw.draw(r);
      r.text('X — 건너뛰기', S.W - 10, 8, { size: 9, color: '#7e93c0', align: 'right' });
    }
  };

  S.Game.register('attract', Attract);
  S.Game.register('opening', Opening);
})(SPIKE);

</script>
