<!doctype html><html><head><meta charset="utf-8"><title>overflow</title>
<link rel="stylesheet" href="../src/style.css"></head><body><pre id="r">scanning</pre>
<canvas id="game" style="display:none"></canvas>

<script src="../src/core/const.js"></script><script src="../src/core/font.js"></script>
<script src="../src/core/text.js"></script>
<script src="../src/core/renderer.js"></script><script src="../src/core/input.js"></script>
<script src="../src/core/audio.js"></script><script src="../src/core/sprites.js"></script>
<script src="../src/core/tiles.js"></script><script src="../src/core/sprites_parts.js"></script>
<script src="../src/core/state.js"></script><script src="../src/core/engine.js"></script>
<script src="../src/data/parts.js"></script><script src="../src/data/quiz.js"></script>
<script>
/* 게임에 나오는 모든 문자열의 실제 픽셀 폭을, 그 문자열이 들어갈 칸 폭과 비교한다.
   폰트를 바꾸면 폭이 달라지므로 눈으로 훑는 대신 수치로 잡는다. */
var CHECKS = [];   // {label, text, size, limit}
var bad0 = [];     // 줄 수로 잡은 넘침

function add(label, text, size, limit) {
  if (text == null || text === '') return;
  String(text).split('\n').forEach(function (ln) {
    CHECKS.push({ label: PRE + label, text: ln, size: size, limit: limit });
  });
}

var LANGS = ['ko', 'en'];
var KINDS = ['ui', 'dialogue', 'parts', 'quiz'];
var DATA = {}, PRE = '';
var jobs = [document.fonts.load('10px "Mona10"'), document.fonts.load('12px "Mona12"')];
LANGS.forEach(function (lg) {
  DATA[lg] = {};
  KINDS.forEach(function (kd) {
    jobs.push(fetch('../content/' + kd + '.' + lg + '.json')
      .then(function (r) { return r.json(); })
      .then(function (j) { DATA[lg][kd] = j; }));
  });
});
Promise.all(jobs).then(function () {
  return document.fonts.ready.then(function () {
  LANGS.forEach(function (LG) {
  var ui = DATA[LG].ui, dlg = DATA[LG].dialogue;
  SPIKE.Text.store[LG] = DATA[LG];
  SPIKE.Text.lang = LG;
  SPIKE.rebuildParts(); SPIKE.rebuildQuiz();
  PRE = LG + ' ';

    /* --- 가이드 패널 ---
       warn 과 body 는 줄바꿈되므로 폭이 아니라 "몇 줄이 되는가"를 본다.
       missionPanel._body 와 같은 폭·같은 한계를 쓴다. */
    function lines(text, size, w) { return SPIKE.Font.wrap(text, size, w).length; }
    ['find','motor','beam','flag','cable','code'].forEach(function (id) {
      var g = ui.guide[id] || {};
      add('guide.'+id+'.title(헤더)', g.title, 11, 192 - 48);
      add('guide.'+id+'.goal(분할HUD)', g.goal, 10, 192 - 26);

      if (g.warn) {
        var wl = lines(g.warn, 10, 192 - 42);
        if (wl > 2) bad0.push(PRE + 'guide.'+id+'.warn  ' + wl + '줄 > 2줄   「' + g.warn + '」');
      }
      var bl = 0;
      (g.body||[]).forEach(function (b, bi) {
        var n = lines(b, 10, 192 - 20);
        if (n > 1) bad0.push(PRE + 'guide.'+id+'.body['+bi+'] 가 '+n+'줄로 접힘   「'+b+'」');
        bl += n;
      });
      var room = g.warn ? 3 : 4;
      if (bl > room) bad0.push(PRE + 'guide.'+id+'.body  ' + bl + '줄 > ' + room + '줄');

      ['labelConnector','labelMotor','labelAxle','labelBeam','labelHub','labelHere','labelDone','caption']
        .forEach(function(k){ if(g[k]) add('guide.'+id+'.'+k, g[k], 10, 100); });
      if (id === 'find') Object.keys(ui.guide.parts).forEach(function (k) {
        add('guide.parts.' + k + '(셀42)', ui.guide.parts[k], 10, 40);
      });
    });

    /* --- 버튼 (54px 안쪽) --- */
    ['next','prev','done','doneAlready'].forEach(function(k){
      add('common.'+k+'(버튼54)', ui.common[k], 10, 54 - 6);
    });

    /* --- 주문서 블록 (패널 폭 192 - 여백, 들여쓴 줄은 더 좁다) --- */
    Object.keys(ui.code.blocks).forEach(function(k){
      var indent = (k === 'cw' || k === 'ccw');
      add('code.blocks.'+k, ui.code.blocks[k], 10, 192 - 16 - (indent?14:0) - 16 - 34);
    });
    ui.code.findIt.forEach(function(f,i){
      add('code.findIt['+i+'].name', f.name, 10, 80);
      add('code.findIt['+i+'].text', f.text, 10, 96);
    });
    add('code.findTitle', ui.code.findTitle, 10, 192-20);
    add('code.outro', ui.code.outro, 10, 192-20);

    /* --- 엔딩 (창 폭 260) --- */
    Object.keys(ui.ending.ranks).forEach(function(k){
      add('ending.ranks.'+k+'.word', ui.ending.ranks[k].word, 15, 384-40);
      add('ending.ranks.'+k+'.sub',  ui.ending.ranks[k].sub,  10, 384-40);
    });
    ['rowAccuracy','rowTime','rowDex'].forEach(function(k){
      add('ending.'+k, ui.ending[k], 11, 110);
    });
    add('ending.press', ui.ending.press, 10, 384-20);

    /* --- 퀘스트 HUD (전체폭 맵 376 / 분할맵 166) --- */
    Object.keys(ui.quest).forEach(function(k){
      add('quest.'+k, '◆ ' + ui.quest[k], 10, 376 - 18);
    });

    /* --- 타이틀 --- */
    add('title.footer', ui.title.footer, 9, 384-24);
    add('title.press', ui.title.press, 13, 384-20);

    /* --- 대사: 메시지창 (기본 창 폭 368, 분할 184, 아이콘 있으면 -40) --- */
    function walkD(o, path) {
      if (typeof o === 'string') { add('대사 ' + path, o, 12, 368 - 20); return; }
      if (Array.isArray(o)) { o.forEach(function(v,i){ walkD(v, path+'['+i+']'); }); return; }
      if (o && typeof o === 'object') { Object.keys(o).forEach(function(k){
        if (k === 'meta' || k === 'format') return;
        walkD(o[k], path ? path+'.'+k : k); }); }
    }
    walkD(dlg, '');

    /* --- 도감 (src/data/parts.js) ---
       우측 상세 패널: dx=142, dw=238. 설명은 dw-24, TIP 은 dw-56 폭으로 줄바꿈된다.
       설명 최대 줄 수는 TIP 높이에 따라 달라지므로 넉넉잡아 6줄로 본다. */
    var DW = 384 - 146;
    SPIKE.PARTS.forEach(function (p) {
      add('도감 '+p.id+'.title',  p.title, 13, DW - 88 - 10);
      add('도감 '+p.id+'.real',   p.real,   9, DW - 88 - 10);
      add('도감 '+p.id+'.one',    p.one,   10, DW - 88 - 10);
      var dl = 0;
      /* 도감 설명은 문단으로 이어 붙여 줄바꿈되므로 총 줄 수만 본다 */
      dl = lines(p.lines.join(' '), 10, DW - 24);
      if (dl > 6) bad0.push(PRE + '도감 '+p.id+'.lines  ' + dl + '줄 > 6줄');
      var tl = lines(p.tip, 9, DW - 56);
      if (tl > 3) bad0.push(PRE + '도감 '+p.id+'.tip  ' + tl + '줄 > 3줄');
    });

    /* --- 부품 카드 (scenes/cards.js) ---
       창 폭 344. 오른쪽 글칸은 tx=bx+120 부터 214px (도감 상세와 같은 폭).
       one 과 설명이 by+74 ~ by+178 (104px) 안에 다 들어가야 한다.
       one 은 16px/줄, 설명은 14px/줄, 사이 간격 4px.
       여기서 넘치면 화면 밖으로 나가지는 않고 아래가 조용히 잘린다 — 그래서 수치로 잡는다. */
    var CW = 344 - 120 - 10;
    SPIKE.PARTS.forEach(function (p) {
      var ol = lines(p.one, 11, CW);
      var dl = lines(p.lines.join(' '), 10, CW);
      var need = ol * 16 + 4 + dl * 14;
      if (need > 104) {
        bad0.push(PRE + '카드 ' + p.id + '  글 높이 ' + need + 'px > 104px' +
          '   (one ' + ol + '줄 + 설명 ' + dl + '줄)');
      }
      add('카드 ' + p.id + '.title', p.title, 14, CW);
      add('카드 ' + p.id + '.real', p.real, 10, CW);
      var ctl = lines(p.tip, 9, 344 - 52);
      if (ctl > 2) bad0.push(PRE + '카드 ' + p.id + '.tip  ' + ctl + '줄 > 2줄   「' + p.tip + '」');
    });

    /* --- 퀴즈 (src/data/quiz.js) ---
       문제문: 폭 S.W-40. 보기: 2열 버튼 (S.W-24)/2 - 16. 해설: 메시지창(자동 페이지). */
    Object.keys(SPIKE.QUIZ).forEach(function (set) {
      SPIKE.QUIZ[set].forEach(function (q, qi) {
        var tag = '퀴즈 '+set+'['+qi+']';
        if (lines(q.q, 11, 384 - 40) > 2) bad0.push(PRE + tag+'.q  2줄 초과   「'+q.q+'」');
        q.choices.forEach(function (c, ci) {
          add(tag+'.choices['+ci+']', c, 10, ((384 - 24) / 2 | 0) - 16);
        });
        if (q.act) add(tag+'.act', q.act, 12, 384 - 60);
      });
    });

    }); /* LANGS 끝 */

    /* --- 판정 --- */
    var bad = bad0.slice();
    CHECKS.forEach(function (c) {
      var w = SPIKE.Font.measure(c.text, c.size);
      if (w > c.limit) bad.push(c.label + '  폭 ' + w + ' > ' + c.limit + '   「' + c.text + '」');
    });
    document.getElementById('r').textContent =
      bad.length ? (bad.length + '건 넘침\n' + bad.join('\n')) : '넘침 없음 (' + CHECKS.length + '건 검사)';
    document.title = 'READY';
  });
}).catch(function(e){ document.getElementById('r').textContent = 'ERR ' + e.message; document.title='READY'; });
</script></body></html>
